wrong":{"A":"Minerals are naturally occurring inorganic solids (often compounds).","C":"Metals are one category of elements.","D":"Molecules are two or more bonded atoms."},"note":""},{"ch":2,"n":6,"sec":"02.03","bloom":2,"ctx":null,"stem":"Sugars dissolve well in water because of water's ________.","opts":["ionic bonds","cohesiveness","hydrophobic exclusion","polarity"],"ans":["D"],"why":"Water's partial charges (δ⁻ O, δ⁺ H) form hydrogen bonds with sugar's many –OH groups, surrounding each sugar molecule. That's possible because water is <b>polar<\/b>.","wrong":{"A":"Water's atoms are joined by polar covalent bonds, not ionic bonds.","B":"Cohesion is water sticking to water — it explains surface tension, not dissolving.","C":"Hydrophobic exclusion explains why nonpolar substances <i>don't<\/i> dissolve."},"note":""},{"ch":2,"n":7,"sec":"02.06","bloom":1,"ctx":null,"stem":"The negative logarithm of the hydrogen ion concentration in the solution is referred to as:","opts":["pH","atomic mass","-OH concentration","electronegativity","specific heat"],"ans":["A"],"why":"<b>pH = −log[H⁺]<\/b>.","wrong":{"B":"Mass of protons + neutrons.","C":"−log[OH⁻] is pOH.","D":"An atom's pull on shared electrons.","E":"Energy needed to raise 1 g by 1 °C."},"note":""},{"ch":2,"n":8,"sec":"02.06","bloom":2,"ctx":null,"stem":"Bicarbonate ions in the blood can absorb hydrogen ions, keeping pH balanced. Bicarbonate is acting as a ________ in blood.","opts":["buffer","acid","base","alkaline"],"ans":["A"],"why":"A <b>buffer<\/b> resists pH change: HCO₃⁻ + H⁺ ⇌ H₂CO₃ ⇌ CO₂ + H₂O. Blood pH is held at 7.35–7.45 by this system, with the lungs (CO₂) and kidneys (HCO₃⁻) adjusting it.","wrong":{"B":"An acid donates H⁺; bicarbonate is taking them up.","C":"Bicarbonate does accept H⁺ like a base, but \"keeping pH balanced\" describes the buffer role of the acid–base pair.","D":"\"Alkaline\" describes pH > 7, not a role."},"note":""},{"ch":2,"n":9,"sec":"02.01","bloom":1,"ctx":null,"stem":"Atomic nuclei contain protons and ________.","opts":["isomers","ions","moles","neutrons"],"ans":["D"],"why":"The nucleus = protons + <b>neutrons<\/b>; electrons orbit outside.","wrong":{"A":"Isomers are molecules with the same formula but different structure.","B":"Ions are charged atoms.","C":"A mole is an amount (6.02 × 10²³)."},"note":""},{"ch":2,"n":10,"sec":"02.01","bloom":1,"ctx":null,"stem":"Carbon-12, Carbon-13 and Carbon-14 are examples of:","opts":["ions","isotopes","isomers","molecules"],"ans":["B"],"why":"All have 6 protons (carbon) but 6, 7 or 8 neutrons → <b>isotopes<\/b>.","wrong":{"A":"Ions differ in electrons, not neutrons.","C":"Isomers are molecules.","D":"These are single atoms, not bonded molecules."},"note":""},{"ch":2,"n":11,"sec":"02.01","bloom":1,"ctx":null,"stem":"Organisms are composed of molecules, which are collections of smaller units, termed:","opts":["monomers.","atoms.","electrons.","polymers.","ions."],"ans":["B"],"why":"Molecules are built from <b>atoms<\/b> bonded together.","wrong":{"A":"Monomers are units of polymers (macromolecules), not of every molecule.","C":"Electrons are subatomic particles.","D":"Polymers are large molecules themselves.","E":"Ions are charged atoms."},"note":""},{"ch":2,"n":12,"sec":"02.01","bloom":1,"ctx":null,"stem":"Negatively charged subatomic particles that have almost no mass are called:","opts":["electrons.","protons.","neutrons.","ions.","polymers."],"ans":["A"],"why":"<b>Electrons<\/b>: −1 charge, ~1/1840 the mass of a proton.","wrong":{"B":"Protons are positive with mass ~1 Da.","C":"Neutrons are neutral with mass ~1 Da.","D":"Ions are whole charged atoms.","E":"Polymers are large molecules."},"note":""},{"ch":2,"n":13,"sec":"02.01","bloom":1,"ctx":null,"stem":"Atoms of a single element that possess different numbers of neutrons are called:","opts":["polymers.","ions.","monomers.","isomers.","isotopes."],"ans":["E"],"why":"Same protons, different neutrons → <b>isotopes<\/b>.","wrong":{"A":"Polymers are chains of monomers.","B":"Ions differ in electrons.","C":"Monomers are subunits of polymers.","D":"Isomers are molecules with the same formula, different arrangement."},"note":""},{"ch":2,"n":14,"sec":"02.01","bloom":2,"ctx":null,"stem":"Cl + e<sup>−<\/sup> → Cl<sup>−<\/sup> is an example of a:","opts":["oxidation.","reduction.","polymerization.","ionization."],"ans":["B"],"why":"Gaining an electron = <b>reduction<\/b> (OIL RIG: Oxidation Is Loss, Reduction Is Gain).","wrong":{"A":"Oxidation is losing electrons.","C":"Polymerization joins monomers.","D":"An ion does form, but the specific term for gaining electrons is reduction."},"note":""},{"ch":2,"n":15,"sec":"02.03","bloom":2,"ctx":null,"stem":"When atoms gain or lose electrons, they become negatively or positively charged. These negatively or positively charged atoms are known as","opts":["isotopes.","ions.","isomers.","unstable atoms."],"ans":["B"],"why":"Electrons ≠ protons → net charge → <b>ion<\/b> (cation if +, anion if −).","wrong":{"A":"Isotopes differ in neutrons.","C":"Isomers are molecules.","D":"\"Unstable atoms\" suggests radioactive isotopes."},"note":""},{"ch":2,"n":16,"sec":"02.03","bloom":1,"ctx":null,"stem":"When two atoms share a pair of electrons, the bonding is referred to as:","opts":["ionic.","covalent.","unstable.","hydrogen."],"ans":["B"],"why":"Sharing an electron pair = <b>covalent<\/b> bond.","wrong":{"A":"Ionic bonds come from electron <i>transfer<\/i> and attraction of opposite charges.","C":"Not a bond type.","D":"Hydrogen bonds are weak attractions between partial charges — nothing is shared."},"note":""},{"ch":2,"n":17,"sec":"02.04","bloom":2,"ctx":null,"stem":"Water molecules are polar with ends that exhibit partial positive and negative charges. These opposite charges allow water molecules to attract each other through:","opts":["ionic bonds.","covalent bonds.","hydrogen bonds.","peptide bonds."],"ans":["C"],"why":"δ⁺ H of one water attracted to δ⁻ O of another = <b>hydrogen bond<\/b>.","wrong":{"A":"Ionic bonds need full charges.","B":"Covalent bonds hold H to O <i>within<\/i> one water molecule.","D":"Peptide bonds link amino acids."},"note":""},{"ch":2,"n":18,"sec":"02.02","bloom":3,"ctx":null,"stem":"An atom has 20 electrons and 20 neutrons. What is the mass of this atom?","opts":["10","20","40","80"],"ans":["C"],"why":"Neutral atom: electrons = protons = 20. Mass ≈ protons + neutrons = 20 + 20 = <b>40<\/b> (electrons are negligible). This is calcium-40.","wrong":{"A":"No basis — halving.","B":"That's the atomic number (protons only).","D":"Double-counted."},"note":""},{"ch":2,"n":19,"sec":"02.05","bloom":3,"ctx":null,"stem":"Sue was monitoring the oil spill into the Gulf of Mexico from an oil tanker. From her observations, she noted that the oil was moving as large patches in the water. It did not appear as though the oil was dissolving into the water. Why did the oil not dissolve into the water?","opts":["Hydrophobic interactions","Surface tension","Sea water acts as a solvent","Water forms hydration shells","Water has a high heat of vaporization"],"ans":["A"],"why":"Oil is nonpolar (C–H bonds share electrons evenly) so it can't hydrogen-bond with water. Water molecules hydrogen-bond with each other and squeeze oil out, so oil clusters — <b>hydrophobic interactions<\/b>.","wrong":{"B":"Surface tension makes the surface act like a film; it doesn't explain why oil won't mix.","C":"Water dissolves polar and ionic substances, not oil.","D":"Hydration shells form around ions/polar molecules — exactly what doesn't happen with oil.","E":"Heat of vaporization relates to evaporation."},"note":""},{"ch":2,"n":20,"sec":"02.01","bloom":1,"ctx":null,"stem":"The atomic number of an element is equal to the number of:","opts":["protons only.","neutrons only.","protons plus electrons.","protons plus neutrons.","neutrons plus electrons."],"ans":["A"],"why":"Atomic number = <b>protons<\/b>.","wrong":{"B":"Neutrons determine the isotope.","C":"Not a standard quantity.","D":"That's the mass number.","E":"Not a standard quantity."},"note":""},{"ch":2,"n":21,"sec":"02.02","bloom":3,"ctx":null,"stem":"Oxygen has an atomic mass of 16 and an atomic number of 8. How many neutrons are present?","opts":["24","8","16","4"],"ans":["B"],"why":"Neutrons = mass − atomic number = 16 − 8 = <b>8<\/b>.","wrong":{"A":"Added instead of subtracting.","C":"That's the mass number.","D":"Halved by mistake."},"note":""},{"ch":2,"n":22,"sec":"02.06","bloom":3,"ctx":null,"stem":"The pH of your small intestines is around 7.5 and the pH of your large intestine can be 5.5. As substances travel from the small intestines to the large intestine, what would happen to the H<sup>+<\/sup> ion concentration?","opts":["It decreases 100-fold.","It increases by 100-fold.","It increases 10-fold.","It increases 2-fold.","It decreases 10-fold."],"ans":["B"],"why":"pH drops by 2 units. Each unit = 10× change, and lower pH = more H⁺. So [H⁺] rises 10² = <b>100-fold<\/b>.","wrong":{"A":"Wrong direction — lower pH means more H⁺.","C":"10-fold would be one pH unit.","D":"pH is logarithmic, not linear.","E":"Wrong direction and wrong magnitude."},"note":""},{"ch":2,"n":23,"sec":"02.01","bloom":2,"ctx":null,"stem":"Oxygen-16 is abundant and has 8 protons and 8 neutrons. Oxygen-18 has two extra neutrons. These two forms are:","opts":["oxygen ions.","oxygen isotopes.","oxygen isomers.","oxygen dimers."],"ans":["B"],"why":"Same element, different neutrons → <b>isotopes<\/b>. (¹⁸O ratios in fossils and ice cores are used to reconstruct past climates.)","wrong":{"A":"Ions differ in electrons.","C":"Isomers are molecules.","D":"Dimers are two units joined (e.g., O₂)."},"note":""},{"ch":2,"n":24,"sec":"02.01","bloom":1,"ctx":null,"stem":"Which element's isotope is commonly used to determine when biological samples such as fossils, were formed?","opts":["oxygen","hydrogen","carbon","nitrogen","sulfur"],"ans":["C"],"why":"Living organisms take in ¹⁴C; after death it decays with a half-life of ~5,700 years → <b>carbon dating<\/b>.","wrong":{"A":"Not used for this kind of dating.","B":"Not used for this kind of dating.","D":"Not used for this kind of dating.","E":"Not used for this kind of dating."},"note":""},{"ch":2,"n":25,"sec":"02.02","bloom":2,"ctx":null,"stem":"Atoms in which the number of electrons does not equal the number of protons are known as:","opts":["valences.","ions.","isotopes.","isomers."],"ans":["B"],"why":"Electron ≠ proton count → net charge → <b>ion<\/b>.","wrong":{"A":"Valence describes bonding capacity.","C":"Isotopes differ in neutrons.","D":"Isomers are molecules."},"note":""},{"ch":2,"n":26,"sec":"02.01","bloom":1,"ctx":null,"stem":"The area around a nucleus where an electron is most likely to be found is the:","opts":["electrical space.","energy level.","polar space.","orbital."],"ans":["D"],"why":"An <b>orbital<\/b> is the region where an electron spends ~90% of its time.","wrong":{"A":"Not a term.","B":"An energy level (shell) contains orbitals; it describes energy, not the specific probable region.","C":"Not a term."},"note":""},{"ch":2,"n":27,"sec":"02.01","bloom":1,"ctx":null,"stem":"Regardless of its shape, a given orbital may contain no more than:","opts":["1 electron.","4 electrons.","8 electrons.","2 electrons."],"ans":["D"],"why":"Each orbital holds a maximum of <b>2<\/b> electrons (opposite spins).","wrong":{"A":"An orbital can hold a pair.","B":"Not an orbital capacity.","C":"That's the capacity of the second shell (4 orbitals × 2)."},"note":""},{"ch":2,"n":28,"sec":"02.01","bloom":2,"ctx":null,"stem":"All atoms tend to fill their outer energy levels with the maximum number of electrons, usually eight. Depending on whether atoms satisfy the octet rule will predict:","opts":["the chemical behavior of the atoms.","whether they will be found in nature.","whether they will dissolve in water.","their radioactive energy."],"ans":["A"],"why":"Atoms react (gain, lose, or share electrons) to fill their valence shell, so the octet rule predicts <b>chemical reactivity<\/b> and bonding.","wrong":{"B":"Occurrence in nature isn't predicted by the octet rule.","C":"Solubility depends on polarity and charge.","D":"Radioactivity is a nuclear property, unrelated to electron shells."},"note":""},{"ch":2,"n":29,"sec":"02.02","bloom":1,"ctx":null,"stem":"Mendeleev found that when he arranged the known elements according to their atomic mass, the entries in the table exhibited a pattern of chemical properties that repeated itself in groups of eight elements. This led to the generalization now known as:","opts":["an atomic model.","valence electrons.","the periodic table.","the octet rule."],"ans":["D"],"why":"The repeating pattern every eight elements reflects atoms' tendency to fill an outer shell of 8 → the <b>octet rule<\/b>.","wrong":{"A":"The atomic model describes atom structure.","B":"Valence electrons are the underlying cause, but not the \"generalization.\"","C":"Tempting — the periodic table is Mendeleev's <i>arrangement<\/i>; the generalization drawn from its groups of 8 is the octet rule."},"note":"Many students pick \"periodic table.\" The testbank's answer hinges on the word \"generalization.\""},{"ch":2,"n":30,"sec":"02.03","bloom":3,"ctx":null,"stem":"Sodium has 11 electrons arranged in three energy levels. In order to become stable, sodium forms an ion with:","opts":["no charge.","-1 charge.","-8 charge.","+1 charge.","+8 charge."],"ans":["D"],"why":"Na: 2, 8, 1. Losing the single outer electron exposes a full shell of 8 → Na⁺ (<b>+1<\/b>).","wrong":{"A":"Sodium readily forms an ion.","B":"−1 would mean gaining an electron.","C":"Gaining electrons is energetically unfavorable here.","E":"Would require stripping the full second shell."},"note":""},{"ch":2,"n":31,"sec":"02.03","bloom":1,"ctx":null,"stem":"In the crystal matrix of ordinary salt, the sodium and chlorine are held together by:","opts":["peptide bonds.","covalent bonds.","ionic bonds.","hydrogen bonds.","nonpolar bonds."],"ans":["C"],"why":"Na gives its electron to Cl → Na⁺ and Cl⁻ attract in a lattice = <b>ionic bonds<\/b>.","wrong":{"A":"Peptide bonds link amino acids.","B":"Electrons are transferred, not shared (huge electronegativity difference).","D":"Hydrogen bonds involve partial charges.","E":"Nonpolar bonds share electrons equally."},"note":""},{"ch":2,"n":32,"sec":"02.03","bloom":1,"ctx":null,"stem":"Two oxygen atoms joined to each other by the sharing of two pairs of electrons form a(n):","opts":["single bond.","ionic bond.","hydrogen bond.","double covalent bond."],"ans":["D"],"why":"Two shared pairs = <b>double covalent bond<\/b> (O=O).","wrong":{"A":"A single bond shares one pair.","B":"Ionic bonds involve transfer.","C":"Hydrogen bonds need a δ⁺ H and share nothing."},"note":""},{"ch":2,"n":33,"sec":"02.02","bloom":2,"ctx":null,"stem":"In a chemical analysis of an animal tissue sample, which element would be in the least quantity?","opts":["carbon","hydrogen","nitrogen","oxygen","iodine"],"ans":["E"],"why":"C, H, O and N make up ~96% of body mass. <b>Iodine<\/b> is a trace element needed only in tiny amounts for thyroid hormones (T₃/T₄). Deficiency causes goiter and hypothyroidism.","wrong":{"A":"Major element.","B":"Major element.","C":"Major element.","D":"Most abundant by mass."},"note":""},{"ch":2,"n":34,"sec":"02.04","bloom":2,"ctx":null,"stem":"Life is thought to have evolved from complex molecules formed by the interaction of smaller molecules in oceans and the atmosphere. The substance which brought these molecules together to interact is","opts":["hydrogen.","acids.","water.","buffers.","salts."],"ans":["C"],"why":"<b>Water<\/b> is the solvent in which molecules dissolve, meet and react.","wrong":{"A":"An element, not a medium.","B":"Acids are solutes, not the medium.","D":"Buffers are solutes, not the medium.","E":"Salts are solutes, not the medium."},"note":""},{"ch":2,"n":35,"sec":"02.03","bloom":1,"ctx":null,"stem":"Because oxygen is more electronegative than hydrogen, the water molecule is:","opts":["hydrophobic.","hydrophilic.","nonpolar.","ionic.","polar."],"ans":["E"],"why":"O pulls shared electrons toward itself (δ⁻) leaving H's δ⁺; with water's bent shape, the molecule is <b>polar<\/b>.","wrong":{"A":"Opposite.","B":"Describes how other substances interact with water; the property of water itself is polarity.","C":"Opposite.","D":"Bonds within water are polar covalent, not ionic."},"note":""},{"ch":2,"n":36,"sec":"02.04","bloom":2,"ctx":null,"stem":"Water molecules are attracted to each other due to the opposite charges created by partial charge separations within the molecules. These attractions are called:","opts":["peptide bonds.","covalent bonds.","ionic bonds.","hydrogen bonds.","double bonds."],"ans":["D"],"why":"Attraction between δ⁺ H and δ⁻ O on neighboring molecules = <b>hydrogen bonds<\/b>.","wrong":{"A":"Link amino acids.","B":"Hold atoms together <i>within<\/i> a molecule.","C":"Require full charges.","E":"A type of covalent bond."},"note":""},{"ch":2,"n":37,"sec":"02.04","bloom":3,"ctx":null,"stem":"How many hydrogen bonds can a water molecule form?","opts":["1","2","3","4","5"],"ans":["D"],"why":"Each water has 2 H atoms (each can donate one H-bond) and an O with 2 lone pairs (each can accept one) → <b>4<\/b>, giving ice its tetrahedral lattice.","wrong":{"A":"Undercount.","B":"Counts only the H atoms (or only the O).","C":"Undercount.","E":"No fifth bonding site exists."},"note":""},{"ch":2,"n":38,"sec":"02.05","bloom":3,"ctx":null,"stem":"Nitrogen has a higher electronegativity than hydrogen. As a result you would expect that ammonia (NH<sub>3<\/sub>) molecules can form ________ with each other.","opts":["hydrogen bonds","hydrophilic bonds","ionic bonds","covalent bonds","cohesive bonds"],"ans":["A"],"why":"N–H bonds are polar (δ⁻ N, δ⁺ H). The δ⁺ H of one NH₃ is attracted to the δ⁻ N of another → <b>hydrogen bond<\/b>.","wrong":{"B":"Not a bond type.","C":"Partial, not full, charges.","D":"Covalent bonds are within each molecule, not between molecules.","E":"Cohesion is a result of hydrogen bonding, not a bond type."},"note":""},{"ch":2,"n":39,"sec":"02.05","bloom":2,"ctx":null,"stem":"When water ionizes, it produces equal amounts of hydrogen and hydroxide ions that can reassociate with each other. The pH of water is:","opts":["3","4","5","6","7"],"ans":["E"],"why":"[H⁺] = [OH⁻] = 10⁻⁷ M → pH <b>7<\/b> (neutral).","wrong":{"A":"Acidic.","B":"Acidic.","C":"Acidic.","D":"Slightly acidic."},"note":""},{"ch":2,"n":40,"sec":"02.01","bloom":2,"ctx":null,"stem":"A scientist conducts a procedure that causes nitrogen atoms to gain neutrons. The resulting atoms will be:","opts":["ions of nitrogen.","positively charged.","negatively charged.","isotopes of nitrogen.","new elements with higher atomic numbers."],"ans":["D"],"why":"Changing neutrons changes mass only — same element, new <b>isotope<\/b>.","wrong":{"A":"Ions require gaining/losing electrons.","B":"Neutrons have no charge.","C":"Neutrons have no charge.","E":"A new element requires changing the proton number."},"note":""},{"ch":2,"n":41,"sec":"02.01","bloom":4,"ctx":null,"stem":"The half-life of Carbon-14 is approximately 5,700 years. Using this information scientists have been able to determine the age of some artifacts left by humans. A scientist wants to know approximately how old a piece of wood was that she found on the floor in an old cave that had recently been discovered. She removed the wood (with permission) to her laboratory. Her wood sample contained 2 grams of Carbon-14. If the age of the wood was determined to be 22,800 years old, how much Carbon-14 originally existed in this piece of wood?","opts":["32 grams","16 grams","12 grams","8 grams","4 grams"],"ans":["A"],"why":"22,800 ÷ 5,700 = 4 half-lives. Remaining = original × (½)⁴ = original ÷ 16. So original = 2 g × 16 = <b>32 g<\/b>.","wrong":{"B":"That's 3 half-lives.","C":"No half-life relationship gives this.","D":"Common mistake: thinking 4 half-lives = 4-fold decrease (2 × 4). Each half-life halves again.","E":"That's 1 half-life."},"note":""},{"ch":2,"n":42,"sec":"02.04","bloom":3,"ctx":null,"stem":"Plants transport water to their leaves through the xylem when water evaporates from the leaves. The evaporating water pulls other water molecules up the xylem through ________.","opts":["Hydrogen bonds","Ionic bonds","Covalent bonds","Hydrophobic interactions"],"ans":["A"],"why":"<b>Hydrogen bonds<\/b> link water molecules into a continuous column (cohesion), so each evaporating molecule tugs the next one up — the cohesion–tension mechanism.","wrong":{"B":"Water has partial, not full, charges.","C":"Covalent bonds are within each molecule, not between molecules.","D":"Water is polar; hydrophobic interactions involve nonpolar molecules."},"note":""},{"ch":2,"n":43,"sec":"02.05","bloom":2,"ctx":null,"stem":"Water is most dense and thus heaviest at 4°C. At 0°C, ice forms and can float on liquid water. Suppose ice were most dense at 0°C. What would happen in a lake at this temperature?","opts":["The ice would cover the surface of the aquatic system and would never melt.","The ice would cover the bottom of the aquatic system and would build up in layers over time.","Ice would not form because solids are always less dense than liquids.","The cold temperatures and the subsequent ice formation would prevent hydrogen bonds from forming between the water molecules, thus causing the existing ice crystals to become disassociated from each other."],"ans":["B"],"why":"If ice were denser, it would <b>sink<\/b>, and lakes would freeze from the bottom up in layers. In reality, the H-bond lattice spaces molecules apart, so ice floats and insulates the water below.","wrong":{"A":"Floating is what real (less dense) ice does — the scenario says denser.","C":"False — most solids are <i>denser<\/i> than their liquids; water is a rare exception.","D":"Freezing makes hydrogen bonds more stable, not fewer."},"note":""},{"ch":2,"n":44,"sec":"02.06","bloom":3,"ctx":null,"stem":"Your dog becomes ill and you rush him to the veterinarian's office. A technician draws blood from your dog's leg for a vet-ordered lab test. After a few minutes the lab results are given to the vet, who immediately grabs a bottle from a shelf and begins to fill a syringe with an unknown fluid. You inquire about the fluid, and the vet informs you that the fluid is necessary to manage your dog's metabolic acidosis. Based on the information provided, what is acidosis, and what is the likely effect of the veterinarian's injection?","opts":["Acidosis means that your dog's blood pH has dropped from its normal level, and an injection of saline is required to reverse the condition.","Acidosis means that your dog's blood pH has increased from its normal level, and an injection of saline is required to reverse the condition.","Acidosis means that your dog's blood pH has decreased from its normal level, and an injection of buffering solution is required to reverse the condition.","Acidosis means that your dog's blood pH has increased from its normal level, and an injection of buffering solution is required to reverse the condition."],"ans":["C"],"why":"Acidosis = blood pH <b>below normal<\/b> (too much H⁺). A <b>buffer<\/b> such as sodium bicarbonate soaks up the excess H⁺ and raises pH back toward 7.4.","wrong":{"A":"Saline is salt water; it doesn't neutralize acid.","B":"Increased pH would be alkalosis.","D":"Increased pH would be alkalosis."},"note":""},{"ch":2,"n":45,"sec":"02.01","bloom":2,"ctx":null,"stem":"As you and a friend are entering a chemistry laboratory at your university, you see a sign that states: DANGER—RADIOACTIVE ISOTOPES IN USE. Your friend is an accounting major and has not had any science courses yet. She asks you what a radioactive isotope is and you respond correctly with:","opts":["Radioactive isotopes are atoms that are unstable and as a result emit energy in a process called radioactive decay.","Radioactive isotopes are atoms that are stable and as a result emit energy in a process called radioactive decay.","Radioactive isotopes are atoms that are stable and as a result only emit energy if they are exposed to higher temperatures.","Radioactive isotopes are atoms that are unstable but unless actively disturbed by some chemical process will remain intact and pose no problems."],"ans":["A"],"why":"Unstable nuclei <b>spontaneously decay<\/b>, emitting energy/particles.","wrong":{"B":"Stable isotopes don't decay.","C":"Decay is spontaneous and independent of temperature.","D":"Decay happens on its own, without disturbance."},"note":""},{"ch":2,"n":46,"sec":"02.03","bloom":2,"ctx":null,"stem":"To increase the rate of a reaction you could:","opts":["Add more products.","Decrease the temperature.","Add more reactants.","remove a catalyst"],"ans":["C"],"why":"More reactant molecules → more collisions per second → <b>faster forward rate<\/b>.","wrong":{"A":"Adding products pushes the reaction backward.","B":"Cooler molecules move slower and collide less.","D":"Catalysts lower activation energy; removing one slows the reaction."},"note":""},{"ch":2,"n":47,"sec":"02.03","bloom":3,"ctx":null,"stem":"The two nitrogen atoms in nitrogen gas (N<sub>2<\/sub>) share six electrons forming a ________.","opts":["triple covalent bond","double covalent bond","single covalent bond","hydrogen bond","double bond"],"ans":["A"],"why":"6 shared electrons = 3 pairs = <b>triple bond<\/b> (N≡N). It's so strong that, in living things, only the enzyme nitrogenase (found in certain prokaryotes) can break it to \"fix\" nitrogen.","wrong":{"B":"A double bond shares 4 electrons.","C":"A single bond shares 2 electrons.","D":"Hydrogen bonds share no electrons.","E":"A double bond shares 4 electrons."},"note":""},{"ch":2,"n":48,"sec":"02.04","bloom":2,"ctx":null,"stem":"Capillary action is one of the forces that aids water's upward movement in plants. The narrower the diameter of the tube, the farther the water column will rise. Capillary action is a result of water molecules:","opts":["storing heat and thus moving faster because of heat of vaporization.","producing sufficient surface tension to overcome the pull of gravity.","having a strong cohesive force and attaching to the surrounding vessel walls.","having an adhesive force, which allows them to attach to the vessel walls.","being associated with hydrophobic molecules, which can result in upward movement."],"ans":["D"],"why":"Water <b>adheres<\/b> (hydrogen-bonds) to the polar walls of narrow tubes and climbs them; cohesion then drags neighboring molecules along.","wrong":{"A":"Heat of vaporization is about evaporation.","B":"Surface tension helps but doesn't attach water to the walls.","C":"Mislabels — water sticking to <i>walls<\/i> is adhesion; cohesion is water–water.","E":"Hydrophobic molecules repel water."},"note":""},{"ch":2,"n":49,"sec":"02.01","bloom":1,"ctx":null,"stem":"Which atomic particle has no charge and is located in the nucleus?","opts":["electron","ion","neutron","proton","isotope"],"ans":["C"],"why":"<b>Neutron<\/b>: neutral, in the nucleus.","wrong":{"A":"Negative, outside the nucleus.","B":"A charged atom.","D":"Positive.","E":"A version of an element."},"note":""},{"ch":2,"n":50,"sec":"02.01","bloom":1,"ctx":null,"stem":"The sub-atomic particle with a positive charge is ________.","opts":["an electron","an ion","a neutron","a proton","an isotope"],"ans":["D"],"why":"<b>Proton<\/b>: +1, in the nucleus.","wrong":{"A":"Negative.","B":"A whole charged atom, not a subatomic particle.","C":"Neutral.","E":"A version of an element."},"note":""},{"ch":2,"n":51,"sec":"02.01","bloom":1,"ctx":null,"stem":"The smallest subatomic particle is the ________.","opts":["electron","ion","isotope","neutron","proton"],"ans":["A"],"why":"The <b>electron<\/b> has ~1/1840 the mass of a proton.","wrong":{"B":"Not subatomic.","C":"Not subatomic.","D":"~Same mass as a proton.","E":"Much heavier than an electron."},"note":""},{"ch":2,"n":52,"sec":"02.02","bloom":1,"ctx":null,"stem":"An atom that is negatively charged because it has accepted an electron is a(n):","opts":["isomer.","ion.","isotope.","monomer."],"ans":["B"],"why":"Extra electron → net negative → an <b>ion<\/b> (anion).","wrong":{"A":"Isomers are molecules.","C":"Isotopes differ in neutrons.","D":"Monomers are polymer subunits."},"note":""},{"ch":2,"n":53,"sec":"02.05","bloom":3,"ctx":null,"stem":"One mole of a substance contains 6.02 × 10<sup>23<\/sup> molecules. The atomic number of Li is 3 and the atomic mass is approximately 7. If you have three moles of Li, how many grams does it weigh?","opts":["9","21","7 × 6.02 × 10<sup>23<\/sup>","3 × 6.02 × 10<sup>23<\/sup>"],"ans":["B"],"why":"Grams = moles × molar mass = 3 mol × 7 g/mol = <b>21 g<\/b>.","wrong":{"A":"Used the atomic number (3 × 3).","C":"Mixes units — multiplies mass by Avogadro's number.","D":"That's the <i>number of atoms<\/i> in 3 moles, not grams."},"note":""},{"ch":2,"n":54,"sec":"02.06","bloom":3,"ctx":null,"stem":"After taking your biology exam, you return to your car only to find that you had left the lights on and now the car battery is dead. Your friend offers to jump-start your car, but when you go to hook up the jumper cables you find that the battery terminals are covered with corrosion due to battery acid condensation. Based off your knowledge, what substance could be used to clean the corrosion?","opts":["coffee (pH of 5)","water (pH of 7)","vinegar (pH of 3)","baking soda (pH of 9)"],"ans":["D"],"why":"Neutralize an acid with a <b>base<\/b>: baking soda (NaHCO₃) reacts with H⁺ to make CO₂ and water.","wrong":{"A":"Coffee is acidic — it adds acid.","B":"Neutral water dilutes but doesn't neutralize.","C":"Vinegar is acidic."},"note":""},{"ch":2,"n":55,"sec":"02.02","bloom":2,"ctx":null,"stem":"The amino acid glycine (C<sub>3<\/sub>NO<sub>2<\/sub>H<sub>6<\/sub>) is a(an):","opts":["organic molecule","inorganic molecule","element","vitamin"],"ans":["A"],"why":"Carbon backbone with C–H bonds → <b>organic<\/b>.","wrong":{"B":"Inorganic molecules lack a C–H framework (water, salts, CO₂).","C":"An element contains only one kind of atom.","D":"Vitamins are organic micronutrients we must eat; glycine is a nonessential amino acid we make ourselves."},"note":"Glycine's actual formula is C₂H₅NO₂ — the testbank's formula is a typo, but the answer is unaffected."},{"ch":2,"n":56,"sec":"02.03","bloom":4,"ctx":null,"stem":"Consider the following electronegativity values:<br>Boron (B) = 1.8<br>Carbon (C) = 2.5<br>Chlorine (Cl) = 3.2<br>Selenium (Se) = 2.6<br>Which of the following bonds is the most polar?","opts":["B-Cl","C-Cl","Se-Cl","It cannot be determined from the information provided."],"ans":["A"],"why":"Polarity grows with the electronegativity difference: B–Cl = 1.4, C–Cl = 0.7, Se–Cl = 0.6. <b>B–Cl<\/b> is the most polar.","wrong":{"B":"Difference of 0.7.","C":"Difference of 0.6 — the least polar.","D":"You can determine it by subtraction."},"note":""},{"ch":2,"n":57,"sec":"02.01","bloom":3,"ctx":null,"stem":"The reaction (H<sub>2<\/sub> + F<sub>2<\/sub> → 2HF) is an example of a redox reaction. In reality, two half reactions are occurring. The half reaction (H<sub>2<\/sub> → 2H<sup>+<\/sup> + 2e<sup>−<\/sup>) is a(n):","opts":["reduction reaction","oxidation reaction","redox reaction","potential energy reaction"],"ans":["B"],"why":"H₂ <b>loses<\/b> electrons → oxidation (OIL). The matching reduction half is F₂ + 2e⁻ → 2F⁻.","wrong":{"A":"Reduction is gaining electrons.","C":"\"Redox\" is the whole paired reaction; this is one half.","D":"Not a reaction type."},"note":""},{"ch":2,"n":58,"sec":"02.01","bloom":3,"ctx":null,"stem":"The electronic configuration of the noble gas Neon, which has an atomic number of 10, can be written as follows: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup>. What is the electronic configuration of the noble gas Argon, which has an atomic number of 18?","opts":["1s<sup>2<\/sup>2s<sup>2<\/sup>3p<sup>6<\/sup>4s<sup>2<\/sup>5p<sup>6<\/sup>","1s<sup>2<\/sup>2s<sup>6<\/sup>2p<sup>2<\/sup>3s<sup>6<\/sup>3p<sup>2<\/sup>","1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup>3s<sup>2<\/sup>3p<sup>6<\/sup>","1s<sup>2<\/sup>2s<sup>8<\/sup>3p<sup>8<\/sup>"],"ans":["C"],"why":"Argon has 8 more electrons than neon, filling the third shell the same way: 3s² 3p⁶ → <b>1s²2s²2p⁶3s²3p⁶<\/b> (total 18).","wrong":{"A":"Skips 2p and uses 4s/5p out of order.","B":"An s orbital holds at most 2, not 6.","D":"An s subshell can't hold 8; skips 2p entirely."},"note":""},{"ch":2,"n":59,"sec":"02.03","bloom":2,"ctx":null,"stem":"You identify an enzyme involved in a cellular reaction. How does the enzyme affect the reaction equilibrium between reactants and products and the time needed to reach equilibrium?","opts":["It alters the reaction equilibrium and shortens the time needed to reach equilibrium.","The reaction equilibrium is unaffected, but it shortens the time needed to reach equilibrium.","It alters the reaction equilibrium and lengthens the time needed to reach equilibrium.","The reaction equilibrium is unaffected, but it lengthens the time needed to reach equilibrium."],"ans":["B"],"why":"Enzymes <b>lower activation energy<\/b>, speeding forward and reverse reactions equally. You reach equilibrium faster, but the equilibrium ratio of products to reactants doesn't change.","wrong":{"A":"Equilibrium position is unchanged.","C":"Wrong on both counts.","D":"Enzymes speed reactions up."},"note":""},{"ch":2,"n":60,"sec":"02.04","bloom":3,"ctx":null,"stem":"You walk down into your basement to find that the carpeting on the floor is damp. Concerned, you look around for large puddles of water or broken pipes, but find none. In fact, only the basement floor and carpeting is damp. You realize that water must have wicked into the carpet from the floor by ________.","opts":["adhesion and cohesion","adhesion and solubility","adhesion, cohesion, and solubility","cohesion and solubility"],"ans":["A"],"why":"Water <b>adheres<\/b> to polar carpet fibers and <b>coheres<\/b> to itself, pulling a continuous film upward — wicking.","wrong":{"B":"Nothing is dissolving; solubility isn't involved in moving through fibers.","C":"Solubility isn't involved.","D":"Leaves out adhesion, which attaches water to the fibers."},"note":""},{"ch":2,"n":61,"sec":"02.03","bloom":3,"ctx":null,"stem":"You recently discovered a new element, and find that this particular element has one electron in its outer energy level. What would you expect will happen to an atom of this element if placed in water?","opts":["It will lose an electron forming a positive ion.","It will lose an electron forming a negative ion.","It will gain an electron forming a positive ion.","It will gain an electron forming a negative ion."],"ans":["A"],"why":"Like Na or K, it gives up its lone valence electron to expose a full shell → <b>cation<\/b> (+1).","wrong":{"B":"Losing a negative electron leaves a <i>positive<\/i> charge.","C":"Gaining electrons makes a negative charge.","D":"Gaining 7 electrons is far less favorable than losing 1."},"note":""},{"ch":2,"n":62,"sec":"02.02","bloom":2,"ctx":null,"stem":"In the Hershey-Chase experiment, bacterial viruses, called phage, were used to demonstrate that DNA is the genetic material. The phage that were used for this experiment consisted of DNA surrounded by a protein coat. Phage will attach to specific types of bacteria and inject their DNA into the bacterial cell. To scientifically determine whether DNA is the genetic material, Hershey and Chase made phage in a medium containing radioactive sulfur-35 (S<sup>35<\/sup>). Why was S<sup>35<\/sup> used in this experiment?","opts":["Only amino acids contain sulfur.","Only nucleic acids contain sulfur.","Both nucleic acids and amino acids contain sulfur.","The radioactive sulfur labels peptide bonds."],"ans":["A"],"why":"Sulfur is in cysteine and methionine but <b>not in DNA<\/b>, so ³⁵S labels only the protein coat (³²P labels DNA's phosphate backbone). ³⁵S stayed outside the bacteria while ³²P entered → DNA is the genetic material.","wrong":{"B":"DNA contains phosphorus, not sulfur.","C":"DNA lacks sulfur — that's what made the label selective.","D":"Peptide bonds contain C, N, O and H — no S."},"note":""},{"ch":2,"n":63,"sec":"02.01","bloom":1,"ctx":null,"stem":"Why is it necessary to take special safety precautions when using radioactivity?","opts":["Radioactive substances will ionize cells.","Radioactive substances have the potential to cause damage to living cells.","Radioactive substances decay.","Radioactive substances will perforate plasma membranes."],"ans":["B"],"why":"Ionizing radiation <b>damages DNA<\/b> and other molecules → mutations, cancer, cell death.","wrong":{"A":"Radiation ionizes molecules within cells; \"ionize cells\" is imprecise.","C":"True, but decay itself isn't the danger — the damage it causes is.","D":"Not the mechanism of harm."},"note":""},{"ch":2,"n":64,"sec":"02.05","bloom":2,"ctx":null,"stem":"The high heat of vaporization of water helps you to feel cooler when you sweat because the transition of water from a liquid to a gas requires a ________ of energy to break hydrogen bonds. The energy is ________ from heat produced by your body, thus helping to lower the surface temperature of your body.","opts":["release; released","release; obtained","input; obtained","input; released"],"ans":["C"],"why":"Breaking H-bonds <b>requires energy input<\/b>; that energy is <b>taken from<\/b> your skin, carrying heat away.","wrong":{"A":"Evaporation absorbs energy; it doesn't release it.","B":"First blank is wrong.","D":"Second blank is wrong — heat is removed from the body."},"note":""},{"ch":2,"n":65,"sec":"02.05","bloom":3,"ctx":null,"stem":"Salt is often used to melt ice on roads during the winter because it lowers the freezing/melting point of water. When salt dissolves in water, individual Na<sup>+<\/sup> and Cl<sup>−<\/sup> ions break away from the salt lattice and become surrounded by water molecules. Why would this cause ice to melt?","opts":["Hydrogen bonds are broken, and the salt ions interfere with interactions between H and O. As a result, it is more difficult for water molecules to bond and form ice.","Hydrogen bonds are formed, and the salt ions bond with O. As a result, it is more difficult for water molecules to bond and form ice.","Hydrogen bonds are broken, and the salt ions bond with O and H respectively. As a result, it is more difficult for water molecules to bond and form ice."],"ans":["A"],"why":"Na⁺ attracts water's δ⁻ O and Cl⁻ attracts δ⁺ H, forming hydration shells. These ions <b>interfere with water–water hydrogen bonding<\/b>, so the ice lattice can't form as easily (freezing-point depression).","wrong":{"B":"Hydrogen bonds are disrupted, not formed.","C":"Ions attract water through ion–dipole interactions; they don't form chemical bonds with O and H."},"note":""},{"ch":2,"n":66,"sec":"02.06","bloom":3,"ctx":null,"stem":"A chemist adds a chemical to pure water and there is a 100-fold increase in the concentration of hydrogen ions. What is the best approximation of the new pH value?","opts":["0","5","7","9","14"],"ans":["B"],"why":"Pure water is pH 7. 100× more H⁺ = 2 pH units lower → <b>pH 5<\/b>.","wrong":{"A":"That would be ~1 M H⁺ — far more acidic.","C":"No change.","D":"Wrong direction.","E":"Maximum basicity."},"note":""},{"ch":2,"n":67,"sec":"02.03","bloom":3,"ctx":null,"stem":"The electronegativity of nitrogen (N) is 3.0, while the electronegativity of hydrogen (H) is 2.1. Knowing this, consider how the electrons will be shared in ammonia (NH<sub>3<\/sub>). What do you predict about the polarity of ammonia?","opts":["Each H atom has a partial positive charge","The N atom has a partial positive charge","Each H atom has a partial negative charge","The N atom has a strong positive charge"],"ans":["A"],"why":"N pulls the shared electrons toward itself (δ⁻), leaving <b>each H δ⁺<\/b>.","wrong":{"B":"N is the more electronegative atom, so it's δ⁻.","C":"H loses electron density, so it's δ⁺.","D":"It's a partial charge, and it's negative on N."},"note":""},{"ch":2,"n":68,"sec":"02.03","bloom":3,"ctx":null,"stem":"Magnesium chloride is a salt formed with ionic bonds between one magnesium ion and two chloride ions. Magnesium has two electrons in its outer shell and chlorine has seven electrons in its outer shell. How are the electrons transferred between these atoms?","opts":["Both magnesium and chlorine are reduced.","Both magnesium and chlorine are oxidized.","Chlorine is oxidized and magnesium is reduced.","Magnesium is oxidized and chlorine is reduced."],"ans":["D"],"why":"Mg loses 2 e⁻ → Mg²⁺ (<b>oxidized<\/b>); each Cl gains 1 e⁻ → Cl⁻ (<b>reduced<\/b>).","wrong":{"A":"In a redox reaction, one partner must lose electrons.","B":"One partner must gain electrons.","C":"Reversed."},"note":""},{"ch":2,"n":69,"sec":"02.06","bloom":3,"ctx":null,"stem":"The carbonic acid and bicarbonate buffer in blood is extremely important to help maintain homeostasis. What would happen to the pH of the blood if bicarbonate were removed?","opts":["Removing bicarbonate from the blood would increase the pH","Removing bicarbonate from the blood would decrease the pH","Removing bicarbonate from the blood would not affect the pH"],"ans":["B"],"why":"Bicarbonate is the <b>base<\/b> half that soaks up H⁺. Remove it and only carbonic acid remains, so H⁺ accumulates → <b>pH falls<\/b> (acidosis).","wrong":{"A":"Removing a base raises [H⁺], lowering pH.","C":"The buffer's capacity to absorb acid would be lost."},"note":""},{"ch":2,"n":70,"sec":"02.05","bloom":2,"ctx":null,"stem":"The common basilisk lizard will run across water on its hind legs in an erect position when startled by predators. This lizard has large feet and flaps of skin along its toes. What properties of water allow this lizard to walk on water?","opts":["Hydrogen bonds absorb heat when they break and release heat when they form. This helps to minimize temperature changes.","The surface tension created by hydrogen bonds is greater than the weight of the lizard initially.","Polar molecules are attracted to ions and polar compounds, making these compounds soluble.","Hydrogen bonds hold water molecules together; many hydrogen bonds must be broken for water to evaporate."],"ans":["B"],"why":"Hydrogen bonding at the surface creates <b>surface tension<\/b>, a film strong enough (with big feet spreading the weight) to support a fast-moving lizard.","wrong":{"A":"Describes high specific heat (temperature stability).","C":"Describes water as a solvent.","D":"Describes high heat of vaporization."},"note":""},{"ch":2,"n":71,"sec":"02.03","bloom":2,"ctx":null,"stem":"How is the bond in F<sub>2<\/sub> different from the bond in KCl?","opts":["F<sub>2<\/sub> is covalent and KCl is ionic","F<sub>2<\/sub> and KCl are both ionic","F<sub>2<\/sub> is ionic and KCl is covalent"],"ans":["A"],"why":"Two identical F atoms share electrons equally → (nonpolar) <b>covalent<\/b>. K gives its electron to Cl (huge electronegativity difference) → <b>ionic<\/b>.","wrong":{"B":"Identical atoms can't transfer electrons to each other.","C":"Reversed."},"note":""},{"ch":2,"n":72,"sec":"02.03","bloom":3,"ctx":null,"stem":"Carbon has 4 valence electrons and oxygen has 6. Carbon dioxide would contain ________.","opts":["one single covalent bond","four hydrogen bonds","two double covalent bonds","two single covalent bonds"],"ans":["C"],"why":"C needs 4 bonds, each O needs 2 → <b>O=C=O<\/b>: two double bonds.","wrong":{"A":"One single bond satisfies neither atom.","B":"Hydrogen bonds need H atoms; CO₂ has none.","D":"Two single bonds leave C and both O's short of an octet."},"note":""},{"ch":2,"n":73,"sec":"02.05","bloom":2,"ctx":null,"stem":"If water were nonpolar it would not form hydrogen bonds. At normal room temperatures this nonpolar water would be ________.","opts":["a gas","a liquid","a solid"],"ans":["A"],"why":"Small molecules without hydrogen bonds (CH₄, H₂S) are <b>gases<\/b> at room temperature. H-bonds are what keep water liquid.","wrong":{"B":"Without H-bonds, too little attraction to stay liquid.","C":"Even less likely."},"note":""},{"ch":2,"n":74,"sec":"02.05","bloom":3,"ctx":null,"stem":"Proteins are three dimensional molecules made of strands of amino acids (imagine a ball of string). There are 20 different amino acids used in proteins found in living organisms. Some of these amino acids are polar and others are nonpolar. Where would a series of nonpolar amino acids most likely be located in a protein that is found in the cytosol of an animal cell?","opts":["On the surface of the protein","In the interior of the protein","At the very top of the protein","At the very bottom of the protein"],"ans":["B"],"why":"The cytosol is watery. Nonpolar side chains are pushed together <b>inside<\/b> the protein, away from water (the hydrophobic effect), which drives folding.","wrong":{"A":"The surface faces water, so polar/charged residues sit there.","C":"\"Top\" has no meaning for a folded globular protein.","D":"\"Bottom\" has no meaning for a folded globular protein."},"note":""},{"ch":2,"n":75,"sec":"02.05","bloom":3,"ctx":null,"stem":"According to most car mechanics, plain water is the best coolant to use in an engine provided the engine is not being exposed to freezing temperatures. If the car is subject to freezing temperatures then a mixture of water and ethylene glycol (antifreeze) is recommended but it does not cool as efficiently as plain water. Why would ethylene glycol reduce the cooling efficiency of water?","opts":["Ethylene glycol has a lower heat capacity than water.","Ethylene glycol has a higher heat capacity than water.","Hydrogen bonds in water allow high levels of heat absorption and a large increase in temperature.","Ethylene glycol raises the freezing point of water."],"ans":["A"],"why":"Water's hydrogen bonds give it a very high <b>specific heat<\/b>. Mixing in ethylene glycol (lower heat capacity) lowers how much heat the coolant can absorb per degree.","wrong":{"B":"Higher heat capacity would cool <i>better<\/i>.","C":"Water absorbs heat with only a <i>small<\/i> temperature rise.","D":"Antifreeze <i>lowers<\/i> the freezing point."},"note":""},{"ch":2,"n":76,"sec":"02.03","bloom":3,"ctx":null,"stem":"Dennis had a history of heart disease in his family and was reducing his intake of saturated fats. Saturated means each carbon atom is bonded to as many hydrogen atoms as it can accept. If a carbon were bonded to two carbons, how many hydrogens could it accept?","opts":["0","1","2","3","4"],"ans":["C"],"why":"Carbon makes 4 bonds. 2 go to neighboring carbons → <b>2 left for H<\/b> (–CH₂–).","wrong":{"A":"Would leave carbon with an incomplete octet.","B":"Would require a double bond — that's unsaturated.","D":"Would give carbon 5 bonds.","E":"Would give carbon 6 bonds."},"note":""},{"ch":3,"n":1,"sec":"03.01","bloom":2,"ctx":null,"stem":"Organic molecules have a carbon backbone and ________ such as -OH and -NH<sub>2<\/sub> that affect their chemical properties.","opts":["R groups","extension groups","functional groups","chemical groups"],"ans":["C"],"why":"Specific atom clusters attached to the carbon skeleton (hydroxyl, amino, carboxyl, phosphate…) that give a molecule its chemistry are <b>functional groups<\/b>.","wrong":{"A":"\"R group\" is the variable side chain of an amino acid (or a placeholder for \"rest of molecule\").","B":"Not a term.","D":"Not the standard term."},"note":""},{"ch":3,"n":2,"sec":"03.02","bloom":1,"ctx":null,"stem":"A polysaccharide that is composed of modified glucose subunits and that is found in the exoskeletons of insects and crustaceans is known as:","opts":["chitin","starch","amylose","glycogen"],"ans":["A"],"why":"<b>Chitin<\/b>: β-linked glucose units carrying nitrogen-containing groups (N-acetylglucosamine). Also in fungal cell walls.","wrong":{"B":"Starch is plant energy storage (α-glucose).","C":"Amylose is the unbranched form of starch.","D":"Glycogen is animal energy storage."},"note":""},{"ch":3,"n":3,"sec":"03.05","bloom":1,"ctx":null,"stem":"These biological compounds are nonpolar and insoluble in water:","opts":["carbohydrates","lipids","proteins","nucleic acids"],"ans":["B"],"why":"Long hydrocarbon chains/rings with few polar groups → <b>lipids<\/b> are hydrophobic.","wrong":{"A":"Covered in –OH groups → polar, often soluble.","C":"Many proteins are water-soluble.","D":"The charged phosphate backbone makes them soluble."},"note":""},{"ch":3,"n":4,"sec":"03.03","bloom":4,"ctx":null,"stem":"A DNA molecule containing 32% thymine would contain how much cytosine?","opts":["18%","32%","36%","64%"],"ans":["A"],"why":"Chargaff's rules: A = T and G = C. T 32% → A 32% → A + T = 64% → G + C = 36% → <b>C = 18%<\/b>.","wrong":{"B":"That's adenine.","C":"That's G + C combined.","D":"That's A + T combined."},"note":""},{"ch":3,"n":5,"sec":"03.01","bloom":1,"ctx":null,"stem":"The covalent bonds connecting monomer units in sugars can be formed by the removal of a water molecule. This reaction is referred to as:","opts":["a hydrolysis reaction.","an oxidation-reduction reaction.","a dehydration reaction.","a hydration reaction."],"ans":["C"],"why":"Removing an –OH from one monomer and an –H from the other releases H₂O and joins them = <b>dehydration synthesis<\/b>.","wrong":{"A":"Hydrolysis <i>uses<\/i> water to break bonds.","B":"Redox is about electron transfer.","D":"Hydration means adding water."},"note":""},{"ch":3,"n":6,"sec":"03.01","bloom":1,"ctx":null,"stem":"This atom in its unbound state has four valence electrons. These electrons readily form single, double, and even triple bonds among themselves to become stable. This atom is:","opts":["carbon.","hydrogen.","oxygen.","nitrogen.","phosphorus."],"ans":["A"],"why":"Four valence electrons → four bonds → the versatile backbone of organic molecules: <b>carbon<\/b>.","wrong":{"B":"1 valence electron (1 bond).","C":"6 valence electrons (2 bonds).","D":"5 valence electrons (3 bonds).","E":"5 valence electrons."},"note":""},{"ch":3,"n":7,"sec":"03.01","bloom":1,"ctx":null,"stem":"Macromolecules are broken down to monomers in ________","opts":["anabolic reactions.","hydrolysis reactions.","denaturation reactions.","dehydration reactions."],"ans":["B"],"why":"Water is added across the bond to split it = <b>hydrolysis<\/b> (\"water-breaking\"). Digestion is hydrolysis.","wrong":{"A":"Anabolic reactions <i>build<\/i> molecules.","C":"Denaturation unfolds a protein; the chain stays intact.","D":"Dehydration builds polymers."},"note":""},{"ch":3,"n":8,"sec":"03.04","bloom":1,"ctx":null,"stem":"Relatively small organic molecules with a central carbon atom which is bonded to a carboxyl group, an amino group, a carbon containing group, and a hydrogen atom are called:","opts":["amino acids.","fatty acids.","enzymes.","peptides.","nucleotides."],"ans":["A"],"why":"That exact layout — α-carbon with –NH₂, –COOH, –H and an R group — defines an <b>amino acid<\/b>.","wrong":{"B":"Fatty acids are a hydrocarbon chain + carboxyl; no amino group.","C":"Enzymes are proteins (polymers).","D":"Peptides are chains of amino acids.","E":"Nucleotides are sugar + phosphate + base."},"note":""},{"ch":3,"n":9,"sec":"03.03","bloom":1,"ctx":null,"stem":"Macromolecules that are used by all organisms to store hereditary information are called:","opts":["transfer RNA molecules.","messenger RNA molecules.","proteins.","ribosomal RNA molecules.","DNA molecules."],"ans":["E"],"why":"<b>DNA<\/b> is the long-term information store in all cells.","wrong":{"A":"tRNA carries amino acids to the ribosome.","B":"mRNA is a temporary copy of one gene.","C":"Proteins are the products, not the store.","D":"rRNA builds the ribosome."},"note":""},{"ch":3,"n":10,"sec":"03.03","bloom":1,"ctx":null,"stem":"DNA and RNA contain functional units known as:","opts":["peptides.","enzymes.","amino acids.","nucleotides.","fatty acids."],"ans":["D"],"why":"Nucleic acids are polymers of <b>nucleotides<\/b> (sugar + phosphate + base).","wrong":{"A":"Peptides relate to proteins.","B":"Enzymes are (mostly) proteins.","C":"Amino acids build proteins.","E":"Fatty acids build lipids."},"note":""},{"ch":3,"n":11,"sec":"03.02","bloom":1,"ctx":null,"stem":"Carbohydrates are polymers formed of structural units called:","opts":["amino acids.","fatty acids.","nucleotides.","glycerols.","monosaccharides."],"ans":["E"],"why":"Simple sugars (<b>monosaccharides<\/b>) like glucose link into polysaccharides.","wrong":{"A":"Build proteins.","B":"Build lipids.","C":"Build nucleic acids.","D":"Glycerol is the backbone of fats."},"note":""},{"ch":3,"n":12,"sec":"03.01","bloom":1,"ctx":null,"stem":"Proteins are polymers formed of structural units called:","opts":["fatty acids.","amino acids.","nucleotides.","phosphate groups.","monosaccharides."],"ans":["B"],"why":"Proteins = chains of <b>amino acids<\/b> joined by peptide bonds.","wrong":{"A":"Lipids.","C":"Nucleic acids.","D":"Part of nucleotides/phospholipids.","E":"Carbohydrates."},"note":""},{"ch":3,"n":13,"sec":"03.05","bloom":1,"ctx":null,"stem":"Lipids are the only class of macromolecules that contain:","opts":["amino acids.","nucleotides.","fatty acids.","phosphate groups.","monosaccharides."],"ans":["C"],"why":"<b>Fatty acids<\/b> are unique to lipids (triglycerides, phospholipids).","wrong":{"A":"Unique to proteins.","B":"Unique to nucleic acids.","D":"Phosphates are also in nucleic acids — not unique to lipids.","E":"Carbohydrates."},"note":""},{"ch":3,"n":14,"sec":"03.03","bloom":3,"ctx":null,"stem":"A double stranded DNA strand contains 26 pyrimidines. How many purines will the copied strand contain?","opts":["0","13","26","52"],"ans":["C"],"why":"Every base pair = one purine (A/G) + one pyrimidine (T/C). In dsDNA, purines always equal pyrimidines → <b>26<\/b>.","wrong":{"A":"Purines are always present.","B":"Halving has no basis.","D":"That would be total bases."},"note":"The original wording (\"copied strand\") is confusing; the key's logic is purines = pyrimidines in double-stranded DNA."},{"ch":3,"n":15,"sec":"03.02","bloom":1,"ctx":null,"stem":"A monosaccharide that plays an important role in energy storage is a six-carbon sugar called:","opts":["galactose.","lactose.","cellulose.","glucose.","sucrose."],"ans":["D"],"why":"<b>Glucose<\/b> is the central fuel molecule and the monomer of starch and glycogen.","wrong":{"A":"Galactose is a 6-carbon isomer, but it isn't the main energy sugar.","B":"Lactose is a disaccharide (glucose + galactose).","C":"Cellulose is a structural polysaccharide.","E":"Sucrose is a disaccharide (glucose + fructose)."},"note":""},{"ch":3,"n":16,"sec":"03.02","bloom":2,"ctx":null,"stem":"Humans are unable to get metabolic energy from cellulose because:","opts":["cellulose contains very little chemical energy.","cellulose is not part of a normal diet.","cellulose digesting enzymes are absent from the human gut.","cellulose does not taste good.","cellulose is present in large quantities in the gut."],"ans":["C"],"why":"Cellulose is β(1→4)-linked glucose. Human amylases only cut α linkages; we <b>lack cellulase<\/b>. Cows and termites rely on gut microbes that have it.","wrong":{"A":"Each glucose in cellulose holds as much energy as in starch.","B":"It's in every plant food (fiber).","D":"Taste is irrelevant.","E":"Quantity doesn't determine digestibility."},"note":""},{"ch":3,"n":17,"sec":"03.02","bloom":1,"ctx":null,"stem":"What polysaccharide forms the long, tough fibers found in plant cell walls?","opts":["cellulose","starch","glycogen","chitin","amylopectin"],"ans":["A"],"why":"<b>Cellulose<\/b>: straight β-glucose chains hydrogen-bond side by side into strong fibers.","wrong":{"B":"Starch stores energy.","C":"Glycogen is animal storage.","D":"Chitin is in arthropods and fungi.","E":"Amylopectin is branched starch."},"note":""},{"ch":3,"n":18,"sec":"03.01","bloom":2,"ctx":null,"stem":"The biological macromolecule that is least soluble in water is a(n):","opts":["protein.","nucleic acid.","enzyme","lipid.","carbohydrate."],"ans":["D"],"why":"Mostly hydrocarbon → nonpolar → <b>lipids<\/b>.","wrong":{"A":"Many proteins dissolve well.","B":"Charged backbone → soluble.","C":"Enzymes are typically soluble proteins.","E":"Polar –OH groups → soluble (except huge structural ones)."},"note":""},{"ch":3,"n":19,"sec":"03.05","bloom":1,"ctx":null,"stem":"Common lipids for energy storage are:","opts":["phospholipids.","steroids.","triglycerides.","cholesterols.","waxes."],"ans":["C"],"why":"<b>Triglycerides<\/b> (fats/oils): very reduced C–H bonds store ~9 kcal/g.","wrong":{"A":"Membrane builders.","B":"Hormones and membrane components.","D":"Membranes and steroid precursor.","E":"Waterproof coatings."},"note":""},{"ch":3,"n":20,"sec":"03.05","bloom":1,"ctx":null,"stem":"Three fatty acids bonded together with a glycerol are found in a(n):","opts":["alcohol.","enzyme.","phospholipid.","chlorophyll pigment.","triglyceride."],"ans":["E"],"why":"Glycerol + 3 fatty acids = <b>triglyceride<\/b>.","wrong":{"A":"Glycerol is an alcohol, but the full molecule is a fat.","B":"Enzymes are proteins.","C":"Phospholipids have only 2 fatty acids plus a phosphate group.","D":"Chlorophyll is a porphyrin ring with a terpene tail."},"note":""},{"ch":3,"n":21,"sec":"03.05","bloom":1,"ctx":null,"stem":"Biological membranes contain bilayers containing mostly ________.","opts":["phospholipids","oils","prostaglandins","triglycerides","cholesterol"],"ans":["A"],"why":"Amphipathic <b>phospholipids<\/b> (polar head, two nonpolar tails) self-assemble into bilayers.","wrong":{"B":"Oils are triglycerides — no polar head, can't form bilayers.","C":"Signaling lipids.","D":"No polar head, can't form bilayers.","E":"Present in animal membranes to tune fluidity, but not the main component."},"note":""},{"ch":3,"n":22,"sec":"03.05","bloom":1,"ctx":null,"stem":"This type of lipid is found in pigments such as chlorophyll, in the visual pigment retinal, and in rubber:","opts":["phospholipid.","terpene.","steroid.","prostaglandin.","wax."],"ans":["B"],"why":"<b>Terpenes<\/b> are built from 5-carbon isoprene units — carotenoids, retinal, chlorophyll's tail, rubber.","wrong":{"A":"Membrane lipids.","C":"Four fused rings (cholesterol, hormones).","D":"Modified fatty acids used in signaling/inflammation.","E":"Waterproofing lipids."},"note":""},{"ch":3,"n":23,"sec":"03.04","bloom":1,"ctx":null,"stem":"Amino acids are linked together by peptide bonds in a ________","opts":["phospholipid.","nucleic acid.","polysaccharide.","polypeptide.","starch."],"ans":["D"],"why":"Chain of amino acids joined by peptide bonds = <b>polypeptide<\/b>.","wrong":{"A":"Ester bonds.","B":"Phosphodiester bonds.","C":"Glycosidic bonds.","E":"Glycosidic bonds."},"note":""},{"ch":3,"n":24,"sec":"03.04","bloom":1,"ctx":null,"stem":"The specific amino acid sequence of a protein is its ________.","opts":["primary structure","secondary structure","tertiary structure","quaternary structure"],"ans":["A"],"why":"The sequence itself = <b>primary structure<\/b>; it determines every higher level.","wrong":{"B":"α-helices and β-sheets from backbone H-bonds.","C":"The full 3D fold of one chain.","D":"Assembly of multiple chains."},"note":""},{"ch":3,"n":25,"sec":"03.04","bloom":2,"ctx":null,"stem":"What is the difference in the bonding between alpha-helix and beta sheets?","opts":["Hydrogen bonding between the amides only occurs in one of these two types of secondary structures.","Hydrogen bonding occurs between the amides of adjacent chains in the sheets instead of between the amides in different parts of the helices.","Sulfur bridges allow the spring like turns in alpha helices and van der Waals dispersion allows the folds in beta sheets.","Hydrogen bonding always occurs in the alpha helices but only occurs in parallel beta sheets."],"ans":["B"],"why":"Both use backbone C=O···H–N hydrogen bonds. In a helix they form <b>within one coiled stretch<\/b>; in a sheet they form <b>between neighboring strands<\/b> lying side by side.","wrong":{"A":"Both structures rely on hydrogen bonds.","C":"Disulfide bridges stabilize tertiary structure, not helix turns.","D":"Both parallel and antiparallel sheets use hydrogen bonds."},"note":""},{"ch":3,"n":26,"sec":"03.04","bloom":2,"ctx":null,"stem":"Denaturation disrupts the secondary and tertiary structure of proteins. However, denaturation is not strong enough to disrupt what interaction that is relevant to protein structure?","opts":["hydrogen bonds","ionic bonds","van der Waals attraction","hydrophobic exclusion","peptide bonds"],"ans":["E"],"why":"Heat, pH or urea break weak interactions, but the covalent <b>peptide bonds<\/b> (primary structure) survive — which is why some proteins can refold (Anfinsen's experiment). Lab link: SDS-PAGE denatures proteins so they separate by size in Western blots.","wrong":{"A":"Weak — broken by denaturation.","B":"Weak — broken by denaturation.","C":"Weak — broken by denaturation.","D":"Disrupted when the protein unfolds."},"note":""},{"ch":3,"n":27,"sec":"03.03","bloom":1,"ctx":null,"stem":"The information storage molecules of cells are called:","opts":["proteins.","phospholipids.","enzymes.","hormones.","nucleic acids."],"ans":["E"],"why":"<b>Nucleic acids<\/b> (DNA, RNA) store and transmit genetic information.","wrong":{"A":"Proteins carry out functions.","B":"Build membranes.","C":"Catalyze reactions.","D":"Carry signals."},"note":""},{"ch":3,"n":28,"sec":"03.03","bloom":1,"ctx":null,"stem":"The nitrogenous base that is only found in DNA and not in RNA is:","opts":["adenine.","cytosine.","guanine.","thymine.","uracil."],"ans":["D"],"why":"<b>Thymine<\/b> is DNA-only; RNA uses uracil instead.","wrong":{"A":"In both.","B":"In both.","C":"In both.","E":"RNA-only."},"note":""},{"ch":3,"n":29,"sec":"03.03","bloom":1,"ctx":null,"stem":"The nitrogenous base that is only found in RNA and not DNA is:","opts":["adenine","cytosine","guanine","thymine","uracil"],"ans":["E"],"why":"<b>Uracil<\/b> replaces thymine in RNA.","wrong":{"A":"In both.","B":"In both.","C":"In both.","D":"DNA-only."},"note":""},{"ch":3,"n":30,"sec":"03.01","bloom":2,"ctx":null,"stem":"Fructose and galactose both have six carbon atoms, twelve hydrogen atoms and six oxygen atoms, just like glucose. A friend of yours says: \"Since those sugars have the same number of atoms, they should have the same name.\" You answer: \"While they do have the same number and type of atoms,","opts":["they are all polysaccharides and have slightly different functions within organisms and therefore have different names.\"","they are named differently because of their quaternary structures, which is very important in carbohydrates, especially glucose.\"","they are named differently because when heated above their optimal temperature they become denatured and will not react with their substrates.\"","they are named differently because they are involved in different DNA nucleotide formation.\"","they are named differently because they are alternate forms of the monosaccharide, glucose.\""],"ans":["E"],"why":"Same formula, different arrangement of atoms → <b>isomers<\/b> of glucose (fructose is a ketose; galactose differs at one carbon's –OH orientation). Different shapes = different molecules.","wrong":{"A":"They're monosaccharides, not polysaccharides.","B":"Quaternary structure applies to proteins only.","C":"Denaturation and substrates apply to enzymes, not sugars.","D":"Nucleotides contain 5-carbon sugars (ribose/deoxyribose)."},"note":""},{"ch":3,"n":31,"sec":"03.05","bloom":3,"ctx":null,"stem":"A candy bar contains 108 calories per serving. There are 4 grams of carbohydrate, 5 grams of protein, and 8 grams of fat in a serving. How many of the calories come from fat? Note: One food calorie equals one kilocalorie.","opts":["20","16","72","18"],"ans":["C"],"why":"Fat = 9 kcal/g → 8 × 9 = <b>72<\/b>. (Check: carbs 4 × 4 = 16, protein 5 × 4 = 20; 72 + 16 + 20 = 108.) Fats are more reduced (more C–H bonds), so they store more energy.","wrong":{"A":"That's the protein Calories.","B":"That's the carbohydrate Calories.","D":"No valid calculation gives this."},"note":""},{"ch":3,"n":32,"sec":"03.03","bloom":2,"ctx":null,"stem":"A nucleic acid contains uracil, allowing you to conclude that:","opts":["this nucleic acid is DNA.","this nucleic acid is RNA.","this nucleic acid could be either DNA or RNA."],"ans":["B"],"why":"Uracil is found only in <b>RNA<\/b>.","wrong":{"A":"DNA uses thymine.","C":"Uracil is diagnostic for RNA."},"note":""},{"ch":3,"n":33,"sec":"03.03","bloom":2,"ctx":null,"stem":"A nucleic acid contains thymine, allowing you to conclude that:","opts":["this nucleic acid is DNA.","this nucleic acid is RNA.","this nucleic acid could be either DNA or RNA."],"ans":["A"],"why":"Thymine is found only in <b>DNA<\/b>.","wrong":{"B":"RNA uses uracil.","C":"Thymine is diagnostic for DNA."},"note":""},{"ch":3,"n":34,"sec":"03.04","bloom":1,"ctx":null,"stem":"Proteins are created with:","opts":["phosphodiester bonds.","peptide bonds.","triglycerides.","polysaccharides."],"ans":["B"],"why":"Amino acids are linked by <b>peptide bonds<\/b> (dehydration between –COOH and –NH₂).","wrong":{"A":"Nucleic acid bonds.","C":"A type of molecule, not a bond.","D":"A type of molecule, not a bond."},"note":""},{"ch":3,"n":35,"sec":"03.05","bloom":1,"ctx":null,"stem":"Phospholipids are made up of:","opts":["a glycerol and three fatty acids.","four fused carbon rings.","a phosphate, two fatty acids and a glycerol.","five-carbon rings with two nonpolar tails."],"ans":["C"],"why":"Glycerol + <b>2 fatty acids<\/b> (nonpolar tails) + a <b>phosphate<\/b>-containing polar head.","wrong":{"A":"That's a triglyceride.","B":"That's a steroid.","D":"Not a real lipid structure."},"note":""},{"ch":3,"n":36,"sec":"03.02","bloom":1,"ctx":null,"stem":"Cellulose is composed of monomers of:","opts":["ribose","deoxyribose","α-glucose","β-glucose"],"ans":["D"],"why":"Cellulose = <b>β-glucose<\/b> in β(1→4) linkages — straight chains we can't digest.","wrong":{"A":"RNA's sugar.","B":"DNA's sugar.","C":"α-glucose builds starch and glycogen."},"note":""},{"ch":3,"n":37,"sec":"03.04","bloom":1,"ctx":null,"stem":"Enzymes function to:","opts":["react with other enzymes to form a product.","catalyze chemical reactions.","transport molecules and ions across membranes.","regulate messages between cells."],"ans":["B"],"why":"Enzymes are biological <b>catalysts<\/b>: they lower activation energy and aren't consumed.","wrong":{"A":"Enzymes act on substrates, not on each other to make product.","C":"That's transport proteins.","D":"That's signaling molecules/receptors."},"note":""},{"ch":3,"n":38,"sec":"03.03","bloom":1,"ctx":null,"stem":"The types of bonds found in nucleic acids are:","opts":["phosphodiester bonds.","peptide bonds.","ionic bonds.","nonpolar covalent bonds."],"ans":["A"],"why":"Nucleotides are linked by <b>phosphodiester bonds<\/b> (sugar 3′-OH — phosphate — next sugar's 5′ carbon).","wrong":{"B":"Proteins.","C":"Not the backbone linkage.","D":"The backbone bonds are polar."},"note":""},{"ch":3,"n":39,"sec":"03.01","bloom":3,"ctx":null,"stem":"Which of the following reactions is a dehydration reaction?","opts":["A + H<sub>2<\/sub>O → B + C","A + B → C + H<sub>2<\/sub>O","A + B + H<sub>2<\/sub>O → C","A → B + C + H<sub>2<\/sub>O"],"ans":["B"],"why":"Two pieces join and <b>water is released<\/b> → A + B → C + H₂O.","wrong":{"A":"Water consumed to split A — hydrolysis.","C":"Water is consumed, not released.","D":"Breaks A apart — not a synthesis."},"note":""},{"ch":3,"n":40,"sec":"03.01","bloom":3,"ctx":null,"stem":"Which of the following reactions is a hydrolysis reaction?","opts":["A + H<sub>2<\/sub>O → B + C","A + B → C + H<sub>2<\/sub>O","A + B + H<sub>2<\/sub>O → C","A → B + C + H<sub>2<\/sub>O"],"ans":["A"],"why":"<b>Water is used to split<\/b> one molecule into two: A + H₂O → B + C.","wrong":{"B":"Dehydration synthesis.","C":"Uses water but builds a single product.","D":"Releases water rather than consuming it."},"note":""},{"ch":3,"n":41,"sec":"03.03","bloom":3,"ctx":null,"stem":"The DNA sequence capable of pairing with 5′ CGATTAGT 3′ is:","opts":["3′ GCTAATCA 5′.","3′ CGATTAGT 5′.","5′ GCTAATCA 3′.","5′ CGATTAGT 3′."],"ans":["A"],"why":"Pair each base (C↔G, A↔T) and run the strands <b>antiparallel<\/b>: 3′ GCTAATCA 5′. PCR primer design uses exactly this logic.","wrong":{"B":"Same bases as the original, just flipped — not complementary.","C":"Complementary bases but parallel orientation — strands must run opposite.","D":"Identical to the original strand."},"note":""},{"ch":3,"n":42,"sec":"03.04","bloom":3,"ctx":null,"stem":"You recently identified a novel protein that contains several membrane-spanning domains. You would predict that the amino acids embedded in the membrane would have ________ side groups.","opts":["nonpolar","polar uncharged","positively charged","negatively charged"],"ans":["A"],"why":"The membrane core is fatty-acid tails — hydrophobic. Membrane-spanning α-helices are stretches of ~20 <b>nonpolar<\/b> residues.","wrong":{"B":"Polar residues are unstable in the lipid core.","C":"Charged residues would be repelled from the core; they sit in the water-facing loops.","D":"Same as C."},"note":""},{"ch":3,"n":43,"sec":"03.01","bloom":2,"ctx":null,"stem":"L-lysine is an essential amino acid and must be supplied in the diet. By comparison, the stereoisomer D-lysine is not biologically active. Why can your body only utilize one form?","opts":["Since the L form and D form are enantiomers, they will bind together and inhibit utilization of the D form.","Since the L form and D form are chiral molecules, they will bind together and inhibit utilization of the D form.","Antibodies recognize the D form and destroy it before your body can use it for nutritional purposes.","Enzymes can only recognize a single, specific stereoisomer."],"ans":["D"],"why":"Enzyme active sites are 3D and chiral, like a left-handed glove — they fit <b>only one mirror-image form<\/b>.","wrong":{"A":"Enantiomers don't pair up and block each other.","B":"Same error as A.","C":"Antibodies don't destroy dietary amino acids."},"note":""},{"ch":3,"n":44,"sec":"03.02","bloom":4,"ctx":null,"stem":"People who are lactose intolerant can often consume some products made from milk such as cheese and yogurt because microorganisms in their digestive system consume the lactose. By comparison, people with a true milk allergy, which involves an immune response to milk protein, cannot consume milk or products made from milk. Given this information, what can you conclude about milk?","opts":["The protein that causes a true milk allergy is lactose.","All people who are lactose intolerant are also allergic to milk.","Yogurt contains live and active cultures of <i>Lactobacillus acidophilus<\/i> bacteria and therefore prevents an allergic response in people with a true milk allergy.","Lactose is a carbohydrate, not a protein and is therefore not the cause of true milk allergies."],"ans":["D"],"why":"<b>Lactose<\/b> is a disaccharide (glucose + galactose). Intolerance = lack of the enzyme lactase → gut bacteria ferment it (gas, bloating). Allergy = immune reaction to milk <b>proteins<\/b> (casein, whey).","wrong":{"A":"Lactose is a sugar, not a protein.","B":"Two separate conditions.","C":"Bacteria digest lactose, not milk proteins — the allergen remains."},"note":""},{"ch":3,"n":45,"sec":"03.04","bloom":2,"ctx":null,"stem":"Egg whites consist primarily of water and the protein albumin. When you fry an egg, why does the egg white turn from clear to white?","opts":["The protein becomes dissociated.","The protein acquires tertiary structure.","The protein becomes denatured.","The protein becomes dehydrated."],"ans":["C"],"why":"Heat breaks hydrogen bonds and other weak interactions → albumin <b>unfolds (denatures)<\/b>; exposed hydrophobic regions clump, scattering light → opaque white.","wrong":{"A":"The key event is unfolding, not subunit separation.","B":"It <i>loses<\/i> its tertiary structure.","D":"The water is still there."},"note":""},{"ch":3,"n":46,"sec":"03.05","bloom":3,"ctx":null,"stem":"Margarine is made by hydrogenating vegetable oils so that they take on the consistency of butter. Propose a chemical basis for this change from a liquid to a solid.","opts":["Hydrogenation of fats changes them from unsaturated to saturated, which are more solid.","Hydrogenation of fats changes them from saturated to unsaturated, which are more solid.","Trans-fatty acids are changed from unsaturated to saturated, allowing them to solidify.","Trans fatty acids are changed from saturated to unsaturated, allowing them to solidify."],"ans":["A"],"why":"Adding H across C=C double bonds removes the kinks → straight, <b>saturated<\/b> tails pack tightly → solid at room temperature. Partial hydrogenation also creates trans fats, linked to raised LDL and heart disease.","wrong":{"B":"Reversed — hydrogenation saturates.","C":"Trans fats are a byproduct of partial hydrogenation, not the starting oil.","D":"Wrong starting material and wrong direction."},"note":""},{"ch":3,"n":47,"sec":"03.05","bloom":3,"ctx":null,"stem":"Vitamin D can be synthesized by the body from a derivative of cholesterol. Given this information, predict vitamin D's solubility.","opts":["Vitamin D is water-soluble.","Vitamin D is fat-soluble.","Vitamin D is soluble in both water and fat.","Vitamin D is not soluble in either water or fat."],"ans":["B"],"why":"Built from cholesterol (a steroid) → nonpolar → <b>fat-soluble<\/b> (like vitamins A, E, K). That's why it's stored in body fat and can reach toxic levels.","wrong":{"A":"It lacks enough polar groups.","C":"Steroid structure is predominantly nonpolar.","D":"It dissolves in lipids."},"note":""},{"ch":3,"n":48,"sec":"03.04","bloom":2,"ctx":null,"stem":"You arrive late to a biological seminar. However, just as you enter the room, you hear the speaker referring to the \"amino end\" and the \"carboxyl end\" of a macromolecule. Immediately, you know that they are talking about a:","opts":["carbohydrate.","protein.","nucleic acid.","lipid."],"ans":["B"],"why":"Polypeptides have an <b>N-terminus<\/b> (free –NH₂) and a <b>C-terminus<\/b> (free –COOH).","wrong":{"A":"Carbohydrates have reducing/non-reducing ends.","C":"Nucleic acids have 5′ and 3′ ends.","D":"Lipids aren't polymers with defined ends."},"note":""},{"ch":3,"n":49,"sec":"03.03","bloom":2,"ctx":null,"stem":"You arrive late to a biological seminar. However, just as you enter the room, you hear the speaker referring to the \"five-prime end\" and the \"three-prime end\" of a macromolecule. Immediately, you know that they are talking about a:","opts":["carbohydrate.","protein.","nucleic acid.","lipid."],"ans":["C"],"why":"5′ and 3′ refer to carbons on the sugar of a <b>nucleic acid<\/b> strand.","wrong":{"A":"No 5′/3′ notation.","B":"N- and C-termini.","D":"Not a polymer with defined ends."},"note":""},{"ch":3,"n":50,"sec":"03.03","bloom":2,"ctx":null,"stem":"What type of monomer does ATP represent?","opts":["monosaccharide","amino acid","nucleotide","fatty acid","glycerol"],"ans":["C"],"why":"ATP = adenine + ribose + three phosphates → a ribo<b>nucleotide<\/b>.","wrong":{"A":"It contains a sugar, but the whole unit is a nucleotide.","B":"No amino group/carboxyl backbone.","D":"No hydrocarbon chain.","E":"Not glycerol."},"note":""},{"ch":3,"n":51,"sec":"03.04","bloom":2,"ctx":null,"stem":"The digestive enzyme pepsin works in the acidic environment of the stomach to hydrolyze peptide bonds. As a result, pepsin affects which macromolecule?","opts":["carbohydrate","protein","DNA","lipid"],"ans":["B"],"why":"Peptide bonds hold amino acids together → pepsin digests <b>protein<\/b> (optimal pH ~2).","wrong":{"A":"Glycosidic bonds.","C":"Phosphodiester bonds.","D":"Ester bonds."},"note":""},{"ch":3,"n":52,"sec":"03.03","bloom":3,"ctx":null,"stem":"The human immunodeficiency virus (HIV) uses RNA, rather than DNA, to encode genetic information. During infection, however, HIV uses an enzyme known as reverse transcriptase to generate double-stranded DNA. Generally speaking, how would the enzyme generate a double strand of DNA from a single strand of RNA?","opts":["Reverse transcriptase first catalyzes the synthesis of a DNA copy from the viral RNA, and then catalyzes the synthesis of a second strand of DNA complementary to the first one.","Reverse transcriptase first catalyzes the synthesis of a RNA copy from the viral DNA, and then catalyzes the synthesis of a second strand of DNA complementary to the first one.","Reverse transcriptase first catalyzes the synthesis of a DNA copy from the viral RNA, and then catalyzes the synthesis of a second strand of DNA from the viral RNA."],"ans":["A"],"why":"Step 1: RNA template → complementary DNA strand (cDNA). Step 2: that DNA strand templates the <b>second DNA strand<\/b>. Lab link: RT-PCR uses the same enzyme to turn mRNA into cDNA; clinically, drugs like AZT block it.","wrong":{"B":"The viral genome is RNA; RT makes DNA from RNA, not the reverse.","C":"Copying the RNA again would just make another copy of the first strand, not its complement."},"note":""},{"ch":3,"n":53,"sec":"03.04","bloom":3,"ctx":null,"stem":"You have recently identified a novel protein and obtained its sequence. How could you use this sequence to predict the function of the protein?","opts":["By determining the secondary structure of the protein.","By using the sequence to make antibodies against the protein.","By looking for conserved domains.","By determining the DNA sequence that could encode the protein."],"ans":["C"],"why":"<b>Domains<\/b> are independently folding functional units reused across proteins. Matching your sequence to known domains (e.g., a kinase domain) predicts function.","wrong":{"A":"Every protein has helices and sheets; they don't reveal a specific function.","B":"Antibodies detect/localize a protein (Western blot, immunofluorescence) but don't predict its function.","D":"Gives you the same information you already have."},"note":""},{"ch":3,"n":54,"sec":"03.01","bloom":3,"ctx":null,"stem":"At the pH of most bodily fluids, which functional group will lose a proton and which functional group will accept a proton?","opts":["sulfhydryl; carbonyl","Hydroxyl; amino","amino; carboxyl","carboxyl; amino","carbonyl; Hydroxyl"],"ans":["D"],"why":"At pH ~7.4: <b>–COOH → –COO⁻ + H⁺<\/b> (acid) and <b>–NH₂ + H⁺ → –NH₃⁺<\/b> (base). That's why free amino acids exist as zwitterions.","wrong":{"A":"Neither ionizes much at physiological pH.","B":"Hydroxyl doesn't give up its proton at pH 7.","C":"Reversed.","E":"Neither ionizes much at physiological pH."},"note":""},{"ch":3,"n":55,"sec":"03.02","bloom":3,"ctx":null,"stem":"A bobcat is feeding on a white-tailed deer. It first eats the liver, which is rich in stored sugars. In what form would sugar be stored in the deer's liver?","opts":["Glucose","Maltose","Glycogen","Amylose","Cellulose"],"ans":["C"],"why":"Animals store glucose as highly branched <b>glycogen<\/b> in liver and muscle. Liver glycogen is broken down to keep blood glucose steady.","wrong":{"A":"Free glucose circulates; it's not the storage form.","B":"A disaccharide from starch digestion.","D":"Plant starch.","E":"Plant structural polysaccharide."},"note":""},{"ch":3,"n":56,"sec":"03.02","bloom":1,"ctx":null,"stem":"Seth ordered lobster at a restaurant and realized that the outer shell was made of a tough carbohydrate similar to that used to make the carapace of a cockroach. What do you think the outer shell of the lobster is made of?","opts":["Fibrin","Cellulose","Glycogen","Chitin","Amylopectin"],"ans":["D"],"why":"Arthropod exoskeletons are <b>chitin<\/b>.","wrong":{"A":"Fibrin is a blood-clotting protein.","B":"Plant cell
