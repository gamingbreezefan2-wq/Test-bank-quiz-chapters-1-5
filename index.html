<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio 201 Testbank Ch 1–5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: study-desk split — a narrow "slide tray" panel (scope, score, question map) beside one question card at a time.
   Palette: H&E histology stain — hematoxylin indigo as the accent, eosin pink used sparingly, on pale slide-glass neutrals. */
:root {
  --slide: #f5f4fa;
  --surface: #ffffff;
  --sunk: #efedf6;
  --ink: #1c1930;
  --ink-2: #57536d;
  --ink-3: #8a86a0;
  --line: #dddaea;
  --hema: #3d389c;
  --hema-ink: #ffffff;
  --hema-soft: #ebe9fb;
  --eosin: #c03670;
  --eosin-soft: #fbe8f0;
  --ok: #18744f;
  --ok-soft: #e1f3ea;
  --bad: #b1351d;
  --bad-soft: #fbe7e1;
  --note: #855600;
  --note-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(28, 25, 48, .06), 0 8px 24px rgba(28, 25, 48, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --slide: #13121c; --surface: #1c1a29; --sunk: #232134; --ink: #ecebf6; --ink-2: #aaa6c2; --ink-3: #7a7694;
    --line: #322f48; --hema: #a39eff; --hema-ink: #15132a; --hema-soft: #27254b; --eosin: #f37dab; --eosin-soft: #3a1e2c;
    --ok: #62d4a3; --ok-soft: #16322a; --bad: #ff8b70; --bad-soft: #3a1d17; --note: #efc26c; --note-soft: #33290f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --slide: #13121c; --surface: #1c1a29; --sunk: #232134; --ink: #ecebf6; --ink-2: #aaa6c2; --ink-3: #7a7694;
  --line: #322f48; --hema: #a39eff; --hema-ink: #15132a; --hema-soft: #27254b; --eosin: #f37dab; --eosin-soft: #3a1e2c;
  --ok: #62d4a3; --ok-soft: #16322a; --bad: #ff8b70; --bad-soft: #3a1d17; --note: #efc26c; --note-soft: #33290f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--slide); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hema); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.brand h1 .stain { color: var(--hema); }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.meter { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.meter .bar { width: 180px; max-width: 40vw; height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; }
.meter .bar i { display: block; height: 100%; }
.meter .bar .b-ok { background: var(--ok); }
.meter .bar .b-bad { background: var(--bad); }
.meter .num { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.meter .num b { color: var(--ink); font-weight: 600; }
.panel-toggle { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* ---------- grid ---------- */
.grid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.box { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--hema); border-color: var(--hema); color: var(--hema-ink); }
.chip .c { font-family: var(--f-mono); font-size: 11px; opacity: .75; }

.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 8px; font-size: 13px; cursor: pointer; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
.seg button .c { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }

.toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.toggle input { accent-color: var(--hema); width: 16px; height: 16px; margin: 0; }

table.score { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.score td { padding: 5px 0; border-bottom: 1px solid var(--line); }
table.score td:first-child { color: var(--ink-2); }
table.score td.r { text-align: right; }
table.score .pct { display: inline-block; min-width: 3.2em; text-align: right; font-weight: 600; }
.mini { display: inline-block; width: 46px; height: 5px; border-radius: 9px; background: var(--sunk); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--hema); }

.map { display: flex; flex-direction: column; gap: 10px; }
.map h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 4px; }
.cell { height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: 11px; cursor: pointer; padding: 0; color: var(--ink-2); position: relative; }
.cell.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.cell.cur { outline: 2px solid var(--hema); outline-offset: 1px; color: var(--ink); font-weight: 600; }
.cell.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--eosin); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.legend .l-ok { background: var(--ok-soft); border-color: transparent; }
.legend .l-bad { background: var(--bad-soft); border-color: transparent; }
.legend .l-flag { background: var(--eosin); border-radius: 50%; width: 7px; height: 7px; border: 0; }

.actions { display: flex; flex-direction: column; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--hema); color: var(--hema-ink); border-color: var(--hema); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.danger { color: var(--bad); }
.confirm { display: flex; flex-direction: column; gap: 8px; background: var(--bad-soft); border-radius: 8px; padding: 10px; font-size: 13px; }
.confirm .row { display: flex; gap: 8px; }
.confirm .row .btn { flex: 1; }

/* ---------- card ---------- */
main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; background: var(--hema-soft); color: var(--hema); font-weight: 600; font-size: 12px; }
.sec { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.qhead .spacer { margin-left: auto; }
.bloom { font-size: 12px; color: var(--ink-3); }
.bloom b { color: var(--ink-2); font-weight: 600; }
.flagbtn { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.flagbtn[aria-pressed="true"] { background: var(--eosin-soft); border-color: transparent; color: var(--eosin); font-weight: 600; }
.flagbtn svg { width: 12px; height: 12px; }

.ctx { background: var(--sunk); border-radius: var(--r); padding: 14px 16px; font-family: var(--f-read); font-size: 15px; line-height: 1.55; color: var(--ink-2); min-width: 0; overflow-x: auto; }
.ctx .k { display: block; font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
table.dt { border-collapse: collapse; margin-top: 10px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { padding: 4px 14px 4px 0; text-align: right; border-bottom: 1px solid var(--line); }
table.dt th { font-family: var(--f-display); font-weight: 600; color: var(--ink); }
table.dt th:first-child, table.dt td:first-child { text-align: left; }

.stem { font-family: var(--f-read); font-size: 19px; line-height: 1.5; margin: 0; max-width: 68ch; text-wrap: pretty; }
.hint { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--eosin); margin-top: -6px; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0,1fr) 22px; align-items: start; gap: 12px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 14px; cursor: pointer; font-family: var(--f-read); font-size: 16px; line-height: 1.45; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--hema); background: var(--hema-soft); }
.opt .L { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; font-weight: 500; background: var(--sunk); color: var(--ink-2); margin-top: -2px; }
.opt.multi .L { border-radius: 50%; }
.opt[aria-checked="true"] { border-color: var(--hema); background: var(--hema-soft); }
.opt[aria-checked="true"] .L { background: var(--hema); color: var(--hema-ink); }
.opt .ic { width: 20px; height: 20px; margin-top: 2px; }
.opt:disabled { cursor: default; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .L { background: var(--ok); color: var(--surface); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .L { background: var(--bad); color: var(--surface); }
.opt.is-missed { border-color: var(--ok); border-style: dashed; }
.opt.is-dim { opacity: .62; }
.opt .ic.ok { color: var(--ok); } .opt .ic.bad { color: var(--bad); }

.checkrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.checkrow .muted { font-size: 13px; color: var(--ink-3); }

/* ---------- feedback ---------- */
.fb { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 17px; font-weight: 700; }
.verdict .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 13px; }
.verdict .pill.ok { background: var(--ok-soft); color: var(--ok); }
.verdict .pill.bad { background: var(--bad-soft); color: var(--bad); }
.verdict .ans { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.verdict .retry { margin-left: auto; border: 0; background: none; color: var(--hema); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; }
.why h3, .others h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.why p { margin: 0; font-family: var(--f-read); font-size: 16px; line-height: 1.6; max-width: 68ch; }
.why p b { color: var(--hema); font-weight: 600; }
.others ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.others li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--sunk); }
.others li.picked { background: var(--bad-soft); }
.others .L { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.others li.picked .L { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.others .ot { font-family: var(--f-read); font-size: 14px; color: var(--ink-3); margin-bottom: 3px; }
.others .yr { font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); margin-left: 6px; }
.others .rs { font-family: var(--f-read); font-size: 15px; line-height: 1.5; }
.note { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; background: var(--note-soft); color: var(--ink); border-radius: var(--r); padding: 11px 14px; font-size: 14px; line-height: 1.5; }
.note b.k { color: var(--note); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }

.nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav .pos { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: auto; }
.nav .btn { min-width: 108px; }
.keys { font-size: 12px; color: var(--ink-3); }
.keys kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--ink-2); }

.empty { text-align: center; padding: 40px 20px; color: var(--ink-2); font-family: var(--f-read); font-size: 16px; }
.empty b { display: block; font-family: var(--f-display); font-size: 18px; color: var(--ink); margin-bottom: 6px; }

.foot { margin-top: 26px; font-size: 12px; color: var(--ink-3); line-height: 1.6; max-width: 80ch; }

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; display: none; padding-right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  body.show-panel .panel { display: flex; }
  .panel-toggle { display: inline-flex; }
  .keys { display: none; }
}
@media (max-width: 560px) {
  .card { padding: 18px 16px 20px; border-radius: 12px; }
  .stem { font-size: 17px; }
  .opt { font-size: 15px; padding: 10px 12px; gap: 10px; }
  .meter .bar { width: 110px; }
  .nav .btn { min-width: 0; flex: 1; }
  .nav .pos { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Bio 201 <span class="stain">Testbank</span> · Ch 1–5</h1>
      <p>Raven <i>Biology</i> testbank · instant feedback with the mechanism behind every option</p>
    </div>
    <div class="meter" aria-live="polite">
      <div class="bar" id="mbar"><i class="b-ok"></i><i class="b-bad"></i></div>
      <div class="num" id="mnum"></div>
    </div>
    <button class="panel-toggle" id="ptoggle" aria-expanded="false" aria-controls="panel">Filters &amp; map</button>
  </header>

  <div class="grid">
    <aside class="panel" id="panel">
      <div class="box">
        <span class="label">Chapters</span>
        <div class="chips" id="chips"></div>
      </div>
      <div class="box">
        <span class="label">Show</span>
        <div class="seg" id="filters"></div>
        <label class="toggle" for="hard"><input type="checkbox" id="hard"> Apply &amp; above only (Bloom 3–5)</label>
        <label class="toggle" for="shuffle"><input type="checkbox" id="shuffle"> Shuffle question order</label>
      </div>
      <div class="box">
        <span class="label">Score by chapter</span>
        <table class="score" id="score"></table>
      </div>
      <div class="box">
        <span class="label">Question map</span>
        <div class="legend"><span><i class="l-ok"></i>correct</span><span><i class="l-bad"></i>missed</span><span><i></i>unanswered</span><span><i class="l-flag"></i>flagged</span></div>
        <div class="map" id="map"></div>
      </div>
      <div class="actions" id="actions"></div>
    </aside>

    <main>
      <section class="card" id="card" aria-live="polite"></section>
      <div class="keys">Keys: <kbd>A</kbd>–<kbd>G</kbd> choose · <kbd>Enter</kbd> check / next · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag</div>
      <p class="foot" id="foot"></p>
    </main>
  </div>
</div>

34 °C incubator with adequate moisture. One set of seeds is placed in a dark area with no light source. A second set is placed under artificial light and a third set of seeds is placed in direct sunlight. This experiment is intended to test Phil's hypothesis that light is necessary for lettuce seed germination.","1:luke":"Luke went to a pediatrician when he was 6 months old. The pediatrician consulted a graph and concluded that Luke was in the 97th percentile for height, weight and length. The pediatrician predicted that Luke would be tall when he reached adulthood.","1:turtle":"Turtle hatchling survivorship rate is low in many turtle species due to predation. Amanda researched the predatory rate on a species of turtle eggs in the Red River. The eggs were harvested from trapped turtles and the egg's cloaca film (reproductive discharge) was either washed off or left on once gathered. Research suggests that predators use the female's cloaca scent to locate the eggs.<br><br>The eggs were only handled when wearing gloves and then reburied along islands where the turtles were trapped. The nests were monitored by cameras and manually on foot and data on nest predation were recorded.","5:eggs":"Three boiled eggs each weighing 2 g are placed in a 15% NaCl solution and reweighed after 30 minutes. <i>(The original figure isn't in the testbank file; its results were:)<\/i> <b>Egg 1 gained weight, Egg 2's weight did not change, Egg 3 lost weight.<\/b>","5:carrier":"A graph shows the rate of glucose diffusion into a cell through carrier proteins (y-axis) versus glucose concentration (x-axis). The curve rises and then levels off at high concentration. Points 1–4 mark increasing glucose concentrations along the curve (1 = lowest, 4 = highest). <i>(Figure described in words — the image isn't in the testbank file.)<\/i>"},"questions":[{"ch":1,"n":1,"sec":"01.01","bloom":3,"ctx":null,"stem":"Science is subdivided into specific areas of study termed disciplines. These divisions are artificial but are helpful to narrow the massive scope of scientific knowledge to a manageable amount. Given what you know about each, which scientific division is likely to present the best answer to a question about how fluid dynamics affect blood pressure in mammals?","opts":["Biochemistry – study of chemical reactions needed for life function, usually at the cellular level.","Bioinformatics – use of technology to study and store biological data","Biophysics – study of biological processes through physics","Biology – study of life"],"ans":["C"],"why":"Blood pressure is fluid being pushed through tubes — pressure, flow and resistance are physics quantities. Applying the laws of physics to a living system is <b>biophysics<\/b>.","wrong":{"A":"Biochemistry deals with molecules and reactions, not the bulk flow of a fluid through vessels.","B":"Bioinformatics stores and analyzes data (e.g., DNA sequences) with computers; it doesn't explain fluid mechanics.","D":"Biology is the umbrella field — true, but too broad to be the <i>best<\/i> answer."},"note":""},{"ch":1,"n":2,"sec":"01.01","bloom":3,"ctx":null,"stem":"Based on hierarchical levels of biological organization, which of these choices represents the broadest level?","opts":["Endocrine system","3 toed sloths","School of piranhas","Amazon Basin","Jaguars, giant anteaters, macaws, capybaras"],"ans":["D"],"why":"The Amazon Basin is an <b>ecosystem<\/b>: all the communities living there plus the nonliving environment (water, soil, climate). Order: cell → tissue → organ → organ system → organism → population → species → community → ecosystem → biosphere.","wrong":{"A":"An organ system works inside a single organism — far down the hierarchy.","B":"One kind of animal = population/species level.","C":"A school of one species of fish = population.","E":"Several interacting species = community. It's high, but it lacks the nonliving environment that makes an ecosystem."},"note":""},{"ch":1,"n":3,"sec":"01.02","bloom":1,"ctx":null,"stem":"Experiments are carried out to test a hypothesis by changing one variable at a time and including an unchanged variable termed a(n) ________.","opts":["experimental variable","altered variable","control","stable variable"],"ans":["C"],"why":"The <b>control<\/b> is the condition where the tested variable is left alone. It gives a baseline: any difference in the experimental group can then be blamed on the one variable you changed.","wrong":{"A":"The experimental (independent) variable is the one you deliberately change — the opposite.","B":"\"Altered variable\" just describes the thing you change, not the unchanged comparison.","D":"Not a standard term. Variables held constant in every group are \"controlled variables,\" but the comparison group itself is the control."},"note":""},{"ch":1,"n":4,"sec":"01.02","bloom":1,"ctx":null,"stem":"The method of reasoning that uses construction of general principles by careful examination of many specific cases is called:","opts":["deductive reasoning.","theoretical reasoning.","hypothetical reasoning.","inductive reasoning.","experimental reasoning."],"ans":["D"],"why":"Specific cases → general rule = <b>inductive<\/b> (bottom-up). Deductive goes the other way: general rule → specific prediction.","wrong":{"A":"Deductive starts from a general premise and predicts a specific case.","B":"Not one of the formal types of reasoning in the text.","C":"Not a formal reasoning type; hypotheses are <i>products<\/i> of reasoning.","E":"Not a formal reasoning type; experiments test ideas."},"note":""},{"ch":1,"n":5,"sec":"01.02","bloom":2,"ctx":null,"stem":"Dr. Ratard was trying to determine the cause of a mysterious epidemic affecting fish in the gulf of New Mexico. His proposal that the deaths were caused by an organism called a protist is considered a(n) ________","opts":["experiment.","hypothesis.","conclusion.","theory.","data set."],"ans":["B"],"why":"A proposed, testable explanation for an observation is a <b>hypothesis<\/b>. He hasn't tested it yet.","wrong":{"A":"An experiment is the test of the idea, not the idea itself.","C":"A conclusion comes after collecting and analyzing data.","D":"A theory needs a large body of supporting evidence from many tests.","E":"A data set is the measurements themselves."},"note":""},{"ch":1,"n":6,"sec":"01.03","bloom":1,"ctx":null,"stem":"After Darwin concluded his voyage on the <i>Beagle<\/i>, he proposed that the process of natural selection was a mechanism for:","opts":["artificial selection.","evolution.","sexual selection.","speciation.","overpopulation of finches on the Galapagos Islands."],"ans":["B"],"why":"Natural selection is the <i>mechanism<\/i>; <b>evolution<\/b> (change in populations over generations) is what it explains.","wrong":{"A":"Artificial selection (human breeding) was Darwin's analogy, not the thing natural selection explains.","C":"Sexual selection is a special kind of selection, not the outcome.","D":"Speciation is one outcome of evolution, but Darwin proposed natural selection as the mechanism of evolution in general.","E":"Overpopulation is a premise (from Malthus), not what selection explains."},"note":""},{"ch":1,"n":7,"sec":"01.02","bloom":1,"ctx":null,"stem":"A scientific theory is:","opts":["a suggested explanation that accounts for observations.","a way to organize how we think about a problem.","a concept that is supported by experimental evidence that explains the facts in an area of study.","a way to understand a complex system by reducing it to its working parts."],"ans":["C"],"why":"A <b>theory<\/b> is a well-tested, broadly supported explanation that ties together many facts (cell theory, evolution). It's much stronger than a guess.","wrong":{"A":"That's a hypothesis — tentative, not yet heavily supported.","B":"Too vague; that describes a framework or model.","D":"That's reductionism."},"note":""},{"ch":1,"n":8,"sec":"01.01","bloom":2,"ctx":null,"stem":"What common life characteristic would cells from a daisy, bacteria, and a dog all have?","opts":["DNA","cell walls","organs","ability to conduct photosynthesis"],"ans":["A"],"why":"Every living cell stores its hereditary information in <b>DNA<\/b> — a universal feature of life.","wrong":{"B":"Animal (dog) cells have no cell wall.","C":"Bacteria are single cells; organs only exist in multicellular organisms.","D":"Dogs can't photosynthesize (and most bacteria can't either)."},"note":""},{"ch":1,"n":9,"sec":"01.02","bloom":2,"ctx":null,"stem":"A yellow jacket, an insect in the order Hymenoptera, stung me. A wasp, an insect in Hymenoptera, stung me. A hornet, an insect in Hymenoptera, stung me. I see a pattern. All insects in this order must have stingers. What type of reasoning does this represent?","opts":["inductive reasoning","deductive reasoning","reductionism","comparative reasoning"],"ans":["A"],"why":"Three specific observations → a general rule about the whole order = <b>inductive<\/b>. Note that induction can be wrong: male Hymenoptera can't sting (the stinger is a modified egg-laying organ).","wrong":{"B":"Deduction would start from the general rule (\"all Hymenoptera sting\") and predict a specific case.","C":"Reductionism breaks a system into its parts — nothing is being taken apart here.","D":"Not one of the reasoning types in the text."},"note":""},{"ch":1,"n":10,"sec":"01.02","bloom":1,"ctx":null,"stem":"You explain to your study group that a hypothesis is:","opts":["an explanation that accounts for careful observations.","a proposition that will be true and fits the known facts.","a theory.","constant over time."],"ans":["A"],"why":"A hypothesis is a <b>tentative explanation<\/b> built to account for what you observed — something you can then test.","wrong":{"B":"A hypothesis <i>might<\/i> be true; nothing guarantees it.","C":"A theory is far broader and much better supported.","D":"Hypotheses get revised or rejected as new data arrive."},"note":""},{"ch":1,"n":11,"sec":"01.02","bloom":1,"ctx":null,"stem":"A suggested explanation that might be true and is subject to testing by further observations is a(n):","opts":["experiment.","generality.","hypothesis.","scientific principle.","theory."],"ans":["C"],"why":"\"Might be true\" + \"subject to testing\" = <b>hypothesis<\/b>.","wrong":{"A":"The experiment is the test, not the explanation.","B":"Not a formal scientific term.","D":"A scientific principle is already well established, not tentative.","E":"A theory is heavily supported — not just \"might be true.\""},"note":""},{"ch":1,"n":12,"sec":"01.02","bloom":3,"ctx":null,"stem":"Based on the literature, you hypothesize that students in traditional biology lectures will have the same grades as students in online biology lectures. You decide to test your hypothesis by comparing grades of students in traditional and online biology lectures over a semester. As a result of the experiment, you observe that the grades in the traditional lectures and the grades in the online lectures are not significantly different. What do these observations allow you to do?","opts":["reject the hypothesis","accept the hypothesis without further question","develop a scientific theory","reject the null hypotheses"],"ans":["D"],"why":"The data agree with your hypothesis. In this testbank's framing, the null hypothesis is the opposite of yours (\"grades will differ\"), so the result lets you <b>reject that null<\/b>. You never \"prove\" your own hypothesis — you rule out the alternative.","wrong":{"A":"The data match the hypothesis, so there's no reason to reject it.","B":"Science never accepts a hypothesis \"without further question\" — it stays open to future testing.","C":"One semester-long study can't establish a theory."},"note":"In real statistics the null is usually \"no difference,\" and a non-significant result means you \"fail to reject\" it. The testbank defines the null as the opposite of your hypothesis — go with the key on the exam."},{"ch":1,"n":13,"sec":"01.02","bloom":2,"ctx":null,"stem":"Your microwave will not turn on, and you speculate that a circuit breaker in the house has been tripped. In scientific terminology, the steps would be described as:","opts":["forming conclusions from the results of experiments.","developing an observation based on a hypothesis.","developing a hypothesis based on an observation.","testing a prediction generated from a hypothesis."],"ans":["C"],"why":"Observation (microwave is dead) → proposed explanation (tripped breaker) = <b>hypothesis from an observation<\/b>.","wrong":{"A":"No experiment has been run yet.","B":"Reversed order — the observation came first.","D":"Checking the breaker would be the test; you haven't done it yet."},"note":""},{"ch":1,"n":14,"sec":"01.02","bloom":2,"ctx":null,"stem":"A student poses the question: How does the presence of dissolved salt affect the freezing point of water? To answer this question, the student set up two conditions. In the first condition, the student added salt to water in a container and referred to this condition as the variable. In the second condition, the student did not add any salt to water in a second container and referred to this condition as the control. The student took both containers and attempted to freeze the water at various temperatures to assess the freezing point. Would this be a valid experiment?","opts":["Yes, because there is more than one variable.","Yes, because there is one variable and a control","No, because there is not more than one variable","No because there is only one variable and a control"],"ans":["B"],"why":"A valid experiment changes <b>one<\/b> independent variable (salt) and compares it to a <b>control<\/b> (no salt), with everything else the same. That's exactly this design.","wrong":{"A":"More than one variable would confound the result — you couldn't tell which one caused the effect.","C":"You don't need more than one variable; one is ideal.","D":"One variable plus a control is the gold standard, not a flaw."},"note":""},{"ch":1,"n":15,"sec":"01.02","bloom":1,"ctx":null,"stem":"Karl Popper suggested that scientists use \"imaginative preconception,\" which means that successful scientists:","opts":["often predict the outcome of experiments.","cannot predict the outcome of experiments.","do not need to do experiments to test their ideas.","do not keep records of experiments that fail.","only perform applied research."],"ans":["A"],"why":"Popper's point: scientists go in with an idea of what they expect and design experiments to <b>test that prediction<\/b>.","wrong":{"B":"The opposite of his point.","C":"Predictions still have to be tested experimentally.","D":"Failed experiments are recorded — negative results are informative.","E":"Unrelated to the idea; applies to basic and applied research alike."},"note":""},{"ch":1,"n":16,"sec":"01.03","bloom":1,"ctx":null,"stem":"The proposal that one type of organism can change gradually into another type over a long period of time is known as:","opts":["evolution.","natural history.","preconception.","preservation."],"ans":["A"],"why":"Gradual change of populations over generations = <b>evolution<\/b>.","wrong":{"B":"Natural history is the study of organisms in their natural setting.","C":"Preconception = an expectation held before testing.","D":"Not a biological process."},"note":""},{"ch":1,"n":17,"sec":"01.03","bloom":2,"ctx":null,"stem":"Darwin's ideas on evolution were advanced for his time. His approach to science and natural selection were supported by what main tenet?","opts":["Various organisms and their structures resulted from a spontaneous action.","Species were unchangeable over the course of time.","The world is fixed and constant.","Operation of natural laws produces constant change and improvement."],"ans":["D"],"why":"Darwin built on Lyell's geology: <b>natural laws acting continuously<\/b> over long times produce gradual change.","wrong":{"A":"Spontaneous creation is the opposite of gradual change by natural law.","B":"Fixed, unchangeable species was the view Darwin overturned.","C":"A fixed, constant world was also the old view he rejected."},"note":""},{"ch":1,"n":18,"sec":"01.03","bloom":1,"ctx":null,"stem":"Besides Darwin, the theory of evolution by means of natural selection was also independently proposed by:","opts":["Alfred Wallace.","Charles Lyell.","Thomas Malthus.","Karl Popper.","Peter Raven."],"ans":["A"],"why":"<b>Alfred Russel Wallace<\/b> reached the same idea independently; their papers were presented together in 1858.","wrong":{"B":"Lyell was the geologist whose gradual-change view influenced Darwin.","C":"Malthus wrote on population growth outpacing food.","D":"Popper was a philosopher of science (20th century).","E":"Raven is a botanist and the textbook's author."},"note":""},{"ch":1,"n":19,"sec":"01.03","bloom":1,"ctx":null,"stem":"The term that Darwin used to describe the concept that those with superior physical, behavior or other attributes are more likely to survive than those that are not so well endowed, and thus are more likely to pass their traits to the next generation, is called:","opts":["biological diversity","geometric progression","natural selection","superior beings","survival of modifications"],"ans":["C"],"why":"Differential survival and reproduction of better-suited variants = <b>natural selection<\/b>.","wrong":{"A":"Biodiversity is the variety of life, not a process.","B":"Geometric progression is Malthus's description of population growth.","D":"Not a scientific term.","E":"Not Darwin's term."},"note":""},{"ch":1,"n":20,"sec":"01.03","bloom":1,"ctx":null,"stem":"A key contribution to Darwin's thinking was the concept of limits put on the geometric growth of populations by nature, originally proposed by:","opts":["Charles Lyell.","Thomas Malthus.","Karl Popper.","Peter Raven.","Russel Wallace."],"ans":["B"],"why":"<b>Malthus<\/b> argued populations grow geometrically while food grows arithmetically, so many individuals must die — the \"struggle for existence\" Darwin used.","wrong":{"A":"Lyell contributed deep time and gradual geological change.","C":"Popper wrote about how science works.","D":"Raven is the textbook author.","E":"Wallace co-discovered natural selection; he didn't originate the population-limit idea."},"note":""},{"ch":1,"n":21,"sec":"01.03","bloom":1,"ctx":null,"stem":"Darwin's book in which he described his views on evolution is:","opts":["Principles of Geology.","On the Principle of Population.","On the Origin of Species.","Survival of the Fittest."],"ans":["C"],"why":"<b><i>On the Origin of Species<\/i><\/b> (1859).","wrong":{"A":"Lyell's book.","B":"Close to Malthus's essay title.","D":"\"Survival of the fittest\" is a phrase coined by Herbert Spencer, not a Darwin book."},"note":""},{"ch":1,"n":22,"sec":"01.03","bloom":1,"ctx":null,"stem":"Recent discoveries of microscopic fossils have extended the known history of life to about:","opts":["3.5 billion years ago.","2 billion years ago.","4.5 billion years ago.","1 billion years ago."],"ans":["A"],"why":"Microfossils of prokaryotes date to roughly <b>3.5 billion years ago<\/b>.","wrong":{"B":"Too recent — that's roughly when eukaryotes appear, but prokaryotic life is much older.","C":"That's roughly the age of the Earth itself; life came later.","D":"Far too recent."},"note":""},{"ch":1,"n":23,"sec":"01.03","bloom":3,"ctx":null,"stem":"In California, a species of salamanders were geographically separated over time. The group that lived in southern California relied heavily on large gold blotches on their skin that helped to camouflage them from predators. The group that lived along the coast adopted a color pattern that mimicked a poisonous, colorful newt common to that area. Instead of being camouflaged, these salamanders advertised their colors. What type of selection process has occurred over time?","opts":["artificial selection","natural selection","experimental selection","theoretical selection"],"ans":["B"],"why":"Each environment favored a different color pattern (hide vs. mimic a toxic species), and <b>predators<\/b> did the selecting. No humans involved → <b>natural selection<\/b>.","wrong":{"A":"Artificial selection requires humans choosing which individuals breed.","C":"Not a real type of selection; no experiment occurred.","D":"Not a real type of selection."},"note":""},{"ch":1,"n":24,"sec":"01.03","bloom":2,"ctx":null,"stem":"The same basic array of bones is modified to give rise to the wing of a bat and the fin of a porpoise. Such anatomical structures are called:","opts":["analogous.","uniform.","homologous.","inherited.","evolutionary modifications."],"ans":["C"],"why":"Same underlying structure inherited from a <b>common ancestor<\/b>, modified for different jobs = <b>homologous<\/b>.","wrong":{"A":"Analogous = similar function but different ancestry (the opposite).","B":"Not the technical term.","D":"Too vague; all traits are inherited.","E":"Not the technical term."},"note":""},{"ch":1,"n":25,"sec":"01.03","bloom":1,"ctx":null,"stem":"Structures that have similar structure and function but different evolutionary origins are called:","opts":["homologous.","analogous.","inherited.","uniform.","evolutionary modifications."],"ans":["B"],"why":"Different ancestry, similar solution (convergent evolution) = <b>analogous<\/b>.","wrong":{"A":"Homologous = shared ancestry (the opposite).","C":"Too vague.","D":"Not a term.","E":"Not a term."},"note":""},{"ch":1,"n":26,"sec":"01.03","bloom":2,"ctx":null,"stem":"The rate at which evolution is occurring cannot be estimated by:","opts":["studying comparative anatomy.","inferring that apes are related to humans.","measuring the degree of difference in genetic coding.","interpretation of the fossil record."],"ans":["B"],"why":"To estimate a <i>rate<\/i> you need measurable change over time. Simply <b>inferring relatedness<\/b> tells you nothing about how fast change happened.","wrong":{"A":"Degree of anatomical divergence can be measured and compared.","C":"DNA differences accumulate at fairly steady rates — the \"molecular clock.\"","D":"Dated fossils show change across known spans of time."},"note":""},{"ch":1,"n":27,"sec":"01.03","bloom":2,"ctx":null,"stem":"Differences in domesticated animals over relatively short periods of time most likely occur through:","opts":["natural selection","adaptation","evolution","experimental selection","artificial selection"],"ans":["E"],"why":"Breeders choose which animals reproduce → <b>artificial selection<\/b> → rapid change (e.g., dog breeds in a few centuries).","wrong":{"A":"Here humans, not the environment, choose the parents.","B":"Adaptation is an outcome, not the mechanism.","C":"Evolution is the broad outcome; the question asks what drives these changes.","D":"Not a real type of selection."},"note":""},{"ch":1,"n":28,"sec":"01.02","bloom":4,"ctx":"1:plots","stem":"The most plausible explanation for the high number of spiders in plot 4 is:","opts":["there are too many flies overall.","there are no centipedes to prey on the spiders and there are abundant flies upon which to feed.","the spiders preyed on the centipedes and ignored the flies.","the flies and spiders worked together to eliminate the centipedes."],"ans":["B"],"why":"Spiders sit in the middle of this food web. Plot 4 has <b>zero centipedes<\/b> (no predator) and the <b>most flies<\/b> (most food). Both factors favor spiders → 78 spiders.","wrong":{"A":"Ignores the missing predator; plot 2 also has many flies but few spiders.","C":"Centipedes eat spiders, not the reverse — and plot 4's high fly count shows spiders weren't ignoring flies.","D":"Prey don't cooperate to remove predators; nothing in the data suggests it."},"note":""},{"ch":1,"n":29,"sec":"01.02","bloom":2,"ctx":"1:plots","stem":"The plots that were staked out on the island were part of the:","opts":["applied research.","basic research.","constructed model.","experimental design."],"ans":["D"],"why":"Choosing how and where to sample (five plots, counting each group) is how the study is set up = <b>experimental design<\/b>.","wrong":{"A":"Applied research targets a practical problem; nothing here is commercial or applied.","B":"The study as a whole is basic research, but the plots themselves are a design element.","C":"A model is a simplified representation; field plots are real sampling."},"note":""},{"ch":1,"n":30,"sec":"01.02","bloom":5,"ctx":"1:plots","stem":"Based on the information provided, the best explanation for the low numbers of spiders and flies in plot 5 is:","opts":["centipedes are actively consuming flies and spiders.","there were not enough flies to support a large centipede population.","centipedes prefer spiders to flies.","there were not enough spiders to catch and consume all the flies."],"ans":["A"],"why":"Plot 5 has the <b>most centipedes (93)<\/b> and the fewest flies (79) and spiders (13). A top predator suppressing both prey groups fits best.","wrong":{"B":"There clearly <i>is<\/i> a large centipede population, so food wasn't limiting them.","C":"Both prey groups dropped; you can't infer a preference.","D":"If too few spiders were eating flies, flies would be high — they're the lowest."},"note":""},{"ch":1,"n":31,"sec":"01.02","bloom":2,"ctx":"1:plots","stem":"The hypothesis that closely matches the data provided is:","opts":["herbivorous insects survive best on islands where spiders and centipedes live.","herbivorous insects feed on spiders and centipedes.","herbivorous insects and spider populations are decreased by centipedes.","spiders are the top predators on all islands."],"ans":["C"],"why":"Across plots, more centipedes ↔ fewer flies and spiders (plot 4: 0 centipedes, most of both; plot 5: 93 centipedes, fewest of both). <b>Centipedes decrease both<\/b>.","wrong":{"A":"Flies are lowest exactly where predators are most abundant.","B":"Herbivores eat plants, not predators.","D":"Centipedes, not spiders, are top predators here — and one island can't support \"all islands.\""},"note":""},{"ch":1,"n":32,"sec":"01.02","bloom":2,"ctx":null,"stem":"If you were to design a long-term research study to determine why there are no human births in Lapland during the months of August, September, and October, you would need to also examine a comparison population of humans in which births took place every month. The primary reason for including a comparison population within the design of this experiment would be to:","opts":["accumulate more facts that could be reported to other scientists.","test the effects of more than one variable at the same time.","prove that there are no births in Lapland during August, September, and October.","act as a control that would ensure that the results obtained are due to a difference in only one variable."],"ans":["D"],"why":"The comparison group is a <b>control<\/b>: it lets you attribute any difference to the variable of interest instead of something else.","wrong":{"A":"Controls exist for valid comparison, not to pile up facts.","B":"Good design tests one variable at a time.","C":"Science doesn't \"prove\"; and the missing births are already observed."},"note":""},{"ch":1,"n":33,"sec":"01.03","bloom":2,"ctx":null,"stem":"<i>Essay on the Principle of Population<\/i>, written by Thomas Malthus in 1798, influenced Darwin's thoughts as he struggled to understand what mechanisms could be at work to produce evolution. Malthus proposed that populations of animals and plants, including humans,","opts":["increased arithmetically in numbers while the nutrients available only increased geometrically.","increased geometrically in numbers while the nutrients available only increased arithmetically.","decreased arithmetically in numbers while the nutrients available increased geometrically.","evolved from islands to mainland, thus explaining why unrelated species on the mainland are found in the same location.","evolved from mainland to islands, thus explaining why the island flora and fauna resembled the mainland species so closely."],"ans":["B"],"why":"Populations multiply (2, 4, 8, 16…) while food adds (1, 2, 3, 4…). Populations always outrun food → <b>struggle for existence<\/b> → Darwin's key insight.","wrong":{"A":"Reversed.","C":"Populations don't decrease in his model.","D":"Biogeography, not Malthus.","E":"Biogeography (Darwin's island observations), not Malthus."},"note":""},{"ch":1,"n":34,"sec":"01.02","bloom":4,"ctx":null,"stem":"A student set up an experiment to test if plants give off water vapor. Fifty pea plants, growing in pots, were covered with individual glass containers and left overnight. The next morning, the inside of each lid was covered in droplets of water. The lab student concluded that plants generally give off water vapor. What critique would you make of the experimental design?","opts":["There was no control so the water could have come from other sources such as air in the jar or the soil.","There was not a large enough sample of pea plants used to get adequate data.","The student did not have a clearly stated hypothesis before beginning the experiment.","The experiment was not precise, meaning it was not reproducible."],"ans":["A"],"why":"With no <b>control<\/b> (pot + soil, no plant), you can't rule out water evaporating from the damp soil or condensing from humid air.","wrong":{"B":"50 plants is a reasonable sample.","C":"The hypothesis (plants give off water vapor) is clear from the setup.","D":"Nothing suggests it couldn't be repeated."},"note":""},{"ch":1,"n":35,"sec":"01.02","bloom":2,"ctx":null,"stem":"It is known that many trees lose their leaves in response to decreasing day length. As a result, you think that <i>Ginkgo<\/i> trees may also lose their leaves in response to decreasing day length. This statement is an example of:","opts":["deductive reasoning","an experiment","a hypothesis","a theory"],"ans":["C"],"why":"The statement is a <b>tentative, testable proposal<\/b> (\"may also\") — a hypothesis. Compare Q39, where \"must\" makes it a deductive conclusion.","wrong":{"A":"Deductive logic produced the idea, but the statement itself is phrased as a testable proposal.","B":"Nothing is being tested yet.","D":"A theory requires extensive supporting evidence."},"note":""},{"ch":1,"n":36,"sec":"01.02","bloom":2,"ctx":null,"stem":"Multiple independent experiments have demonstrated that phytochrome helps trigger seasonal change responses in the plant such as changing color and loosening of leaves. Plants have the ability to adapt to seasonal changes in their surroundings. This statement is an example of:","opts":["deductive reasoning","an experiment","a hypothesis","inductive reasoning","a theory"],"ans":["E"],"why":"A broad explanation supported by <b>multiple independent experiments<\/b> = <b>theory<\/b>.","wrong":{"A":"A reasoning method, not what this statement is.","B":"It summarizes experiments; it isn't one.","C":"A hypothesis is untested; this one is repeatedly supported.","D":"A reasoning method, not what this statement is."},"note":""},{"ch":1,"n":37,"sec":"01.02","bloom":2,"ctx":null,"stem":"Plants are raised under artificial lights turned off and on by an electric clock. Some are given long periods of light, others short periods. This is an example of:","opts":["deductive reasoning","an experiment","a hypothesis","inductive reasoning","a theory"],"ans":["B"],"why":"Deliberately <b>manipulating<\/b> one variable (light period) under controlled conditions = <b>experiment<\/b>.","wrong":{"A":"A reasoning method.","C":"The hypothesis is the idea being tested, not the setup.","D":"A reasoning method.","E":"A theory is a well-supported explanation, not a procedure."},"note":""},{"ch":1,"n":38,"sec":"01.02","bloom":2,"ctx":null,"stem":"Both walnut and <i>Ginkgo<\/i> trees lose their leaves in the fall when day length starts decreasing. Based on these observations one may conclude that many tree species will lose their leaves in the fall in response to decreasing day length. This statement is an example of:","opts":["deductive reasoning","an experiment","inductive reasoning","a theory"],"ans":["C"],"why":"Specific cases (walnut, Ginkgo) → general statement (many trees) = <b>inductive<\/b>.","wrong":{"A":"Deduction goes general → specific.","B":"Nothing was manipulated.","D":"Two observations are far too little for a theory."},"note":""},{"ch":1,"n":39,"sec":"01.02","bloom":2,"ctx":null,"stem":"<i>Ginkgo<\/i> trees are known to lose their leaves at a certain time each year throughout the United States. Based on this information, <i>Ginkgo<\/i> trees in China must behave the same way. These statements are an example of:","opts":["deductive reasoning","an experiment","inductive reasoning","a theory"],"ans":["A"],"why":"General premise (Ginkgos lose leaves on a schedule) → specific conclusion (Chinese Ginkgos must too) = <b>deductive<\/b>.","wrong":{"B":"Nothing is tested.","C":"Induction goes specific → general.","D":"A theory is a well-supported explanation, not a single inference."},"note":""},{"ch":1,"n":40,"sec":"01.02","bloom":2,"ctx":null,"stem":"Most individuals in academia are basic researchers, funded through research grants from agencies or foundations. Based on your knowledge of applied research, an industrial company would most likely employ individuals","opts":["who develop alternative fuel sources.","who identify a new species of beetle in the Amazon rainforest.","looking at novel proteins involved in the development of a neurological disease.","who document fossils found in a specific archeological expedition."],"ans":["A"],"why":"<b>Applied research<\/b> solves a practical problem with direct commercial use — developing alternative fuels.","wrong":{"B":"Discovering/describing species is basic, descriptive science.","C":"Studying disease mechanisms is basic research (it may lead to applications later).","D":"Documenting fossils is descriptive science."},"note":""},{"ch":1,"n":41,"sec":"01.03","bloom":2,"ctx":null,"stem":"Wings of birds and butterflies have similar functions, but different evolutionary origins. They are:","opts":["homologous structures.","physiological structures.","phylogenetic structures.","analogous structures."],"ans":["D"],"why":"Similar function, different ancestry → <b>analogous<\/b> (convergent evolution).","wrong":{"A":"Homologous requires a shared ancestral structure (bird wing vs. bat wing as forelimbs).","B":"Not the term for this comparison.","C":"Not the term for this comparison."},"note":""},{"ch":1,"n":42,"sec":"01.02","bloom":3,"ctx":null,"stem":"An alien from another planet landed on earth. He is fascinated by cars and is determined to figure out how they work. He decides to disassemble one of them and examine each part independently. He removes one of the tires and proceeds to learn all he can about the tire. He then removes one of the headlights and proceeds to learn all he can about the headlight. What type of approach is this alien taking to learn about the car?","opts":["reductionism","deductive reasoning","inductive reasoning","Emergent properties"],"ans":["A"],"why":"Breaking a system into parts and studying each part alone = <b>reductionism<\/b>.","wrong":{"B":"No general premise is being used to predict a case.","C":"No data are being generalized into a rule.","D":"Emergent properties are the opposite idea — properties (like \"driving\") that appear only when parts work together, which studying parts alone misses."},"note":""},{"ch":1,"n":43,"sec":"01.01","bloom":2,"ctx":null,"stem":"While you are riding the ski lift up to the top of the mountain on a very cold day you start to shiver involuntarily. You know that the shivering is your body's attempt to help regulate your body temperature and is an example of what type of mechanism?","opts":["energy utilization","sensitivity","homeostasis","evolutionary adaptation"],"ans":["C"],"why":"Cold detected → muscles contract rapidly to generate heat → temperature returns toward set point. This negative feedback that keeps internal conditions stable is <b>homeostasis<\/b>.","wrong":{"A":"Shivering uses energy, but its purpose is regulation.","B":"Sensing the cold is only the trigger; the full regulatory loop is homeostasis.","D":"Adaptation happens across generations, not within one person on a ski lift."},"note":""},{"ch":1,"n":44,"sec":"01.01","bloom":3,"ctx":null,"stem":"You have been assigned to address a problem of overpopulation of species X in a nearby county. One of the members of your team suggests introducing species Y, which is a natural predator of species X, but not normally found in the area. After some discussion, you go ahead and introduce species Y. What aspects of the hierarchical organization may be affected within a period of several years?","opts":["population, species, community","population, community","population, species, community, biosphere","organism, population, species"],"ans":["A"],"why":"A new predator cuts X's <b>population<\/b>, which affects the <b>species<\/b>' status locally, and changes predator–prey interactions in the <b>community<\/b>.","wrong":{"B":"Leaves out the species level.","C":"One county over a few years won't measurably change the biosphere.","D":"Leaves out the community, where the new predator–prey interaction is the main change."},"note":""},{"ch":1,"n":45,"sec":"01.04","bloom":3,"ctx":null,"stem":"You have been assigned to analyze some extraterrestrial material recently collected from Mars. After examining a sample using a microscope you jump up excitedly and shout to your colleagues that you have confirmed the existence of life on Mars. One of your colleagues takes a look at your sample and remarks that all he sees is a single-celled \"blob\" with little internal structure. Assuming that life on Mars can be classified into similar domains and kingdoms as Earth, to which domain does your \"blob\" belong?","opts":["Animalia","Fungi","Protista","Archaea"],"ans":["D"],"why":"Single cell, <b>no internal membrane-bound structures<\/b> = prokaryote. Archaea is the only prokaryotic domain listed (the others aren't even domains — they're eukaryotic kingdoms).","wrong":{"A":"Animals are multicellular eukaryotes.","B":"Fungi are eukaryotes with nuclei and organelles.","C":"Protists are eukaryotes with nuclei and organelles."},"note":""},{"ch":1,"n":46,"sec":"01.04","bloom":2,"ctx":null,"stem":"Why was the determination of the actual sequence of the human genome considered to be descriptive science?","opts":["It involved hypothesis-driven research.","It did not involve hypothesis-driven research.","It involved inductive reasoning.","It did not involve deductive reasoning."],"ans":["B"],"why":"Descriptive science catalogs what exists — here, every base of the genome — <b>without testing a hypothesis<\/b>.","wrong":{"A":"The opposite of descriptive science.","C":"The type of reasoning isn't what defines \"descriptive.\"","D":"Same — the defining feature is the lack of a tested hypothesis."},"note":""},{"ch":1,"n":47,"sec":"01.02","bloom":2,"ctx":null,"stem":"You look outside and realize that your grass needs to be mowed. You pick up the container of gasoline and see that you have approximately a third of a gallon left. You hypothesize that this amount will be enough to mow your entire lawn. Unfortunately, half way through mowing your lawn you run out of gasoline. You grumble and think to yourself that the next time you mow the lawn, you hypothesize that you will need to have at least two-thirds of a gallon of gasoline available. How did the results of your lawn-mowing experience influence the validity of your new hypothesis for future gasoline needs?","opts":["Your prediction of future gas needs is based on experimental data and therefore increases the validity of your hypothesis.","The hypothesis was invalidated by your experimental evidence.","Your hypothesis was supported by trial and error. One more trial added to your data set.","Your prediction proved that your hypothesis is correct."],"ans":["A"],"why":"Your new hypothesis is <b>built on actual data<\/b> (1/3 gallon mowed half), which makes it better grounded.","wrong":{"B":"The <i>old<\/i> hypothesis was invalidated; the new one is supported by that evidence.","C":"The new hypothesis hasn't been tested yet — it was derived from the data, not \"supported by trial and error.\"","D":"Predictions never prove a hypothesis, and this one is still untested."},"note":""},{"ch":1,"n":48,"sec":"01.01","bloom":2,"ctx":null,"stem":"Why is it necessary to take an interdisciplinary approach to studying biology?","opts":["Interdisciplinary approaches are required to answer all scientific questions since all disciplines borrow knowledge from each.","Research methods used to solve many biological questions often require a number of different types of approaches and the expertise of a variety of scientists.","An interdisciplinary approach is the only way we can further our biological knowledge."],"ans":["B"],"why":"Many biological questions need tools from chemistry, physics, math and computing — <b>many<\/b>, not all.","wrong":{"A":"\"All scientific questions\" overreaches.","C":"\"Only way\" overreaches."},"note":""},{"ch":1,"n":49,"sec":"01.01","bloom":2,"ctx":null,"stem":"How does peer review influence the development of scientific theories?","opts":["Peer review allows other scientists to know what is current in their field.","Careful evaluation of research results by other scientists ensures that only solid and legitimate research results are published, and helps prevent faulty research or false claims from being viewed as scientific fact.","Peer review increases competition among scientists and thus increases the quality of the published work.","Peer review makes it extremely difficult for work to be published other than earth-shattering scientific theories."],"ans":["B"],"why":"Experts scrutinize methods and conclusions before publication, <b>filtering out flawed claims<\/b> so theories rest on solid evidence.","wrong":{"A":"A side effect of publishing, not how review shapes theories.","C":"Competition isn't the purpose of review.","D":"False — most published work is incremental."},"note":""},{"ch":1,"n":50,"sec":"01.04","bloom":1,"ctx":null,"stem":"Cell theory is one of the foundations of biology. What are the tenets of the cell theory? Check all that apply.","opts":["All organisms are made up of more than one cell.","All cells have the ability to move.","Cells carry genetic material passed to daughter cells during cellular division.","Cells arise from other cells through the process of cell division.","Organisms are formed through spontaneous generation","All living organisms consist of cells"],"ans":["C","D","F"],"why":"Cell theory: all organisms are made of <b>one or more cells<\/b>; cells come only from <b>preexisting cells<\/b>; and cells pass their <b>hereditary material<\/b> to daughter cells.","wrong":{"A":"\"More than one\" excludes unicellular organisms like bacteria.","B":"Many cells (e.g., plant cells) don't move.","E":"Spontaneous generation was disproven (Pasteur) — it contradicts cell theory."},"note":""},{"ch":1,"n":51,"sec":"01.03","bloom":2,"ctx":null,"stem":"Darwin's theory of evolution is supported by many modern pieces of evidence. Check all that apply.","opts":["New measurements of the age of the earth.","An understanding of the mechanism of heredity.","Human population growth.","Comparative studies of animal structures.","Similarities in DNA of related species."],"ans":["A","B","E"],"why":"\"Modern\" = evidence that came <b>after<\/b> Darwin: radiometric dating showing an old Earth, the mechanism of heredity (genes/DNA), and molecular similarities in DNA.","wrong":{"C":"Population growth (Malthus) inspired Darwin; it isn't evidence that evolution happened.","D":"Comparative anatomy was already Darwin's own evidence — classic, not modern."},"note":"Comparative anatomy does support evolution; the key excludes it only because Darwin already had it."},{"ch":1,"n":52,"sec":"01.02","bloom":3,"ctx":null,"stem":"Amanda was studying turtles based on DNA analysis. Under the current classification scheme, which of the following turtle species are thought to be most closely related? (1) <i>Graptemys ouachitensis<\/i>, (2) <i>Trachemys scripta<\/i>, (3) <i>Apalone spinifera<\/i>, (4) <i>Graptemys kohni<\/i>.","opts":["1 and 3 due to inductive reasoning","1 and 3 due to deductive reasoning","2 and 3 due to inductive reasoning","1 and 4 due to inductive reasoning","2 and 3 due to deductive reasoning","1 and 4 due to deductive reasoning"],"ans":["D"],"why":"Same genus (<i>Graptemys<\/i>) → closest relatives → 1 and 4. Drawing a conclusion from DNA data = <b>inductive<\/b>.","wrong":{"A":"1 and 3 are different genera.","B":"Wrong pair and wrong reasoning.","C":"2 and 3 are different genera.","E":"Wrong pair and wrong reasoning.","F":"Right pair, but analyzing data to reach a conclusion is inductive, not deductive."},"note":""},{"ch":1,"n":53,"sec":"01.04","bloom":2,"ctx":null,"stem":"Marceau is studying small single-celled organisms that contain phospholipid membranes. These organisms can be broadly classified into the domain:","opts":["Bacteria","Protista","Animalia","Fungi"],"ans":["A"],"why":"Small, single-celled, with typical phospholipid membranes → <b>Bacteria<\/b> (also the only domain on the list).","wrong":{"B":"Protista is a eukaryotic kingdom, not a domain.","C":"Animalia is a multicellular eukaryotic kingdom.","D":"Fungi is a eukaryotic kingdom."},"note":"Archaea are also single-celled, but their membranes use unusual ether-linked lipids."},{"ch":1,"n":56,"sec":"01.03","bloom":2,"ctx":null,"stem":"Bacterial cells are placed into a 250mL liquid growth medium in a closed laboratory flask. According to Malthusian theory, they will reproduce exponentially and then:","opts":["continue reproducing geometrically as long as there are no limitations on food supply.","continue reproducing arithmetically as long as there are no limitations on food supply.","continue reproducing geometrically until the food supply is used up, then they will cease to grow.","continue reproducing arithmetically until the food supply is used up, then they will cease to grow."],"ans":["C"],"why":"A closed flask = finite food. Bacteria double (geometric growth) until resources run out, then growth stops — <b>Malthus's limit<\/b> in miniature.","wrong":{"A":"Food is limited in a closed flask.","B":"Bacterial growth is doubling (geometric), not arithmetic — and food is limited.","D":"Growth is geometric, not arithmetic."},"note":""},{"ch":1,"n":57,"sec":"01.03","bloom":3,"ctx":null,"stem":"If two different species of fish fossils were found in two different layers of sedimentary rock, what might one infer about the specimens?","opts":["They died at the same time","The two species are unrelated","The species in the higher layer evolved from the species in the lower layer","The species in lower layer died first","The species in the higher layer died first"],"ans":["D"],"why":"Sediment piles up over time, so <b>lower layers are older<\/b> (law of superposition).","wrong":{"A":"Different layers = different times.","B":"Layer position says nothing about relatedness.","C":"Being above doesn't prove ancestry.","E":"Reversed."},"note":""},{"ch":1,"n":58,"sec":"01.02","bloom":3,"ctx":null,"stem":"A dental student wants to test if fluoride is an effective additive against tooth decay. The student studies tooth decay in a population of people who live in neighborhoods supplied with fluoridated water. This student would like to ask whether access to fluoridated water prevents tooth decay. What would be an effective control group to ask this question?","opts":["Individuals with access to fluoridated water.","Individuals with access to differing amounts of fluoride in the water.","Individuals who have fluoride added to their toothpaste but not their water.","Individuals with access to water with no fluoride added."],"ans":["D"],"why":"The control must lack the independent variable (<b>fluoride<\/b>) but otherwise be similar.","wrong":{"A":"That's the experimental group.","B":"That's a dose–response study, not a no-fluoride control.","C":"Fluoride toothpaste is still fluoride exposure — it confounds the comparison."},"note":""},{"ch":1,"n":59,"sec":"01.04","bloom":1,"ctx":null,"stem":"Which statement represents the biological characteristics that kittens, oak trees, swans, earth worms, elephants and crickets have in common?","opts":["DNA nucleotides form the basis of all inherited life, with cells that are formed from other cells.","DNA nucleotides form the basis of inherited life, with cells that are formed spontaneously from the environment.","RNA nucleotides form the basis of all inherited life, with cells that are formed from other cells.","RNA nucleotides form the basis of inherited life, with cells that are formed spontaneously from the environment."],"ans":["A"],"why":"All cellular life uses <b>DNA<\/b> for heredity, and cells arise only from <b>preexisting cells<\/b>.","wrong":{"B":"Spontaneous generation is false.","C":"RNA is the hereditary molecule only in some viruses, not cellular life.","D":"Wrong on both counts."},"note":""},{"ch":1,"n":60,"sec":"01.01","bloom":2,"ctx":null,"stem":"Viruses contain DNA or RNA, but lack genes necessary for metabolism and reproduction. Why are viruses not considered to be alive?","opts":["Viruses are unable to reproduce independently of a host.","Viruses do not contain nucleic acids.","Viruses do not have the ability to evolve in their environment.","Viruses do not contain internal organelles."],"ans":["A"],"why":"Viruses can't metabolize or copy themselves; they must <b>hijack a host cell<\/b>.","wrong":{"B":"The stem says they contain DNA or RNA.","C":"Viruses evolve rapidly (flu, HIV, SARS-CoV-2 variants).","D":"Bacteria lack organelles and are alive — organelles aren't the criterion."},"note":""},{"ch":1,"n":61,"sec":"01.02","bloom":3,"ctx":"1:phil","stem":"Based on the experimental design, which variable was the control?","opts":["Seeds in the dark","Type of light","Germination rate","Temperature","Moisture"],"ans":["A"],"why":"The hypothesis is that light is needed. The <b>no-light (dark) group<\/b> is the baseline the lit groups are compared to.","wrong":{"B":"Light condition is the independent variable — what changes between groups.","C":"Germination rate is the dependent variable — what's measured.","D":"Temperature is held constant (a controlled variable), not the control group.","E":"Moisture is held constant (a controlled variable), not the control group."},"note":""},{"ch":1,"n":62,"sec":"01.02","bloom":3,"ctx":"1:phil","stem":"Based on the experimental design, which variable was the dependent variable?","opts":["Seeds in the dark","Type of light","Germination rate","Temperature","Moisture"],"ans":["C"],"why":"The dependent variable is what you <b>measure<\/b> — it \"depends\" on the treatment: <b>germination rate<\/b>.","wrong":{"A":"That's the control group.","B":"That's the independent variable (what Phil changes).","D":"Held constant.","E":"Held constant."},"note":""},{"ch":1,"n":63,"sec":"01.01","bloom":2,"ctx":null,"stem":"Osmometer cells in the brain sense an increase in the salt concentration of plasma. This information is sent to the hypothalamus, which notifies the pituitary gland to release the hormone, ADH. ADH causes the kidney to save water, which lowers the salt concentration of the plasma. What characteristic of life does this overall pathway represent?","opts":["Cellular organization","Sensitivity","Energy utilization","Evolutionary adaptation","Homeostasis"],"ans":["E"],"why":"Sensor (osmoreceptors) → control center (hypothalamus) → effector (ADH acting on kidney) → variable returns to set point. A negative-feedback loop = <b>homeostasis<\/b>. Clinically, lack of ADH (diabetes insipidus) causes large volumes of dilute urine.","wrong":{"A":"Organization is about structure, not a regulatory loop.","B":"Sensing salt is only the first step; the whole loop is homeostasis.","C":"Not the point of the pathway.","D":"Adaptation occurs over generations."},"note":""},{"ch":1,"n":64,"sec":"01.04","bloom":2,"ctx":null,"stem":"A chemical imbalance in the blood can cause the heart to stop pumping blood, which will have a detrimental effect on other organs. This observation can be attributed to:","opts":["Reductionism","Emergent properties","Equilibrium state","Evolutionary conservation"],"ans":["B"],"why":"Circulation is a property of the <b>whole interacting system<\/b>, not any single part. Disturb how parts interact and the system-level function fails — an emergent property.","wrong":{"A":"Reductionism studies parts in isolation; this observation is about interactions.","C":"Living systems are maintained <i>away<\/i> from equilibrium.","D":"Evolutionary conservation means traits shared across species."},"note":""},{"ch":1,"n":65,"sec":"01.02","bloom":3,"ctx":"1:luke","stem":"What type of reasoning did the pediatrician use to generate her prediction about Luke's future growth in height?","opts":["Inductive reasoning","Deductive reasoning","Applied theory","Reductionism"],"ans":["A"],"why":"She took Luke's <b>specific measurements<\/b> (data) and projected a general outcome for him → <b>inductive<\/b>.","wrong":{"B":"Deduction is applying the general chart to Luke (that's Q66).","C":"Not a reasoning type in the text.","D":"Nothing is being broken into parts."},"note":"The key splits hairs: predicting from Luke's data = inductive (Q65); using the chart = deductive (Q66)."},{"ch":1,"n":66,"sec":"01.02","bloom":3,"ctx":"1:luke","stem":"What type of logic is being used when the pediatrician uses the graph to make conclusions about Luke's progress?","opts":["Inductive reasoning","Applied theory","Reductionism","Deductive reasoning"],"ans":["D"],"why":"The growth chart is a <b>general standard<\/b> built from many children. Applying it to one child = general → specific = <b>deductive<\/b>.","wrong":{"A":"The inductive step was building the chart from population data (or predicting from Luke's data, Q65).","B":"Not a reasoning type in the text.","C":"Nothing is broken into parts."},"note":""},{"ch":1,"n":67,"sec":"01.02","bloom":3,"ctx":"1:turtle","stem":"Based on the experimental design, what is the dependent variable?","opts":["Number of hatchlings","Cloaca film on eggs","Eggs without cloaca film","Time eggs spent in ground"],"ans":["A"],"why":"What's measured to see the effect of the treatment → <b>number of hatchlings<\/b> (surviving predation).","wrong":{"B":"Film present = one level of the independent variable.","C":"Film removed = the other level of the independent variable.","D":"Should be kept the same for all nests (controlled variable)."},"note":""},{"ch":1,"n":68,"sec":"01.02","bloom":3,"ctx":"1:turtle","stem":"Based on the experimental design, what is the independent variable?","opts":["Number of hatchlings","No cloaca film on eggs","Inducing egg laying","Time eggs spent in ground"],"ans":["B"],"why":"The researcher <b>manipulated<\/b> whether the film was washed off → that's the independent variable.","wrong":{"A":"Measured outcome = dependent variable.","C":"Eggs were harvested, not induced.","D":"A controlled variable."},"note":""},{"ch":1,"n":69,"sec":"01.02","bloom":4,"ctx":"1:turtle","stem":"Based on the experimental design, what is the control?","opts":["Hatchling survival rate","Cloaca scent on eggs","No cloaca scent on eggs","Time eggs spent in ground"],"ans":["B"],"why":"Eggs left in their <b>natural, unaltered state<\/b> (film/scent on) are the control; washed eggs are the experimental group.","wrong":{"A":"That's the dependent variable.","C":"That's the experimental treatment.","D":"A controlled variable."},"note":""},{"ch":1,"n":70,"sec":"01.02","bloom":4,"ctx":null,"stem":"Dr. Edward Jenner realized that cows have a disease called cowpox, which is like a disease that infects humans called smallpox; Jenner noticed that milkmaids whose hands were infected with cowpox were not contracting smallpox. Jenner infected a child with the pus from a cowpox blister, and found that the child did not contract smallpox. Which statement represents a supporting hypothesis?","opts":["The cowpox infection will prevent the child from being infected by the smallpox virus.","The cowpox infection will have no effect on the child's immunity to the smallpox virus.","The smallpox virus was so similar to the cowpox virus that the child's immune system recognized it and was able to fight it.","The cowpox virus prevented the smallpox virus from entering the child's immune system."],"ans":["A"],"why":"A testable prediction that matches the milkmaid observation and was supported by the result: <b>cowpox exposure prevents smallpox<\/b>. This is the origin of vaccination (<i>vacca<\/i> = cow).","wrong":{"B":"That's the null hypothesis — contradicted by the result.","C":"A mechanistic explanation beyond what Jenner tested (and it's after-the-fact).","D":"Biologically wrong — viruses don't \"enter the immune system\"; immunity is acquired."},"note":""},{"ch":1,"n":71,"sec":"01.01","bloom":3,"ctx":null,"stem":"A beautiful wood desk you may do your homework on was once a living tree, but after being cut down its tissues died. Now, it only exhibits what property of life?","opts":["Metabolism","Homeostasis","Sensitivity","Organization"],"ans":["D"],"why":"Dead wood keeps its <b>cellular structure<\/b> (cell walls), but everything that needs ongoing energy use has stopped.","wrong":{"A":"Metabolism requires living, energy-using cells.","B":"Homeostasis requires active regulation.","C":"Responding to stimuli requires living cells."},"note":""},{"ch":2,"n":1,"sec":"02.01","bloom":1,"ctx":null,"stem":"Matter is composed of:","opts":["atoms","energy","mass","molecules"],"ans":["A"],"why":"Anything with mass that takes up space is built from <b>atoms<\/b> — the universal unit of matter.","wrong":{"B":"Energy is the capacity to do work; it isn't what matter is made of.","C":"Mass is a property of matter, not its building block.","D":"Many forms of matter (noble gases, metals) aren't molecules; atoms are the universal unit."},"note":""},{"ch":2,"n":2,"sec":"02.01","bloom":1,"ctx":null,"stem":"All atoms possess the ability to do work. The term that is defined as the ability to do work is:","opts":["matter","energy","molecules","space"],"ans":["B"],"why":"<b>Energy<\/b> = the capacity to do work (e.g., electrons at higher energy levels hold potential energy).","wrong":{"A":"Matter has mass and occupies space.","C":"Molecules are bonded atoms.","D":"Not a defined term here."},"note":""},{"ch":2,"n":3,"sec":"02.01","bloom":1,"ctx":null,"stem":"The number of protons in a given atom is equal to its:","opts":["atomic number","mass","neutron number","molecular number"],"ans":["A"],"why":"Proton count = <b>atomic number<\/b>; it defines the element.","wrong":{"B":"Mass number ≈ protons + neutrons.","C":"Neutron number = mass number − atomic number.","D":"Not a real term."},"note":""},{"ch":2,"n":4,"sec":"02.01","bloom":1,"ctx":null,"stem":"Isotopes that are unstable and decay when their nucleus breaks up into elements with lower atomic numbers, emitting significant amounts of energy in the process, are called:","opts":["energetic","ionic","radioactive","isometric"],"ans":["C"],"why":"Unstable nuclei that decay and emit radiation are <b>radioactive<\/b>. Lab use: ³²P and ³⁵S labeling (Hershey–Chase), ¹⁴C dating; clinically, PET scans use ¹⁸F.","wrong":{"A":"Not a technical term.","B":"Ionic refers to charge from gaining/losing electrons, not nuclear decay.","D":"Not a technical term."},"note":""},{"ch":2,"n":5,"sec":"02.02","bloom":1,"ctx":null,"stem":"Atoms containing a specific number of protons are called:","opts":["minerals","elements","metals","molecules"],"ans":["B"],"why":"Proton number defines identity → all atoms with that number are one <b>element<\/b>.","
