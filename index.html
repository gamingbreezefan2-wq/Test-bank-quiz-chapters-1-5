X to be","opts":["extracellular.","cytoplasmic.","in the lumen.","in the lipid bilayer of the plasma membrane."],"ans":["A"],"why":"Orientation is preserved: ER lumen = vesicle lumen. When the vesicle fuses with the plasma membrane, its inside faces <b>outward<\/b>.","wrong":{"B":"That would be the side facing the cytosol in the ER.","C":"\"Lumen\" applies to the ER/vesicle; at the surface it's extracellular.","D":"Hydrophilic ends aren't buried."},"note":""},{"ch":5,"n":46,"sec":"05.06","bloom":2,"ctx":null,"stem":"Incubation of cells at 20°C blocks the release of proteins from the <i>trans<\/i>-Golgi. Under such conditions, you would expect to see","opts":["an increase in exocytosis.","a decrease in exocytosis.","an increase in endocytosis.","a decrease in endocytosis."],"ans":["B"],"why":"No vesicles leaving the <i>trans<\/i>-Golgi → fewer vesicles fusing with the plasma membrane → <b>less exocytosis<\/b>.","wrong":{"A":"Opposite.","C":"Endocytosis is a separate inward pathway.","D":"Not directly affected by a <i>trans<\/i>-Golgi exit block."},"note":""},{"ch":5,"n":47,"sec":"05.04","bloom":3,"ctx":null,"stem":"While eating lobster for dinner one night your friend asks what you think might happen if this marine invertebrate, which is normally isosmotic with respect to the surrounding seawater, were to be moved to a bay with a slightly lower salt concentration instead of being caught. You reply that, in order for the lobster to be isosmotic with respect to new environment,","opts":["it must move water in to match the solute concentration of its new environment.","it regulates its internal concentration of solutes to match that of its new environment.","it must move water out to match the solute concentration of its new environment.","it moves water in or out and regulates its internal concentration of water as needed."],"ans":["B"],"why":"Marine invertebrates are osmoconformers: they <b>adjust internal solute levels<\/b> to match the water around them.","wrong":{"A":"Just taking in water would swell the animal.","C":"Lower-salt water would push water in, not out.","D":"They adjust solutes, not \"internal water concentration.\""},"note":""},{"ch":5,"n":48,"sec":"05.04","bloom":3,"ctx":null,"stem":"If a cell has a normal osmotic pressure of 4500 mmHg and is placed into a solution with an osmotic pressure of 3500 mmHg, what will happen to the cell?","opts":["The cell will lose water and its osmotic pressure will decrease.","The cell will gain water and its osmotic pressure will decrease.","The cell will gain water and its osmotic pressure will increase.","The cell will lose water and its osmotic pressure will increase."],"ans":["B"],"why":"Water moves toward higher osmotic pressure (inside, 4500) → cell <b>gains water<\/b>, diluting its contents → its osmotic pressure <b>falls<\/b>.","wrong":{"A":"Wrong direction of water flow.","C":"Adding water dilutes, lowering osmotic pressure.","D":"Wrong on both counts."},"note":""},{"ch":5,"n":49,"sec":"05.05","bloom":3,"ctx":null,"stem":"In individuals with normal blood sugar levels, glucose is reabsorbed into the bloodstream in the kidney by members of the GLUT transporter family, which form an aqueous pore across the membrane through which glucose can move passively. As a result, no glucose is excreted in urine. However, in people with untreated diabetes mellitus, blood sugar levels are high and glucose is often present in the urine. What can explain this occurrence?","opts":["High blood glucose levels reverse the concentration gradient, allowing untransported glucose to be excreted in urine.","High blood glucose levels interfere with the coupled transport of water and glucose, allowing untransported glucose to be excreted in urine.","The GLUT transporters become saturated, allowing untransported glucose to be excreted in urine.","The GLUT transporters cannot hydrolyze ATP quickly enough for ATP to transport the extra glucose, thereby allowing untransported glucose to be excreted in urine."],"ans":["C"],"why":"There are only so many carriers. When filtered glucose exceeds their capacity (~180 mg/dL, the renal threshold), all are occupied — <b>saturated<\/b> — and the excess spills into urine (glycosuria).","wrong":{"A":"The gradient isn't reversed.","B":"GLUT doesn't co-transport water.","D":"GLUT is passive; it doesn't use ATP."},"note":""},{"ch":5,"n":50,"sec":"05.06","bloom":3,"ctx":null,"stem":"Receptor-mediated endocytosis brings in specific material by engulfing it in vesicles. What factors, either directly or indirectly, are related to this process? Choose all that apply.","opts":["It is a passive process.","It helps to increase membrane fluidity by helping to transport cholesterol into the cell.","It is an active process.","It uses carrier proteins.","A clathrin coat is present."],"ans":["B","C","E"],"why":"Ligands (e.g., cholesterol-carrying LDL) bind receptors clustered in <b>clathrin-coated pits<\/b>, which pinch off into vesicles — an <b>energy-requiring<\/b> process. Defective LDL receptors cause familial hypercholesterolemia.","wrong":{"A":"Vesicle formation requires energy.","D":"Uses receptors, not carriers that shuttle solutes across the bilayer."},"note":""},{"ch":5,"n":51,"sec":"05.03","bloom":4,"ctx":null,"stem":"Which mutations can interfere with the proper insertion of a protein in the plasma membrane?","opts":["A polar amino acid to a nonpolar amino acid within a transmembrane domain","A nonpolar amino acid to a polar amino acid within a transmembrane domain","A polar amino acid to a nonpolar amino acid within a cytoplasmic domain","A nonpolar amino acid to a polar amino acid within a cytoplasmic domain"],"ans":["B"],"why":"A transmembrane segment must be hydrophobic. <b>Adding a polar residue there<\/b> destabilizes it in the lipid core.","wrong":{"A":"Makes the segment <i>more<\/i> hydrophobic — fine for insertion.","C":"Cytoplasmic changes don't affect insertion.","D":"Same as C."},"note":""},{"ch":5,"n":52,"sec":"05.05","bloom":2,"ctx":null,"stem":"During neuronal signaling, a change in membrane potential will cause sodium channels to open and let Na<sup>+<\/sup> ions diffuse down their concentration gradient into the cell. Which of the following helps establish the concentration gradient necessary for this process to occur?","opts":["Na<sup>+<\/sup>/K<sup>+<\/sup> channel","voltage-gated Na<sup>+<\/sup> channel","Na<sup>+<\/sup> symporter","Na<sup>+<\/sup>/K<sup>+<\/sup> pump"],"ans":["D"],"why":"The <b>Na⁺/K⁺ pump<\/b> keeps Na⁺ high outside and low inside; channels then let it rush in.","wrong":{"A":"Channels dissipate gradients; they don't build them.","B":"Uses the gradient; doesn't create it.","C":"Uses the gradient; doesn't create it."},"note":""},{"ch":5,"n":53,"sec":"05.02","bloom":3,"ctx":null,"stem":"If you were to replace the phosphate group of a phospholipid with a fatty acid chain, you would have","opts":["glycerol.","a triglyceride.","cholesterol.","glycolipid."],"ans":["B"],"why":"Glycerol + 2 fatty acids + 1 more fatty acid = <b>triglyceride<\/b>.","wrong":{"A":"Just the backbone.","C":"A steroid (four rings).","D":"Has a sugar in place of the phosphate head."},"note":""},{"ch":5,"n":54,"sec":"05.06","bloom":2,"ctx":null,"stem":"If you were a very thirsty cell, which process would you use to take in some nutrients secreted by one of your neighbors?","opts":["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis","Exocytosis"],"ans":["B"],"why":"\"Cell drinking\": nonspecific uptake of fluid and its dissolved solutes = <b>pinocytosis<\/b>.","wrong":{"A":"For large particles/cells.","C":"For specific receptor-bound ligands.","D":"Export."},"note":""},{"ch":5,"n":55,"sec":"05.01","bloom":2,"ctx":null,"stem":"How can freeze-fracture be used to determine the orientation of a protein in a membrane?","opts":["Freeze-fracture allows a cell to be cleaved in between the lipid bilayer, splitting the plasma membrane into two layers.","Freeze-fracture allows a cell to be cleaved in such a way as to preserve the embedded proteins.","Freeze-fracture cuts the membrane in protein-sized components for viewing under an electron microscope."],"ans":["A"],"why":"The frozen membrane splits along its <b>hydrophobic core<\/b> into two leaflets. Proteins appear as bumps on one face and pits on the other — showing they span the bilayer (key evidence for the fluid mosaic model).","wrong":{"B":"Proteins are preserved, but the key is splitting between the leaflets.","C":"It doesn't chop the membrane into protein-sized pieces."},"note":""},{"ch":5,"n":56,"sec":"05.03","bloom":3,"ctx":null,"stem":"Diapedesis is the movement of white blood cells through intact blood vessel walls into surrounding body tissue. It typically happens when an area of the body is injured or damaged, and an inflammation response is required. What role would you expect cell adhesion molecules to play in this process?","opts":["Cell adhesion molecules will allow the white blood cells to cling to one another to form a migrating clot.","Cell adhesion molecules help white blood cells adhere to the blood vessel wall so that they can migrate across the wall and infiltrate into the underlying tissue.","Cell adhesion molecules will allow the white blood cells to attach to the injured area so they become immobile."],"ans":["B"],"why":"WBCs roll (selectins), stick firmly (integrins binding ICAMs) to the vessel lining, then <b>squeeze across<\/b> into tissue. Defective integrins cause leukocyte adhesion deficiency (recurrent infections without pus).","wrong":{"A":"Clotting involves platelets and fibrin, not WBCs clumping.","C":"Adhesion is transient; WBCs must keep moving."},"note":""},{"ch":5,"n":57,"sec":"05.04","bloom":4,"ctx":null,"stem":"Membrane potential will affect the directional movement of","opts":["Glucose (C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>)","Cholesterol","Potassium (K<sup>+<\/sup>)","Oxygen (O<sub>2<\/sub>)"],"ans":["C"],"why":"A membrane potential is a voltage — it pushes only on <b>charged<\/b> particles. K⁺ is the only ion listed.","wrong":{"A":"Uncharged.","B":"Uncharged.","D":"Uncharged."},"note":""},{"ch":5,"n":58,"sec":"05.04","bloom":3,"ctx":null,"stem":"Choose all that apply. A concentration gradient is exhibited when","opts":["the room temperature is 34 degree Celsius and the outside air is 34 degrees Celsius.","intracellular fluid has 5% solute and extracellular fluid has 0.8% solute concentration.","during rest, muscle and liver cells contain high glycogen concentration and blood contains lower concentrations.","the <i>p<\/i>CO<sub>2<\/sub> changes from 45 to 35 mmHg in the alveoli of lungs."],"ans":["B","C","D"],"why":"A gradient is any <b>difference in concentration<\/b> between two regions — measured as %, amount, or partial pressure for gases.","wrong":{"A":"Temperature isn't concentration, and the values are equal anyway."},"note":""},{"ch":5,"n":59,"sec":"05.04","bloom":3,"ctx":null,"stem":"The rate of diffusion of molecules would be fastest in a cell with an","opts":["internal concentration of 45 percent and an external concentration of 50 percent in cold temperatures.","internal concentration of 50 percent and an external concentration of 12 percent in cold temperatures.","internal concentration of 50 percent and an external concentration of 12 percent in warm temperatures.","internal concentration of 40 percent and an external concentration of 35 percent in warm temperatures."],"ans":["C"],"why":"Biggest gradient (38 points) + <b>warm<\/b> (faster molecular motion) = fastest diffusion.","wrong":{"A":"Small gradient and cold.","B":"Big gradient, but cold slows molecules.","D":"Warm, but small gradient."},"note":""},{"ch":5,"n":60,"sec":"05.04","bloom":2,"ctx":null,"stem":"When the solute concentration of solution A is lower than the solute concentration of solution B, solution A is considered","opts":["hypertonic.","hypotonic.","isotonic."],"ans":["B"],"why":"Lower solute = <b>hypotonic<\/b>.","wrong":{"A":"Higher.","C":"Equal."},"note":""},{"ch":5,"n":61,"sec":"05.05","bloom":3,"ctx":null,"stem":"If ATP production is blocked, decreased transport of material across a membrane occurs. Which type of transport is affected? Choose all that apply.","opts":["Osmosis","Diffusion","Facilitated Diffusion","Active Transport","Endocytosis"],"ans":["D","E"],"why":"<b>Pumps<\/b> hydrolyze ATP, and <b>vesicle formation<\/b> needs energy for membrane remodeling.","wrong":{"A":"Passive — driven by the water gradient.","B":"Passive.","C":"Passive — carriers just provide a path."},"note":""},{"ch":5,"n":62,"sec":"05.05","bloom":5,"ctx":null,"stem":"Tetrodotoxin is a potent poison, produced by some newts, pufferfish, and blue-ringed octopus that affects sodium transport involved with the voltage gates in neurons. A friend swimming in the Caribbean is pricked by a pufferfish and gets very sick. The most likely action the poison takes is","opts":["Mimicking a symporter and allowing sodium to rush out and potassium to rush in.","Mimicking an antiporter and allowing sodium to rush out.","Blocking an antiporter so sodium cannot rush in.","Blocking a symporter and keeping sodium from rushing in."],"ans":["C"],"why":"TTX <b>prevents Na⁺ from rushing in<\/b> → no action potential → paralysis (including breathing muscles).","wrong":{"A":"Mimicking a transporter would promote ion flow, not block it; Na⁺ rushes in during an action potential, not out.","B":"Same problem as A.","D":"A symporter moves two solutes in the same direction; the Na⁺ rush of an action potential doesn't pass through a symporter."},"note":"In reality TTX blocks voltage-gated Na⁺ <i>channels<\/i>, not an antiporter. C is the key's answer because it's the only option where Na⁺ entry is blocked."},{"ch":5,"n":63,"sec":"05.04","bloom":3,"ctx":null,"stem":"An individual is constipated. They take magnesium salts to help loosen the stool. Why does this work?","opts":["Water moves from the intestines to the blood because the blood is hypertonic","Water moves from the intestines to the blood because the blood is hypotonic.","Water moves from the blood to the intestines because the blood is hypertonic","Water moves from the blood to the intestines because the blood is hypotonic."],"ans":["D"],"why":"Poorly absorbed Mg²⁺ salts make gut contents hypertonic, so blood is relatively <b>hypotonic<\/b> → water moves <b>into the intestine<\/b>, softening stool (osmotic laxative).","wrong":{"A":"Water into blood would harden stool.","B":"Water goes toward the hypertonic side, not the hypotonic one.","C":"If blood were hypertonic, water would move into it."},"note":""},{"ch":5,"n":64,"sec":"05.02","bloom":2,"ctx":null,"stem":"Cholesterol is a structural component of cell membranes. Amount of cholesterol present can affect membrane stability and permeability. What is the role of cholesterol in a membrane?","opts":["A membrane that needs to be more rigid and more permeable, would have high cholesterol ratios.","A membrane that needs to be rigid, such as a protective barrier, would have low cholesterol ratios.","Membranes with low amounts of cholesterol are very stable and have increased permeability.","Membranes with high amounts of cholesterol are very stable and have decreased permeability."],"ans":["D"],"why":"More cholesterol fills gaps between phospholipids → <b>more stable, less permeable<\/b>.","wrong":{"A":"High cholesterol <i>decreases<\/i> permeability.","B":"Rigid barriers have <i>high<\/i> cholesterol.","C":"Low cholesterol → less stable."},"note":""},{"ch":5,"n":65,"sec":"05.04","bloom":3,"ctx":null,"stem":"A dehydrated runner drinks a lot of water after a race. He or she rehydrates because","opts":["the contents of the digestive tract are hypotonic compared to the bloodstream.","the bloodstream is hypotonic compared to the contents of the digestive tract.","the contents of the digestive tract and the bloodstream are isotonic compared to each other.","water will diffuse from an area where its concentration is low to an area where its concentration is high."],"ans":["A"],"why":"Dehydration concentrates the blood (hypertonic). Plain water makes gut contents <b>hypotonic<\/b> → water moves into the blood.","wrong":{"B":"Reversed — the blood is hypertonic.","C":"No net movement would occur.","D":"Reversed — water moves from where <i>water<\/i> is more concentrated to where it's less."},"note":""},{"ch":5,"n":66,"sec":"05.04","bloom":4,"ctx":null,"stem":"To test for the presence of starch, iodine can be used. A positive reaction results in a black color. A dialysis bag filled with starch solution and secured on both ends is placed in iodine solution. After 30 minutes the dialysis bag appears black. Based on this information, what most accurately describes what happened?","opts":["Due to its size and polarity, starch was able to exit the dialysis bag and interact with the iodine solution.","Due to its size and polarity, iodine was able to enter the dialysis bag and interact with starch.","Over time, both iodine and starch are equally distributed throughout the two solutions."],"ans":["B"],"why":"Dialysis tubing passes small molecules only. <b>Small iodine<\/b> entered; huge starch stayed inside → color formed inside the bag. Hemodialysis works on the same size principle (urea out, proteins and cells stay).","wrong":{"A":"Starch is far too large to cross.","C":"Starch can't leave the bag."},"note":""},{"ch":5,"n":67,"sec":"05.04","bloom":3,"ctx":null,"stem":"A mixed solution of water and small molecules is exposed to a cell membrane and allowed to interact for an hour. Which molecule would be most likely to cross the phospholipid bilayer without the aid of transport proteins and diffuse across the membrane the fastest?","opts":["Estrogen (C<sub>18<\/sub>H<sub>24<\/sub>O<sub>2<\/sub>)","NH<sub>4<\/sub><sup>+<\/sup>","O<sub>2<\/sub>","CH<sub>3<\/sub>COO<sup>−<\/sup>","Na<sup>+<\/sup>"],"ans":["C"],"why":"Small + nonpolar = fastest. <b>O₂<\/b> slips straight through.","wrong":{"A":"Nonpolar steroid can cross, but it's much larger, so slower.","B":"Charged — needs a protein.","D":"Charged — needs a protein.","E":"Charged — needs a protein."},"note":""},{"ch":5,"n":68,"sec":"05.04","bloom":3,"ctx":"5:eggs","stem":"The solution in the container is hypertonic to which egg?","opts":["Egg 1","Egg 2","Egg 3"],"ans":["C"],"why":"A hypertonic solution pulls water out → the egg that <b>lost weight<\/b> (Egg 3).","wrong":{"A":"Gained water → the solution was hypotonic to it.","B":"No change → isotonic."},"note":""},{"ch":5,"n":69,"sec":"05.04","bloom":3,"ctx":"5:eggs","stem":"Which egg is isotonic to the solution?","opts":["Egg 1","Egg 2","Egg 3"],"ans":["B"],"why":"No net water movement → <b>no weight change<\/b> → Egg 2.","wrong":{"A":"Gained water.","C":"Lost water."},"note":""},{"ch":5,"n":70,"sec":"05.04","bloom":3,"ctx":"5:eggs","stem":"When compared to the solution, the egg that gained weight was ________.","opts":["Hypertonic","Hypotonic","Isotonic"],"ans":["A"],"why":"Water moves toward higher solute. Egg 1 gained water, so its contents were more concentrated → the egg was <b>hypertonic<\/b> to the solution.","wrong":{"B":"A hypotonic egg would lose water.","C":"An isotonic egg wouldn't change."},"note":""},{"ch":5,"n":71,"sec":"05.04","bloom":4,"ctx":"5:carrier","stem":"Carrier proteins are saturated at which point?","opts":["1","2","3","4"],"ans":["D"],"why":"Saturation = <b>all carriers occupied<\/b> → the rate plateaus (Vmax); adding more glucose no longer speeds transport. That's the highest-concentration point. Simple diffusion, by contrast, keeps rising linearly.","wrong":{"A":"Low concentration — many free carriers, rate still rising.","B":"Rate still rising.","C":"Rate still rising."},"note":""},{"ch":5,"n":72,"sec":"05.04","bloom":3,"ctx":"5:carrier","stem":"The rate of diffusion will increase as","opts":["the number of glucose molecules decreases.","the number of glucose molecules increases.","temperature decreases.","pH rises."],"ans":["B"],"why":"More glucose outside → steeper gradient → <b>faster<\/b> diffusion (until carriers saturate).","wrong":{"A":"Smaller gradient → slower.","C":"Colder molecules move slower.","D":"Glucose is uncharged; pH isn't a main factor."},"note":""},{"ch":5,"n":73,"sec":"05.05","bloom":3,"ctx":null,"stem":"If Na<sup>+<\/sup> levels were depleted in the extracellular fluid, rate of glucose movement would","opts":["increase.","decrease.","stay the same."],"ans":["B"],"why":"The Na⁺–glucose symporter is powered by Na⁺ flowing in down its gradient. Less outside Na⁺ → weaker driving force → <b>less glucose uptake<\/b>.","wrong":{"A":"Opposite.","C":"Glucose transport is coupled to Na⁺."},"note":""},{"ch":5,"n":74,"sec":"05.05","bloom":4,"ctx":null,"stem":"A symporter is moving glucose and sodium levels are being depleted in extracellular fluids. What can be concluded about the movement of glucose? Choose all that apply.","opts":["Glucose would be moving against its gradient into the cell","Glucose follows the gradient of sodium into the cell","Glucose would be moving with its gradient into the cell","ATP is not required to move sodium down its concentration gradient","Energy is needed to move glucose down its concentration gradient","Glucose's movement would still be considered diffusion","Glucose's movement is considered a part of coupled transport"],"ans":["A","B","D","E","G"],"why":"Secondary active transport: Na⁺ flows <b>down<\/b> its gradient (no ATP used directly) and drags glucose <b>against<\/b> its gradient into the cell → coupled transport.","wrong":{"C":"In a Na⁺ symporter, glucose moves against its gradient.","F":"Moving against a gradient isn't diffusion."},"note":"Option E literally says \"down\" its gradient, which contradicts A — almost certainly a testbank typo for \"against.\" The key counts E as correct."},{"ch":5,"n":75,"sec":"05.04","bloom":3,"ctx":null,"stem":"A novice gardener notices that many plants in his garden look wilted. What osmotic solution would you suggest the novice gardener use to best return the plants to full health?","opts":["Place the plants in a 15% solute solution so water can be actively transported out of the plant cells.","Place the plants in a 5% solute solution so water can be actively transported out of the plant cells.","Place the plants in a 5% solute solution so water can diffuse into the plant cells.","Place the plants in a 15% solute solution so water can diffuse out of the plant cells."],"ans":["C"],"why":"Wilted cells need water back. A dilute (hypotonic) solution lets water <b>diffuse in<\/b> by osmosis, restoring turgor.","wrong":{"A":"Water isn't actively transported, and the plant needs water in, not out.","B":"Same errors as A.","D":"A hypertonic solution would worsen wilting."},"note":""},{"ch":5,"n":76,"sec":"05.04","bloom":4,"ctx":null,"stem":"Insulin stimulates an increase in number of glucose carrier proteins at a cell membrane's surface. What effect will insulin have on cell function? Choose all that apply.","opts":["An increase in insulin, which will increase the diffusion rate.","ATP amounts needed for this transport will increase.","Low insulin levels will decrease the number of available carrier proteins.","Lack of membrane receptors for insulin will decrease amount of glucose taken in."],"ans":["A","C","D"],"why":"Insulin binds its receptor → GLUT4 vesicles fuse with the membrane → <b>more carriers<\/b> → faster facilitated diffusion of glucose. Low insulin (type 1 diabetes) or receptor/signaling failure (type 2 insulin resistance) → less uptake → high blood sugar.","wrong":{"B":"GLUT transport is passive; no extra ATP is used to move the glucose."},"note":""},{"ch":5,"n":77,"sec":"05.06","bloom":2,"ctx":null,"stem":"Matt is studying how the protein transferrin enters cells. He examines cells that have taken up transferrin, and finds clathrin-coated vesicles. What mechanism was used to take transferrin into the cell?","opts":["Phagocytosis","Pinocytosis","Exocytosis","Receptor-mediated endocytosis"],"ans":["D"],"why":"Clathrin-coated vesicles are the hallmark of <b>receptor-mediated endocytosis<\/b>; transferrin (an iron carrier) binds its specific receptor.","wrong":{"A":"For large particles; not clathrin-dependent.","B":"Nonspecific fluid uptake.","C":"Export, not import."},"note":""}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const Q = DATA.questions;
  const BY = {};
  Q.forEach(q => { q.id = q.ch + "-" + q.n; BY[q.id] = q; });
  const LET = "ABCDEFG";
  const KEY = "bio201-tb-ch1-5-v1";

  // ---------- state ----------
  const defaults = { ans: {}, flag: {}, chapters: [1, 2, 3, 4, 5], filter: "all", hard: false, shuffle: false, seed: 1, cur: null, retake: [] };
  let S = Object.assign({}, defaults);
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign({}, defaults, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  let view = [];         // ids in the current set (snapshot; recomputed only when scope changes)
  let pending = {};      // multi-select picks not yet checked: id -> [letters]
  let confirming = null; // which inline confirmation is open

  function status(id) { const a = S.ans[id]; return a ? (a.ok ? "ok" : "bad") : "todo"; }
  function hash(s, seed) { let h = 2166136261 ^ seed; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function computeView() {
    let ids;
    if (S.filter === "retake") ids = S.retake.filter(id => BY[id]);
    else ids = Q.filter(q => S.chapters.includes(q.ch)).map(q => q.id);
    if (S.hard) ids = ids.filter(id => BY[id].bloom >= 3);
    if (S.filter === "todo") ids = ids.filter(id => status(id) === "todo");
    if (S.filter === "missed") ids = ids.filter(id => status(id) === "bad");
    if (S.filter === "flagged") ids = ids.filter(id => S.flag[id]);
    if (S.shuffle) ids = ids.slice().sort((a, b) => hash(a, S.seed) - hash(b, S.seed));
    view = ids;
    if (!view.includes(S.cur)) S.cur = view[0] || null;
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  function el(tag, attrs, html) { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; }
  const ICON_OK = '<svg class="ic ok" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>';
  const ICON_BAD = '<svg class="ic bad" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>';
  const ICON_FLAG = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 1h1v10H2zM3.5 1.5h6l-1.5 2.5 1.5 2.5h-6z"/></svg>';
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";

  // ---------- top meter ----------
  function renderMeter() {
    const ids = Object.keys(S.ans).filter(id => BY[id]);
    const ok = ids.filter(id => S.ans[id].ok).length, bad = ids.length - ok;
    const bar = $("mbar").children;
    bar[0].style.width = (100 * ok / Q.length) + "%";
    bar[1].style.width = (100 * bad / Q.length) + "%";
    $("mnum").innerHTML = "<b>" + ids.length + "</b> / " + Q.length + " answered · <b>" + pct(ok, ids.length) + "</b> correct";
  }

  // ---------- panel ----------
  function renderPanel() {
    const chips = $("chips"); chips.innerHTML = "";
    [1, 2, 3, 4, 5].forEach(ch => {
      const n = Q.filter(q => q.ch === ch).length;
      const b = el("button", { class: "chip", "aria-pressed": String(S.chapters.includes(ch)), title: DATA.chapters[ch] }, "Ch " + ch + ' <span class="c">' + n + "</span>");
      b.onclick = () => {
        if (S.filter === "retake") S.filter = "all";
        if (S.chapters.includes(ch)) { if (S.chapters.length > 1) S.chapters = S.chapters.filter(c => c !== ch); }
        else S.chapters = S.chapters.concat(ch).sort();
        refresh(true);
      };
      chips.appendChild(b);
    });

    const scope = Q.filter(q => S.chapters.includes(q.ch) && (!S.hard || q.bloom >= 3));
    const counts = {
      all: scope.length,
      todo: scope.filter(q => status(q.id) === "todo").length,
      missed: scope.filter(q => status(q.id) === "bad").length,
      flagged: scope.filter(q => S.flag[q.id]).length,
    };
    const f = $("filters"); f.innerHTML = "";
    const opts = [["all", "All"], ["todo", "Unanswered"], ["missed", "Missed"], ["flagged", "Flagged"]];
    if (S.retake.length) opts.push(["retake", "Retake set"]);
    f.style.gridTemplateColumns = opts.length > 4 ? "repeat(2,1fr)" : "";
    opts.forEach(([k, label]) => {
      const c = k === "retake" ? S.retake.length : counts[k];
      const b = el("button", { "aria-pressed": String(S.filter === k) }, label + ' <span class="c">' + c + "</span>");
      b.onclick = () => { S.filter = k; refresh(true); };
      f.appendChild(b);
    });
    $("hard").checked = S.hard;
    $("shuffle").checked = S.shuffle;

    // score table
    const t = $("score"); t.innerHTML = "";
    [1, 2, 3, 4, 5].forEach(ch => {
      const qs = Q.filter(q => q.ch === ch);
      const done = qs.filter(q => S.ans[q.id]).length, ok = qs.filter(q => S.ans[q.id] && S.ans[q.id].ok).length;
      const tr = el("tr");
      tr.innerHTML = '<td title="' + DATA.chapters[ch] + '">Ch ' + ch + " · " + SHORT[ch] + '</td><td class="r">' + done + "/" + qs.length + '</td><td class="r"><span class="pct">' + pct(ok, done) + "</span></td>";
      t.appendChild(tr);
    });

    renderMap();

    // actions
    const a = $("actions"); a.innerHTML = "";
    const missedAll = Q.filter(q => status(q.id) === "bad").map(q => q.id);
    const answered = Object.keys(S.ans).length;
    if (confirming === "reset") {
      const c = el("div", { class: "confirm" }, "<div>Clear all " + answered + " answers and flags? This can’t be undone.</div>");
      const row = el("div", { class: "row" });
      const yes = el("button", { class: "btn danger" }, "Clear progress");
      const no = el("button", { class: "btn" }, "Cancel");
      yes.onclick = () => { S.ans = {}; S.flag = {}; S.retake = []; S.filter = "all"; pending = {}; confirming = null; refresh(true); };
      no.onclick = () => { confirming = null; renderPanel(); };
      row.append(yes, no); c.appendChild(row); a.appendChild(c);
    } else {
      const r = el("button", { class: "btn primary" }, "Retake missed (" + missedAll.length + ")");
      r.disabled = !missedAll.length;
      r.onclick = () => {
        S.retake = missedAll.slice();
        missedAll.forEach(id => delete S.ans[id]);
        S.filter = "retake"; S.cur = null; refresh(true);
      };
      const x = el("button", { class: "btn danger" }, "Reset all progress");
      x.disabled = !answered && !Object.keys(S.flag).length;
      x.onclick = () => { confirming = "reset"; renderPanel(); };
      a.append(r, x);
    }
  }
  const SHORT = { 1: "Science of Biology", 2: "Molecules &amp; Water", 3: "Building Blocks", 4: "Cell Structure", 5: "Membranes" };

  function renderMap() {
    const m = $("map"); m.innerHTML = "";
    if (!view.length) { m.appendChild(el("div", { class: "keys" }, "No questions in this set.")); return; }
    const mk = (id, label) => {
      const q = BY[id], st = status(id);
      const b = el("button", { class: "cell" + (st === "ok" ? " ok" : st === "bad" ? " bad" : "") + (S.flag[id] ? " flag" : "") + (id === S.cur ? " cur" : ""), title: "Ch " + q.ch + " · Q" + q.n + (st === "ok" ? " · correct" : st === "bad" ? " · missed" : ""), "aria-label": "Chapter " + q.ch + " question " + q.n }, label);
      b.onclick = () => go(id);
      return b;
    };
    if (S.shuffle) {
      const g = el("div", { class: "cells" });
      view.forEach((id, i) => g.appendChild(mk(id, i + 1)));
      m.appendChild(g);
    } else {
      [1, 2, 3, 4, 5].forEach(ch => {
        const ids = view.filter(id => BY[id].ch === ch);
        if (!ids.length) return;
        m.appendChild(el("h4", null, "Chapter " + ch));
        const g = el("div", { class: "cells" });
        ids.forEach(id => g.appendChild(mk(id, BY[id].n)));
        m.appendChild(g);
      });
    }
  }

  // ---------- card ----------
  function renderCard() {
    const card = $("card"); card.innerHTML = "";
    if (!S.cur) {
      const msg = S.filter === "missed" ? "<b>No missed questions here</b>Nothing you’ve answered in this scope is wrong. Switch to All or Unanswered to keep going."
        : S.filter === "flagged" ? "<b>No flagged questions</b>Use the Flag button on any question to save it for review."
        : S.filter === "todo" ? "<b>Everything here is answered</b>Switch to Missed to review mistakes, or use Retake missed."
        : "<b>No questions match</b>Turn on at least one chapter or switch off the Bloom filter.";
      card.appendChild(el("div", { class: "empty" }, msg));
      renderNavOnly(card);
      return;
    }
    const q = BY[S.cur], a = S.ans[q.id], multi = q.ans.length > 1;
    const sec = DATA.sections[q.sec] || "";

    const head = el("div", { class: "qhead" });
    head.innerHTML = '<span class="tag">Ch ' + q.ch + " · Q" + q.n + '</span><span class="sec">' + q.sec + "</span><span>" + sec + '</span><span class="spacer"></span><span class="bloom">Bloom’s: <b>' + DATA.bloom[q.bloom] + "</b></span>";
    const fl = el("button", { class: "flagbtn", "aria-pressed": String(!!S.flag[q.id]) }, ICON_FLAG + (S.flag[q.id] ? "Flagged" : "Flag"));
    fl.onclick = toggleFlag;
    head.appendChild(fl);
    card.appendChild(head);

    if (q.ctx && DATA.contexts[q.ctx]) {
      card.appendChild(el("div", { class: "ctx" }, '<span class="k">Use this for the question</span>' + DATA.contexts[q.ctx]));
    }
    card.appendChild(el("p", { class: "stem" }, q.stem));
    if (multi) card.appendChild(el("div", { class: "hint" }, "Select all that apply"));

    const picks = a ? a.p : (pending[q.id] || []);
    const list = el("div", { class: "opts", role: multi ? "group" : "radiogroup", "aria-label": "Answer choices" });
    q.opts.forEach((t, i) => {
      const L = LET[i];
      const b = el("button", { class: "opt" + (multi ? " multi" : ""), role: multi ? "checkbox" : "radio", "aria-checked": String(picks.includes(L)) });
      let icon = "";
      if (a) {
        b.disabled = true;
        const isAns = q.ans.includes(L), picked = a.p.includes(L);
        if (isAns && picked) { b.classList.add("is-ok"); icon = ICON_OK; }
        else if (isAns && !picked) { b.classList.add(multi ? "is-missed" : "is-ok"); icon = ICON_OK; }
        else if (!isAns && picked) { b.classList.add("is-bad"); icon = ICON_BAD; }
        else b.classList.add("is-dim");
        b.setAttribute("aria-checked", String(picked));
      }
      b.innerHTML = '<span class="L">' + L + "</span><span>" + t + "</span>" + (icon || "<span></span>");
      if (!a) b.onclick = () => choose(L);
      list.appendChild(b);
    });
    card.appendChild(list);

    if (multi && !a) {
      const row = el("div", { class: "checkrow" });
      const c = el("button", { class: "btn primary" }, "Check answer");
      c.disabled = !picks.length;
      c.onclick = checkMulti;
      row.append(c, el("span", { class: "muted" }, picks.length ? picks.length + " selected" : "Pick every correct statement, then check."));
      card.appendChild(row);
    }

    if (a) card.appendChild(feedback(q, a));
    renderNavOnly(card);
  }

  function feedback(q, a) {
    const multi = q.ans.length > 1;
    const fb = el("div", { class: "fb" });
    const v = el("div", { class: "verdict" });
    const ansTxt = (multi ? "Answers: " : "Answer: ") + q.ans.join(", ");
    v.innerHTML = a.ok ? '<span class="pill ok">' + ICON_OK.replace('class="ic ok"', 'width="14" height="14"') + "Correct</span>"
      : '<span class="pill bad">' + ICON_BAD.replace('class="ic bad"', 'width="14" height="14"') + "Not quite</span>";
    v.appendChild(el("span", { class: "ans" }, ansTxt + (a.ok ? "" : " · you chose " + (a.p.join(", ") || "none"))));
    const rt = el("button", { class: "retry" }, "Try again");
    rt.onclick = () => { delete S.ans[q.id]; delete pending[q.id]; refresh(false); };
    v.appendChild(rt);
    fb.appendChild(v);

    const why = el("div", { class: "why" });
    why.appendChild(el("h3", null, "Why " + q.ans.join(", ") + (q.ans.length > 1 ? " are" : " is") + " correct"));
    why.appendChild(el("p", null, q.why));
    fb.appendChild(why);

    const wrong = Object.keys(q.wrong).sort();
    if (wrong.length) {
      const o = el("div", { class: "others" });
      o.appendChild(el("h3", null, "Why the other options are wrong"));
      const ul = el("ul");
      wrong.forEach(L => {
        const picked = a.p.includes(L);
        const li = el("li", { class: picked ? "picked" : "" });
        li.innerHTML = '<span class="L">' + L + '</span><div><div class="ot">' + q.opts[LET.indexOf(L)] + (picked ? '<span class="yr">your pick</span>' : "") + '</div><div class="rs">' + q.wrong[L] + "</div></div>";
        ul.appendChild(li);
      });
      o.appendChild(ul);
      fb.appendChild(o);
    }
    if (q.note) fb.appendChild(el("div", { class: "note" }, '<b class="k">Note</b><div>' + q.note + "</div>"));
    return fb;
  }

  function renderNavOnly(card) {
    const i = view.indexOf(S.cur);
    const nav = el("div", { class: "nav" });
    const inSet = view.filter(id => S.ans[id]), okSet = inSet.filter(id => S.ans[id].ok);
    nav.appendChild(el("span", { class: "pos" }, view.length ? (i + 1) + " of " + view.length + " in this set · " + okSet.length + "/" + inSet.length + " correct so far" : ""));
    const p = el("button", { class: "btn" }, "← Previous");
    p.disabled = i <= 0; p.onclick = () => step(-1);
    const n = el("button", { class: "btn primary" }, i >= view.length - 1 && view.length ? "Last question" : "Next →");
    n.disabled = i < 0 || i >= view.length - 1; n.onclick = () => step(1);
    nav.append(p, n);
    card.appendChild(nav);
  }

  // ---------- actions ----------
  function choose(L) {
    const q = BY[S.cur]; if (!q || S.ans[q.id]) return;
    if (q.ans.length > 1) {
      const cur = pending[q.id] || [];
      pending[q.id] = cur.includes(L) ? cur.filter(x => x !== L) : cur.concat(L).sort();
      renderCard();
    } else {
      S.ans[q.id] = { p: [L], ok: q.ans[0] === L };
      refresh(false);
    }
  }
  function checkMulti() {
    const q = BY[S.cur]; const p = (pending[q.id] || []).slice().sort();
    if (!p.length) return;
    S.ans[q.id] = { p, ok: p.join() === q.ans.slice().sort().join() };
    delete pending[q.id];
    refresh(false);
  }
  function toggleFlag() {
    const id = S.cur; if (!id) return;
    if (S.flag[id]) delete S.flag[id]; else S.flag[id] = true;
    refresh(false);
  }
  function go(id) {
    S.cur = id; save(); renderCard(); renderMap();
    document.body.classList.remove("show-panel"); $("ptoggle").setAttribute("aria-expanded", "false");
    const c = $("card"); if (c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: "start" });
  }
  function step(d) {
    const i = view.indexOf(S.cur), j = i + d;
    if (j < 0 || j >= view.length) return;
    go(view[j]);
  }

  function refresh(recompute) {
    if (recompute) computeView();
    save(); renderMeter(); renderPanel(); renderCard();
  }

  // ---------- wiring ----------
  $("hard").onchange = e => { S.hard = e.target.checked; refresh(true); };
  $("shuffle").onchange = e => { S.shuffle = e.target.checked; if (S.shuffle) S.seed = (Math.random() * 1e9) | 0; refresh(true); };
  $("ptoggle").onclick = () => { const on = document.body.classList.toggle("show-panel"); $("ptoggle").setAttribute("aria-expanded", String(on)); };

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    const q = S.cur && BY[S.cur]; if (!q) return;
    const k = e.key;
    if (k === "ArrowRight") { step(1); e.preventDefault(); return; }
    if (k === "ArrowLeft") { step(-1); e.preventDefault(); return; }
    if (k === "f" || k === "F") { toggleFlag(); return; }
    if (k === "Enter") {
      if (tag === "button") return; // let focused buttons handle Enter themselves
      if (q.ans.length > 1 && !S.ans[q.id]) checkMulti(); else step(1);
      e.preventDefault(); return;
    }
    const L = k.toUpperCase();
    const idx = LET.indexOf(L);
    if (idx >= 0 && idx < q.opts.length && k.length === 1) choose(L);
  });

  const omitted = "Chapter 1 Q54–55 are left out because they refer to a phylogenetic tree figure that isn’t in the testbank file. Chapter 5 Q68–72 used figures too; their results are described in words so the questions still work.";
  $("foot").textContent = Q.length + " questions from the Raven Biology (12e) testbank, chapters 1–5, with answers checked against the official answer keys. Explanations are written to match the textbook’s treatment. " + omitted + " Your progress is saved in this browser only.";

  computeView();
  refresh(false);
})();
</script>
</body>
</html>
