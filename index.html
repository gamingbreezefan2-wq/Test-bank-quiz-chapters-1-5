walls.","C":"Animal energy storage.","E":"Plant starch."},"note":""},{"ch":3,"n":57,"sec":"03.02","bloom":2,"ctx":null,"stem":"Yogurt contains galactose and glucose, which are generated when bacterial enzymes act on milk sugars. What is the main source of the galactose in yogurt?","opts":["Maltose","Sucrose","Lactose","Fructose","Glycogen"],"ans":["C"],"why":"Milk sugar <b>lactose<\/b> = glucose + galactose. Hydrolysis releases both.","wrong":{"A":"Glucose + glucose.","B":"Glucose + fructose.","D":"A monosaccharide — not galactose.","E":"A glucose polymer."},"note":""},{"ch":3,"n":58,"sec":"03.04","bloom":1,"ctx":null,"stem":"Hemoglobin transports oxygen in the blood and consists of a chain of 146 amino acids. How many different types of amino acids are used to construct proteins?","opts":["2","20","146","200"],"ans":["B"],"why":"Proteins are built from <b>20<\/b> standard amino acids.","wrong":{"A":"Far too few.","C":"That's the chain length, not the number of types.","D":"Far too many."},"note":"Hemoglobin actually has four chains (two α chains of 141 amino acids, two β chains of 146). The stem simplifies this, but it doesn't change the answer."},{"ch":3,"n":59,"sec":"03.04","bloom":2,"ctx":null,"stem":"Luke sprained his ankle, tearing some of the collagen protein that forms his ligaments. Some types of collagen consist of three polypeptide chains twisted together to form a rope-like strand. What level of protein structure does this rope-like strand represent?","opts":["Primary","Secondary","Tertiary","Quaternary"],"ans":["D"],"why":"Multiple polypeptide chains associating = <b>quaternary<\/b>.","wrong":{"A":"Amino acid sequence.","B":"Each chain's helix is secondary; the three-chain assembly is quaternary.","C":"One chain's overall fold."},"note":""},{"ch":3,"n":60,"sec":"03.01","bloom":2,"ctx":null,"stem":"If all functional groups are removed from an organic molecule, leaving only a hydrocarbon chain, the molecule becomes a:","opts":["Lipid","Carbohydrate","Protein","Nucleic acid"],"ans":["A"],"why":"Only C and H → nonpolar → behaves like a <b>lipid<\/b> (fatty acid tail).","wrong":{"B":"Needs –OH groups.","C":"Needs amino and carboxyl groups.","D":"Needs phosphate and nitrogenous bases."},"note":""},{"ch":3,"n":61,"sec":"03.04","bloom":3,"ctx":null,"stem":"Which amino acid is least soluble in water?","opts":["Isoleucine","Alanine","Glutamine","Glycine"],"ans":["A"],"why":"<b>Isoleucine<\/b> has the largest hydrocarbon side chain (–C₄H₉) → most nonpolar.","wrong":{"B":"Small nonpolar side chain (–CH₃).","C":"Polar amide side chain → soluble.","D":"Side chain is just –H; too small to make it very hydrophobic."},"note":""},{"ch":3,"n":62,"sec":"03.04","bloom":3,"ctx":null,"stem":"Which amino acid is most soluble in water?","opts":["Serine","Valine","Glycine","Leucine"],"ans":["A"],"why":"<b>Serine<\/b>'s side chain (–CH₂OH) has a hydroxyl that hydrogen-bonds with water.","wrong":{"B":"Hydrocarbon side chain.","C":"Side chain is –H; no polar group.","D":"Hydrocarbon side chain."},"note":""},{"ch":3,"n":63,"sec":"03.01","bloom":4,"ctx":null,"stem":"The formula for glucose is C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>. What is the formula for a polymer made by linking ten glucose molecules together by dehydration synthesis?","opts":["C<sub>60<\/sub>H<sub>120<\/sub>O<sub>60<\/sub>","C<sub>60<\/sub>H<sub>102<\/sub>O<sub>51<\/sub>","C<sub>60<\/sub>H<sub>100<\/sub>O<sub>50<\/sub>","C<sub>60<\/sub>H<sub>111<\/sub>O<sub>51<\/sub>"],"ans":["B"],"why":"10 × C₆H₁₂O₆ = C₆₀H₁₂₀O₆₀. Joining 10 units forms <b>9 bonds<\/b>, releasing 9 H₂O (H₁₈O₉). C₆₀H₁₂₀O₆₀ − H₁₈O₉ = <b>C₆₀H₁₀₂O₅₁<\/b>.","wrong":{"A":"Forgot to remove the water.","C":"Removed 10 waters instead of 9 (n − 1).","D":"Arithmetic error in hydrogens."},"note":""},{"ch":3,"n":64,"sec":"03.04","bloom":2,"ctx":null,"stem":"The myoglobin protein, which carries oxygen in muscle cells, has only the first three levels of protein structure. What can you infer about myoglobin?","opts":["Myoglobin lacks hydrogen bonds","Myoglobin is made of nucleic acids","Myoglobin is not helical or pleated","Myoglobin is made of only one polypeptide chain"],"ans":["D"],"why":"No quaternary structure → a <b>single polypeptide<\/b> (hemoglobin, by contrast, has four). Clinically, myoglobin leaks into blood after muscle injury (rhabdomyolysis).","wrong":{"A":"Secondary and tertiary structure depend on hydrogen bonds.","B":"It's a protein.","C":"Having secondary structure means it does have helices (myoglobin is mostly α-helix)."},"note":""},{"ch":3,"n":65,"sec":"03.03","bloom":3,"ctx":null,"stem":"A phosphorus shortage in soil would make it difficult for plants to produce:","opts":["cellulose","amylose","starch","DNA"],"ans":["D"],"why":"<b>DNA<\/b>'s sugar–phosphate backbone requires phosphorus.","wrong":{"A":"Carbohydrate — only C, H, O.","B":"Carbohydrate — only C, H, O.","C":"Carbohydrate — only C, H, O."},"note":""},{"ch":3,"n":66,"sec":"03.03","bloom":1,"ctx":null,"stem":"This is a nucleotide containing molecule that is commonly used to carry electrons in the cell.","opts":["ADP","ATP","NAD<sup>+<\/sup>","pyruvic acid"],"ans":["C"],"why":"<b>NAD⁺<\/b> (a dinucleotide) accepts electrons to become NADH in glycolysis and the Krebs cycle, then delivers them to the electron transport chain.","wrong":{"A":"Transfers phosphate/energy, not electrons.","B":"Energy currency, not an electron carrier.","D":"Product of glycolysis; not a nucleotide."},"note":""},{"ch":3,"n":67,"sec":"03.02","bloom":4,"ctx":null,"stem":"Benedict's reagent is a chemical that is used as a test for the presence of a free aldehyde functional group on glucose. The aldehyde is used when glucose and fructose bind together to form sucrose, and the Benedict's test is negative. Starch contains a great deal of glucose but gives a negative Benedict's test because:","opts":["all of the aldehyde groups on the starch are oxidized and cannot react with the Benedict's reagent.","starch is not soluble in water and cannot react with Benedict's reagent.","glucose in starch has lost a carbon atom and cannot react with Benedict's reagent.","only the glucose at the end of a chain of starch will have an exposed aldehyde functional group to react with Benedict's reagent."],"ans":["D"],"why":"Each glucose's aldehyde carbon (C1) is used up in the glycosidic bond to the next glucose. <b>Only the one end glucose<\/b> has a free aldehyde — negligible signal for a huge molecule.","wrong":{"A":"The aldehydes aren't oxidized; they're tied up in bonds.","B":"Solubility isn't the reason.","C":"Polymerization removes only H₂O, never carbon."},"note":""},{"ch":3,"n":68,"sec":"03.04","bloom":3,"ctx":null,"stem":"What characteristic would the R groups of amino acids have if they are located within the interior of biological membranes?","opts":["The R groups would be hydrophilic.","The R groups would be hydrophobic.","The R groups would be polar.","The R groups would be able to form ionic bonds."],"ans":["B"],"why":"The lipid core is nonpolar → only <b>hydrophobic<\/b> side chains are stable there.","wrong":{"A":"Hydrophilic groups face water, not lipid tails.","C":"Polar groups can't stay buried in the lipid core.","D":"Charged groups are strongly repelled from the core."},"note":""},{"ch":3,"n":69,"sec":"03.05","bloom":3,"ctx":null,"stem":"Sudan IV, a dye that binds to nonpolar molecules, is used to detect the presence of macromolecules in food. Sudan IV would test positive in the presence of what macromolecule?","opts":["Starch","DNA","Chitin","Hemoglobin","Fats"],"ans":["E"],"why":"A nonpolar dye dissolves into nonpolar <b>fats<\/b>. (Pathology labs use similar lipid stains, e.g., Oil Red O for fatty liver.)","wrong":{"A":"Polar polysaccharide (iodine test).","B":"Highly charged.","C":"Polar polysaccharide.","D":"Water-soluble protein."},"note":""},{"ch":3,"n":70,"sec":"03.05","bloom":4,"ctx":null,"stem":"How many water molecules are produced during the formation of a triglyceride from fatty acids and glycerol?","opts":["0","1","2","3","4"],"ans":["D"],"why":"Each of glycerol's three –OH groups joins one fatty acid's –COOH, releasing one H₂O each → <b>3<\/b>.","wrong":{"A":"Dehydration synthesis always releases water.","B":"Undercount.","C":"Undercount (that would be a diglyceride).","E":"Overcount."},"note":""},{"ch":3,"n":71,"sec":"03.03","bloom":4,"ctx":null,"stem":"Acyclovir is an antiviral chemical that resembles a nucleotide but lacks a 3′ OH group and cannot form phosphodiester bonds. Why is Acyclovir useful in treating some viral infections?","opts":["Acyclovir stops viral protein synthesis.","Acyclovir halts viral DNA replication.","Acyclovir blocks the assembly of viral cell capsules.","Acyclovir hydrolyzes viral polysaccharides."],"ans":["B"],"why":"DNA polymerase adds each nucleotide by attaching it to the <b>3′-OH<\/b> of the growing strand. Once acyclovir is incorporated, there's no 3′-OH → <b>chain termination<\/b>. Same principle as dideoxy (Sanger) sequencing.","wrong":{"A":"Protein synthesis uses peptide bonds, not phosphodiester bonds.","C":"Viruses have capsids, not \"cell capsules.\"","D":"It doesn't hydrolyze anything."},"note":""},{"ch":3,"n":72,"sec":"03.02","bloom":3,"ctx":null,"stem":"α-glucose is present in potatoes and β-glucose is present in wood. Both are glucose molecules but one can be used by humans to synthesize ATP and one cannot. Based on this information, what is the best explanation on why humans can only digest one of the glucose types?","opts":["α-glucose is C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub> and β-glucose is C<sub>5<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>.","α-glucose and β-glucose are stereoisomers with OH groups oriented differently.","Only α-glucose can form polysaccharides.","α-glucose is a chain and β-glucose is a ring."],"ans":["B"],"why":"They differ only in the <b>orientation of the C1 –OH<\/b>. That changes the linkage (α vs. β) and the polymer's shape. Our starch-digesting enzymes (amylases) cut only α linkages, and we have no enzyme for the β(1→4) links between glucoses in cellulose.","wrong":{"A":"Both are C₆H₁₂O₆.","C":"β-glucose forms cellulose, a polysaccharide.","D":"Both form rings in solution."},"note":""},{"ch":3,"n":73,"sec":"03.01","bloom":3,"ctx":null,"stem":"You label cells with a radioactive isotope of sulfur (<sup>35<\/sup>S). The only molecules that would be radioactively labeled in these cells are:","opts":["Lipids","Proteins","Carbohydrates","Nucleic acids"],"ans":["B"],"why":"Sulfur occurs in cysteine and methionine → only <b>proteins<\/b> get labeled.","wrong":{"A":"C, H, O (sometimes P, N) — no S.","C":"C, H, O only.","D":"C, H, O, N, P — no S."},"note":""},{"ch":3,"n":74,"sec":"03.03","bloom":3,"ctx":null,"stem":"A polymer with the sequence 5′ ACGTACGAATAG 3′ is a:","opts":["protein.","piece of RNA.","piece of DNA.","polysaccharide."],"ans":["C"],"why":"5′/3′ ends → nucleic acid; contains <b>T<\/b> and no U → <b>DNA<\/b>.","wrong":{"A":"Proteins have N/C termini and a 20-letter alphabet.","B":"RNA would contain U, not T.","D":"Polysaccharides have no 5′/3′ notation."},"note":""},{"ch":4,"n":1,"sec":"04.01","bloom":1,"ctx":null,"stem":"The semifluid matrix that surrounds organelles in a cell is called the:","opts":["ribosome.","cytoplasm.","stroma.","nucleoplasm."],"ans":["B"],"why":"The gel-like fluid (cytosol) and everything suspended in it outside the nucleus = <b>cytoplasm<\/b>.","wrong":{"A":"A protein-making machine, not a matrix.","C":"The fluid inside chloroplasts.","D":"The fluid inside the nucleus."},"note":""},{"ch":4,"n":2,"sec":"04.03","bloom":1,"ctx":null,"stem":"A distinctive feature of eukaryotes is the organization of tightly packaged chromosomal DNA with proteins into a membrane-bound structure called a:","opts":["nucleolus.","cell.","nucleus.","plasma membrane."],"ans":["C"],"why":"DNA + histones (chromatin) enclosed by the double-membrane nuclear envelope = <b>nucleus<\/b>.","wrong":{"A":"A region <i>inside<\/i> the nucleus that makes ribosomes; it has no membrane.","B":"Too broad.","D":"The cell's outer boundary."},"note":""},{"ch":4,"n":3,"sec":"04.04","bloom":1,"ctx":null,"stem":"The organelle that can collect, package, modify, and transport molecules is called the:","opts":["mitochondria.","plasma membrane.","vesicle.","Golgi apparatus."],"ans":["D"],"why":"The <b>Golgi<\/b> receives ER products, modifies them (e.g., adds sugars), sorts and ships them in vesicles.","wrong":{"A":"Makes ATP.","B":"The cell boundary.","C":"Vesicles carry cargo but don't collect, modify or sort it."},"note":""},{"ch":4,"n":4,"sec":"04.02","bloom":3,"ctx":null,"stem":"Many antibiotics kill bacteria because they hinder translation by prokaryotic ________.","opts":["nucleoids","cytoskeleton","ribosomes","capsules","cytoplasm"],"ans":["C"],"why":"Translation happens on <b>ribosomes<\/b>. Bacterial 70S ribosomes differ from our 80S ribosomes, so drugs like streptomycin and tetracycline hit bacteria selectively.","wrong":{"A":"The nucleoid holds DNA; not involved in translation.","B":"Structural support, not translation.","D":"A protective outer layer.","E":"The medium, not the machine."},"note":""},{"ch":4,"n":5,"sec":"04.05","bloom":1,"ctx":null,"stem":"The evolutionary process that created chloroplasts and mitochondria is:","opts":["endosymbiosis.","evolution.","symbiosis.","punctuated equilibrium."],"ans":["A"],"why":"An ancestral cell engulfed an aerobic bacterium (→ mitochondrion) and a cyanobacterium (→ chloroplast) = <b>endosymbiosis<\/b>. Evidence: own circular DNA, 70S-type ribosomes, double membranes, division by fission.","wrong":{"B":"Too broad.","C":"Symbiosis is any close living-together; endosymbiosis is specifically one living <i>inside<\/i> another.","D":"A model of the tempo of evolution."},"note":""},{"ch":4,"n":6,"sec":"04.06","bloom":1,"ctx":null,"stem":"Microfilaments such as actin, microtubules, and the intermediate filaments form the cell-supporting structure called the:","opts":["cytoplasm.","plasma membrane.","cytoskeleton.","nucleus."],"ans":["C"],"why":"The three protein fiber systems together = <b>cytoskeleton<\/b> (shape, transport, movement).","wrong":{"A":"The whole cell interior.","B":"The boundary.","D":"The DNA compartment."},"note":""},{"ch":4,"n":7,"sec":"04.07","bloom":2,"ctx":null,"stem":"Integrins are glycoproteins that help link the cytoskeleton and the:","opts":["cell wall.","extracellular matrix.","cytoplasm.","ribosomes."],"ans":["B"],"why":"Integrins span the membrane: outside they bind ECM proteins (fibronectin, collagen); inside they connect (via linker proteins) to actin. They link the cytoskeleton to the <b>ECM<\/b>.","wrong":{"A":"Animal cells, where integrins work, have no cell wall.","C":"The cytoskeleton is inside the cytoplasm; the other side of the link is outside.","D":"Unrelated."},"note":""},{"ch":4,"n":8,"sec":"04.01","bloom":1,"ctx":null,"stem":"Small cells function more effectively, because as cells become larger their surface area to volume ratio:","opts":["increases.","decreases.","stays the same.","is squared.","is cubed."],"ans":["B"],"why":"Surface area grows with r², volume with r³ → SA:V falls as 1/r. A big cell has <b>too little membrane<\/b> to exchange materials for all its volume.","wrong":{"A":"Opposite.","C":"It changes with size.","D":"Surface area scales with the square; the ratio decreases.","E":"Volume scales with the cube; the ratio decreases."},"note":""},{"ch":4,"n":9,"sec":"04.04","bloom":1,"ctx":null,"stem":"Organelles that breakdown hydrogen peroxide into water and oxygen are:","opts":["lysosomes.","plastids.","vacuoles.","liposomes.","peroxisomes."],"ans":["E"],"why":"<b>Peroxisomes<\/b> contain catalase: 2 H₂O₂ → 2 H₂O + O₂. They also oxidize fatty acids.","wrong":{"A":"Contain acid hydrolases for digestion.","B":"Plant organelles (chloroplasts, amyloplasts).","C":"Storage.","D":"Artificial lipid vesicles."},"note":""},{"ch":4,"n":10,"sec":"04.02","bloom":1,"ctx":null,"stem":"A circular molecule of DNA devoid of any histone proteins describes the chromosome of a (an):","opts":["bacteria","protozoa","insects","flowering plants","yeasts"],"ans":["A"],"why":"<b>Bacteria<\/b> have a single circular chromosome without histones (in the nucleoid).","wrong":{"B":"Eukaryote — linear chromosomes with histones.","C":"Eukaryote.","D":"Eukaryote.","E":"Eukaryote (yeasts are fungi)."},"note":""},{"ch":4,"n":11,"sec":"04.01","bloom":1,"ctx":null,"stem":"Who first described cells?","opts":["Darwin","Golgi","Linnaeus","Hooke","Leeuwenhoek"],"ans":["D"],"why":"Robert <b>Hooke<\/b> (1665) saw and named \"cells\" in cork.","wrong":{"A":"Evolution.","B":"Described the Golgi apparatus.","C":"Classification.","E":"First to see <i>living<\/i> microorganisms, slightly later."},"note":""},{"ch":4,"n":12,"sec":"04.01","bloom":1,"ctx":null,"stem":"Schleiden and Schwann stated the \"cell theory,\" which in its modern form says:","opts":["all organisms are composed of one or more cells, all cells require oxygen and all cells arise by division of other cells.","all organisms are composed of one or more cells, all cells are the smallest living things and all cells arise by division of other cells.","all cells will arise spontaneously, all cells require oxygen and all cells are composed of one or more cells.","all organisms are composed of one or more cells, all cells arise spontaneously and all cells vary in size and shape."],"ans":["B"],"why":"Three tenets: organisms are made of <b>one or more cells<\/b>; cells are the <b>smallest living units<\/b>; cells come only from <b>preexisting cells<\/b>.","wrong":{"A":"Many cells live without oxygen (anaerobes).","C":"Spontaneous generation is false; oxygen isn't required.","D":"Spontaneous generation is false."},"note":""},{"ch":4,"n":13,"sec":"04.03","bloom":1,"ctx":null,"stem":"The \"X\" shaped chromosomal hereditary material can be packaged in this organelle in eukaryotic cells but not in prokaryotic cells. This organelle is the:","opts":["mitochondria.","chloroplast.","nucleoid.","nucleus.","ribosomes."],"ans":["D"],"why":"Condensed eukaryotic chromosomes are housed in the <b>nucleus<\/b>.","wrong":{"A":"Has its own small circular DNA, not X-shaped chromosomes.","B":"Same as mitochondria.","C":"The prokaryotic DNA region.","E":"No DNA."},"note":""},{"ch":4,"n":14,"sec":"04.02","bloom":1,"ctx":null,"stem":"The peptidoglycan of bacterial cell walls contains a carbohydrate matrix linked together by short chains of:","opts":["amino acids.","fatty acids.","nucleotides.","water molecules.","steroids."],"ans":["A"],"why":"Sugar chains (NAG–NAM) cross-linked by short <b>peptides<\/b>. Penicillin works by blocking that cross-linking.","wrong":{"B":"Lipids.","C":"Nucleic acids.","D":"Water isn't a structural linker.","E":"Lipids."},"note":""},{"ch":4,"n":15,"sec":"04.02","bloom":1,"ctx":null,"stem":"Prokaryotic cell movement is attributed to:","opts":["capsules.","ribosomes.","pili.","cytoskeleton proteins.","flagella."],"ans":["E"],"why":"Bacterial <b>flagella<\/b> are rotary motors powered by the proton gradient.","wrong":{"A":"Protection and attachment.","B":"Protein synthesis.","C":"Attachment and DNA transfer (conjugation).","D":"Bacteria have cytoskeleton-like proteins, but they swim with flagella."},"note":""},{"ch":4,"n":16,"sec":"04.02","bloom":1,"ctx":null,"stem":"Photosynthetic pigments in bacteria are located in the:","opts":["nuclei.","chloroplasts.","cell wall.","plasma membrane.","plasmids."],"ans":["D"],"why":"Without organelles, bacteria embed pigments in (folds of) the <b>plasma membrane<\/b>.","wrong":{"A":"Prokaryotes have no nucleus.","B":"Prokaryotes have no chloroplasts.","C":"Structural only.","E":"Plasmids are DNA."},"note":""},{"ch":4,"n":17,"sec":"04.03","bloom":1,"ctx":null,"stem":"Plant cells often have a large membrane-bound sac that is used for storing water and other substances called a:","opts":["nucleus.","chloroplast.","Golgi body.","centriole.","central vacuole."],"ans":["E"],"why":"The <b>central vacuole<\/b> stores water and solutes and generates turgor pressure.","wrong":{"A":"Holds DNA.","B":"Photosynthesis.","C":"Packaging/modification.","D":"Not membrane-bound; absent in most plant cells."},"note":""},{"ch":4,"n":18,"sec":"04.02","bloom":1,"ctx":null,"stem":"This cellular structure lacks a membrane:","opts":["endoplasmic reticulum","microbody","Golgi body","nucleoid","nucleus"],"ans":["D"],"why":"The <b>nucleoid<\/b> is just the region where bacterial DNA sits — no membrane.","wrong":{"A":"Membrane-bound.","B":"Microbodies (e.g., peroxisomes) have a single membrane.","C":"Membrane-bound stacks.","E":"Double membrane envelope."},"note":""},{"ch":4,"n":19,"sec":"04.02","bloom":1,"ctx":null,"stem":"Some of the functions of the eukaryotic organelles are performed in bacteria by the:","opts":["plasma membrane.","nucleoid area.","cell wall.","capsule.","flagella/cilia."],"ans":["A"],"why":"Bacteria run their electron transport chain, photosynthesis and lipid synthesis on the <b>plasma membrane<\/b> — jobs done by mitochondria/chloroplasts/ER in eukaryotes.","wrong":{"B":"Just holds DNA.","C":"Shape and protection.","D":"Protection.","E":"Movement."},"note":""},{"ch":4,"n":20,"sec":"04.01","bloom":1,"ctx":null,"stem":"The cytoplasmic space in eukaryotic cells is occupied by many diverse membrane-bound structures with specific cellular functions called:","opts":["flagella.","organelles.","cilia.","chromosomes.","receptors."],"ans":["B"],"why":"Specialized membrane-bound compartments = <b>organelles<\/b>.","wrong":{"A":"Motility structures.","C":"Motility structures.","D":"DNA packages in the nucleus.","E":"Proteins."},"note":""},{"ch":4,"n":21,"sec":"04.03","bloom":2,"ctx":null,"stem":"Ribosomes are made up of:","opts":["only DNA molecules.","only RNA molecules.","DNA and RNA.","only protein molecules.","protein and RNA."],"ans":["E"],"why":"rRNA + ribosomal proteins. The rRNA actually catalyzes peptide-bond formation (a ribozyme).","wrong":{"A":"Ribosomes contain no DNA.","B":"Proteins are also present.","C":"No DNA.","D":"rRNA is the core."},"note":""},{"ch":4,"n":22,"sec":"04.04","bloom":1,"ctx":null,"stem":"The eukaryotic organelle that is directly involved in the transport of proteins synthesized on the surface of the rough ER is called the:","opts":["mitochondrion.","vacuole.","smooth ER.","Golgi body.","nucleus."],"ans":["D"],"why":"Rough ER → vesicles → <b>Golgi<\/b> → final destinations.","wrong":{"A":"Energy.","B":"Storage.","C":"Lipid synthesis and detoxification.","E":"DNA."},"note":""},{"ch":4,"n":23,"sec":"04.05","bloom":1,"ctx":null,"stem":"In eukaryotes, mitochondria are the organelles primarily involved in:","opts":["energy release/capture.","phospholipid assembly.","export of enzymes.","lipid synthesis.","protein synthesis."],"ans":["A"],"why":"Mitochondria harvest energy from fuel molecules to make <b>ATP<\/b> (cellular respiration).","wrong":{"B":"Smooth ER.","C":"Golgi/secretory vesicles.","D":"Smooth ER.","E":"Ribosomes."},"note":""},{"ch":4,"n":24,"sec":"04.08","bloom":1,"ctx":null,"stem":"The major histocompatibility complex is important in a T-cell's ability to:","opts":["recognize specific bacteria.","recognize specific viruses.","recognize self from nonself.","recognize specific parasites."],"ans":["C"],"why":"MHC proteins are the cell's <b>\"self\" ID tags<\/b>; T cells check MHC plus the peptide it displays. This is why organ donors must be HLA-matched.","wrong":{"A":"Specific pathogens are recognized via foreign peptides presented <i>on<\/i> MHC; MHC itself marks self.","B":"Same as A.","D":"Same as A."},"note":""},{"ch":4,"n":25,"sec":"04.03","bloom":1,"ctx":null,"stem":"Nuclear pores permit the passage of all the following except:","opts":["RNA only outward.","proteins inward and outward.","DNA molecules only outward."],"ans":["C"],"why":"<b>DNA stays inside<\/b> the nucleus. mRNA, tRNA and ribosomal subunits go out; proteins (histones, polymerases) come in, and some go out.","wrong":{"A":"RNA does exit.","B":"Proteins do travel both ways."},"note":""},{"ch":4,"n":26,"sec":"04.03","bloom":1,"ctx":null,"stem":"The nucleolus is the site of:","opts":["protein synthesis.","ribosome assembly.","chromosome replication.","lipid synthesis.","uncoiling and unraveling of chromosomes."],"ans":["B"],"why":"rRNA genes are transcribed and assembled with proteins into ribosomal subunits in the nucleolus — <b>ribosome assembly<\/b>.","wrong":{"A":"Happens on ribosomes in the cytoplasm.","C":"Happens throughout the nucleus.","D":"Smooth ER.","E":"Not a nucleolar function."},"note":""},{"ch":4,"n":27,"sec":"04.03","bloom":1,"ctx":null,"stem":"Chromosomes can be condensed into compact structures, visible with the light microscope, but usually only:","opts":["after the cell is dead.","during cell division.","while the DNA is being copied into RNA.","while the proteins are being assembled.","while the nuclear pores are open."],"ans":["B"],"why":"Chromosomes condense during <b>mitosis/meiosis<\/b> so they can be moved without tangling.","wrong":{"A":"Dead cells don't condense chromosomes.","C":"Transcription needs <i>loosened<\/i> chromatin.","D":"Translation is in the cytoplasm.","E":"Pores are always open."},"note":""},{"ch":4,"n":28,"sec":"04.04","bloom":3,"ctx":null,"stem":"A doctor diagnoses a child with adrenoleukodystrophy (ALD), a disorder in which long fatty acid chains accumulate in the cells of the central nervous system. The issues arise with malfunctions in enzymes associated with which organelle?","opts":["Golgi bodies","ribosomes","vacuoles","peroxisomes","endoplasmic reticulum"],"ans":["D"],"why":"Very-long-chain fatty acids are broken down in <b>peroxisomes<\/b>. In ALD, they can't be imported/oxidized, so they build up and damage myelin.","wrong":{"A":"Modifies and ships proteins.","B":"Make proteins.","C":"Storage.","E":"<i>Synthesizes<\/i> lipids; it doesn't degrade very-long-chain fatty acids."},"note":""},{"ch":4,"n":29,"sec":"04.04","bloom":2,"ctx":null,"stem":"Peroxisomes are examples of:","opts":["chromosomes.","lysosomes.","microbodies.","nucleosomes.","ribosomes."],"ans":["C"],"why":"Small single-membrane enzyme sacs = <b>microbodies<\/b>; peroxisomes are the classic example.","wrong":{"A":"DNA structures.","B":"A different organelle (digestive, made via the Golgi).","D":"DNA wrapped on histones.","E":"Protein synthesis."},"note":""},{"ch":4,"n":30,"sec":"04.05","bloom":1,"ctx":null,"stem":"Mitochondria and chloroplasts are the other organelles besides the nucleus that contain:","opts":["DNA.","pores.","channels.","plasma membranes.","pigments."],"ans":["A"],"why":"Their own circular <b>DNA<\/b> — evidence of their bacterial (endosymbiotic) origin.","wrong":{"B":"Nuclear pores are unique to the nuclear envelope.","C":"Many membranes have channels.","D":"Only the cell has a plasma membrane.","E":"Only chloroplasts have pigments."},"note":""},{"ch":4,"n":31,"sec":"04.05","bloom":1,"ctx":null,"stem":"The organelle involved in the oxygen-requiring process by which the energy harvested from macromolecules is used to generate ATP is the:","opts":["nucleus.","lysosome.","ER.","mitochondria.","chloroplasts."],"ans":["D"],"why":"Aerobic respiration (O₂ as final electron acceptor) happens in <b>mitochondria<\/b>.","wrong":{"A":"DNA.","B":"Digestion.","C":"Synthesis.","E":"Make ATP using light and <i>release<\/i> O₂; they don't require it."},"note":""},{"ch":4,"n":32,"sec":"04.07","bloom":1,"ctx":null,"stem":"Cilia and flagella of eukaryotic cells are composed of:","opts":["microtubules in a 9 + 2 arrangement.","actin filaments in a 9 + 2 arrangement.","protein fibers in a helical arrangement.","nine triplets of microtubules in a circle."],"ans":["A"],"why":"Nine outer microtubule doublets + 2 central singlets (<b>9 + 2<\/b>); dynein arms slide the doublets to bend them. Defective dynein → primary ciliary dyskinesia (chronic respiratory infections, infertility).","wrong":{"B":"Actin isn't in the axoneme.","C":"That describes bacterial flagella (flagellin).","D":"Nine triplets = centrioles/basal bodies."},"note":""},{"ch":4,"n":33,"sec":"04.05","bloom":1,"ctx":null,"stem":"The distinctive feature of chloroplasts is that they contain a green pigment called:","opts":["Gram stain.","chlorophyll.","hemoglobin.","chromatin.","keratin."],"ans":["B"],"why":"<b>Chlorophyll<\/b> absorbs red and blue light, reflecting green.","wrong":{"A":"A lab dye for bacteria.","C":"Blood O₂ carrier.","D":"DNA + proteins.","E":"Intermediate filament protein."},"note":""},{"ch":4,"n":34,"sec":"04.07","bloom":1,"ctx":null,"stem":"The spreading of cancer cells, wound healing, and blood clotting all rely on the same type of cell movement called:","opts":["swimming.","crawling.","whipping.","waving."],"ans":["B"],"why":"Actin polymerizes at the front edge, pushing the membrane forward; the cell attaches and pulls → <b>crawling<\/b>.","wrong":{"A":"Flagella/cilia in fluid.","C":"Not a cell-movement type.","D":"Not a cell-movement type."},"note":""},{"ch":4,"n":35,"sec":"04.01","bloom":3,"ctx":null,"stem":"A team of researchers is studying the external structures on the dorsal (back) surface of a spider mite. The spider mite seems to be the habitat of an even smaller mite, which is approximately 0.05mm. While they can see the dorsal surface of the spider mite with their naked eye, they cannot see the mite clearly. The researchers are writing a grant to provide support for a microscope to use to study these new mites. They need to purchase a microscope with a high magnification to observe the new mites on their habitat. Based on the information given, what type of microscope would you suggest?","opts":["transmission electron microscope","scanning electron microscope","binocular compound light microscope","no microscope is powerful enough to see the smaller mite"],"ans":["C"],"why":"0.05 mm = 50 µm — just below unaided-eye resolution (~100 µm) but easy for a <b>light microscope<\/b>, which also lets you view living specimens.","wrong":{"A":"Requires ultrathin, fixed sections — can't show a living mite on its host.","B":"Standard SEM needs a dead, coated specimen in a vacuum — and 50 µm doesn't need electron microscopy.","D":"50 µm is easily seen with light microscopy."},"note":""},{"ch":4,"n":36,"sec":"04.04","bloom":2,"ctx":null,"stem":"A cytologist is examining a tissue under an electron microscope. He notices that the endoplasmic reticulum of each cell is extremely rough in appearance and he knows that the rough appearance is because of the ribosomes embedded there. He asks why there are so many ribosomes. You respond,","opts":["\"This tissue exports lipids and is very involved with mRNA production.\"","\"This tissue exports proteins to other areas of the body.\"","\"This tissue exports various nucleic acids, hence the large number of ribosomes present on the endoplasmic reticulum in each of those cells.\""],"ans":["B"],"why":"Rough-ER ribosomes make proteins destined for <b>secretion<\/b> or membranes. Lots of RER = a secretory cell (e.g., pancreatic acinar cells, antibody-producing plasma cells).","wrong":{"A":"Lipids are made by smooth ER; mRNA is made in the nucleus.","C":"Ribosomes make proteins, not nucleic acids."},"note":""},{"ch":4,"n":37,"sec":"04.04","bloom":3,"ctx":null,"stem":"You stain a cell with a dye that reacts with an enzyme found in the lysosome. You would also expect to see this dye in the:","opts":["endoplasmic reticulum.","cytoplasm.","nucleus.","mitochondria."],"ans":["A"],"why":"Lysosomal enzymes are made on the rough <b>ER<\/b>, pass through the Golgi (where they're tagged with mannose-6-phosphate), then go to lysosomes. Clinically, failure of that tagging (I-cell disease) sends them out of the cell instead.","wrong":{"B":"Lysosomal enzymes are never free in the cytosol.","C":"Proteins aren't made in the nucleus.","D":"Mitochondrial proteins use a separate import route."},"note":""},{"ch":4,"n":38,"sec":"04.04","bloom":4,"ctx":null,"stem":"A cell biologist has developed a new drug that blocks vesicle transport at the <i>cis<\/i> face of the Golgi apparatus. What will this drug prevent from happening inside a cell?","opts":["The synthesis of proteins or lipids on the endoplasmic reticulum.","The movement of the lipids and proteins from the endoplasmic reticulum to the Golgi apparatus.","The movement of materials from the Golgi apparatus to the plasma membrane.","The movement of vesicles from mitochondria to the Golgi apparatus."],"ans":["B"],"why":"The <i>cis<\/i> face is the Golgi's <b>receiving dock from the ER<\/b>. Block it and ER products can't enter the Golgi.","wrong":{"A":"Synthesis on the ER is upstream and continues.","C":"That's the <i>trans<\/i> face (exit side).","D":"Mitochondria don't send vesicles to the Golgi."},"note":""},{"ch":4,"n":39,"sec":"04.03","bloom":2,"ctx":null,"stem":"Plants, fungi and bacteria all have:","opts":["cell walls","chloroplasts","nuclei","lysosomes","mitochondria"],"ans":["A"],"why":"All three have <b>cell walls<\/b> — made of cellulose, chitin and peptidoglycan respectively.","wrong":{"B":"Fungi and bacteria lack chloroplasts.","C":"Bacteria lack nuclei.","D":"Bacteria lack lysosomes.","E":"Bacteria lack mitochondria."},"note":""},{"ch":4,"n":40,"sec":"04.01","bloom":3,"ctx":null,"stem":"Your research project involves characterizing the expression pattern of a nuclear pore protein. After using immunohistochemistry to fluorescently label the protein, you decide that you would like to capture the data as a 3-D image. Which microscope should you use?","opts":["phase-contrast microscope","fluorescence microscope","confocal microscope","scanning electron microscope"],"ans":["C"],"why":"A <b>confocal<\/b> microscope scans a laser and uses a pinhole to reject out-of-focus light, collecting sharp optical sections (a z-stack) that are stacked into a 3-D fluorescent image.","wrong":{"A":"For unstained living cells; no fluorescence detection.","B":"Detects fluorescence but gives a blurry single plane, not true 3-D.","D":"Shows 3-D surface topography but can't image a fluorescent internal protein."},"note":""},{"ch":4,"n":41,"sec":"04.02","bloom":1,"ctx":null,"stem":"<i>Sulfolobus<\/i> are archaea that are commonly found in geothermal environments, with an optimum growth temperature of about 80°C. What feature allows archaea to thrive at such temperatures?","opts":["Archaea use the heat from their environment to produce ATP.","Archaea are highly adaptable to changing environmental temperatures.","Archaeal membranes contain special lipids.","Archaea have two cell walls which helps prevent heat absorption."],"ans":["C"],"why":"Archaeal membranes use <b>ether-linked, branched isoprenoid lipids<\/b>, some spanning the whole membrane as a monolayer — far more heat-stable than bacterial/eukaryotic lipids.","wrong":{"A":"Heat isn't an energy source for ATP synthesis.","B":"Thermophiles usually tolerate a narrow temperature range.","D":"They don't have two cell walls."},"note":""},{"ch":4,"n":42,"sec":"04.04","bloom":3,"ctx":null,"stem":"Alcohol consumption adversely affects the synthesis of molecules involved in protein degradation, which can eventually lead to liver damage. Given this information, which organelle in liver cells is most directly affected by alcohol consumption?","opts":["Nucleus","Golgi apparatus","Rough endoplasmic reticulum","Lysosome"],"ans":["C"],"why":"Read the verb: <b>synthesis<\/b> of degradative enzymes (lysosomal proteins) happens on the <b>rough ER<\/b>.","wrong":{"A":"Holds the genes but doesn't make proteins.","B":"Modifies and sorts proteins but doesn't make the polypeptide.","D":"Where the enzymes <i>act<\/i>, not where they're made — the classic trap."},"note":""},{"ch":4,"n":43,"sec":"04.04","bloom":3,"ctx":null,"stem":"You have identified an enzyme that appears to be involved in the addition of palmityl group (a fatty acid) to certain proteins. Knowing that palmitoylated proteins are usually targeted for delivery to the plasma membrane, in which organelles might this enzyme be expressed?","opts":["Golgi apparatus and endoplasmic reticulum","Golgi apparatus and nucleus","Endoplasmic reticulum and ribosomes","Endoplasmic reticulum and nucleus"],"ans":["A"],"why":"Membrane-bound proteins travel <b>ER → Golgi → plasma membrane<\/b>; modifications like lipid attachment happen along that route.","wrong":{"B":"The nucleus isn't on the secretory pathway.","C":"Ribosomes synthesize polypeptides but aren't membrane compartments of the pathway.","D":"The nucleus isn't on the secretory pathway."},"note":""},{"ch":4,"n":44,"sec":"04.01","bloom":2,"ctx":null,"stem":"Given what is known about the minimal essential functions of cellular life, if you could create an artificial cell, what cellular structures must you include?","opts":["cell wall","ribosomes","mitochondria","nucleus"],"ans":["B"],"why":"Every cell, prokaryotic or eukaryotic, must make proteins → <b>ribosomes<\/b> are universal (along with a membrane, DNA and cytoplasm).","wrong":{"A":"Animal cells lack walls.","C":"Prokaryotes lack mitochondria.","D":"Prokaryotes lack a nucleus."},"note":""},{"ch":4,"n":45,"sec":"04.06","bloom":1,"ctx":null,"stem":"When a vesicle moves along microtubules toward the center of the cell, the molecular motor(s) ________ are used?","opts":["kinesin","dynein","both kinesin and dynein","Molecular motors are not required for movement along microtubules."],"ans":["B"],"why":"Microtubule minus ends sit at the centrosome (center). <b>Dynein<\/b> walks toward minus ends (inward); kinesin walks toward plus ends (outward).","wrong":{"A":"Kinesin moves cargo outward.","C":"One direction uses one motor type.","D":"Motors (powered by ATP) are required."},"note":""},{"ch":4,"n":46,"sec":"04.04","bloom":4,"ctx":null,"stem":"A protein that is destined to reach the plasma membrane is making its way through the Golgi. At that moment, a drug was added to cells, blocking trafficking at the <i>trans<\/i> face of the Golgi. As a result, what would happen to the protein?","opts":["The protein would continue on to the cell surface.","The protein would be stuck in the Golgi.","The protein would return to the endoplasmic reticulum via the <i>trans<\/i> face of the Golgi.","The protein would exit the Golgi, but instead be targeted to the cytoplasm."],"ans":["B"],"why":"The <i>trans<\/i> face is the Golgi's <b>exit<\/b>. Block it and cargo accumulates in the Golgi.","wrong":{"A":"Its exit is blocked.","C":"Retrieval to the ER goes from the <i>cis<\/i> side, not the <i>trans<\/i> face.","D":"There's no route from the Golgi lumen into the cytosol."},"note":""},{"ch":4,"n":47,"sec":"04.01","bloom":2,"ctx":null,"stem":"If you were to use antibodies that were chemically bonded to a stain in order to visualize the expression pattern of a protein in a fixed tissue, what experimental techniques and equipment would be applicable?","opts":["immunohistochemistry, bright-field microscopy","DAPI or Hoechst stains, fluorescence microscopy","antibody interference assay, bright-field microscopy","immunohistochemistry, dark-field microscopy"],"ans":["A"],"why":"Antibody + colored stain on tissue = <b>immunohistochemistry<\/b>, viewed with ordinary <b>bright-field<\/b> light. (If the antibody carried a fluorophore, you'd use fluorescence microscopy.)","wrong":{"B":"DAPI/Hoechst stain DNA; they're not antibody-based.","C":"Not the standard technique.","D":"Dark-field is for unstained specimens (e.g., thin spirochetes)."},"note":""},{"ch":4,"n":48,"sec":"04.03","bloom":2,"ctx":null,"stem":"During which cellular process do all three forms of RNA associate?","opts":["ribosome assembly","chromatin formation","formation of the nucleolus","protein synthesis"],"ans":["D"],"why":"In <b>translation<\/b>, mRNA (template), tRNA (carries amino acids) and rRNA (in the ribosome) all work together.","wrong":{"A":"Only rRNA + proteins.","B":"DNA + histones.","C":"rRNA genes and assembling subunits; no mRNA/tRNA partnership."},"note":""},{"ch":4,"n":49,"sec":"04.08","bloom":3,"ctx":null,"stem":"Cardiac muscle cells are connected by special junctions called intercalated discs. Intercalated discs provide strength between cells of tissues which exhibit high mechanical stress, strong flexible connections between tissue cells, and electrical excitability between the cells. Using this information, which junctions are present in intercalated discs?","opts":["Tight, plasmodesmata, and adherens","Tight, plasmodesmata, and desmosomes","Gap, adherens, and desmosomes","Gap, desmosomes, and hemidesmosomes","Adherens, tight, and gap"],"ans":["C"],"why":"Strength → <b>adherens<\/b>; strong flexible anchoring → <b>desmosomes<\/b>; electrical coupling → <b>gap junctions<\/b>, which let ions flow cell-to-cell so the heart contracts in sync.","wrong":{"A":"Plasmodesmata are plant-only; tight junctions seal epithelia.","B":"Same problems as A.","D":"Hemidesmosomes anchor cells to the basal lamina, not to each other.","E":"Tight junctions seal; they don't provide strength or coupling."},"note":""},{"ch":4,"n":50,"sec":"04.05","bloom":2,"ctx":null,"stem":"Based on the function of mitochondria, what substance is able to pass through the outer membrane of the mitochondria easily?","opts":["Oxygen","Sugars","Amino acids","Potassium ions"],"ans":["A"],"why":"<b>O₂<\/b> is small and nonpolar — it diffuses straight through lipid bilayers to reach the electron transport chain.","wrong":{"B":"Polar, so it can't cross the lipid bilayer itself; it depends on protein pores.","C":"Polar/charged, so it depends on protein pores or transporters.","D":"Charged, so it depends on protein pores or channels."},"note":"Strictly, the outer mitochondrial membrane is leaky because protein pores (porins) let many small molecules through. The key's logic is that O₂ crosses the lipid itself, with no protein needed."},{"ch":4,"n":51,"sec":"04.07","bloom":2,"ctx":null,"stem":"Individuals that are heavy smokers may eventually have trouble clearing the mucous from their lungs because the structures that move fluid along the epithelial lining of the lung become damaged over time. What are these structures called?","opts":["Pili","Flagella","Cell walls","Cilia"],"ans":["D"],"why":"The \"mucociliary escalator\": <b>cilia<\/b> beat mucus upward. Smoke paralyzes and destroys them → smoker's cough and frequent infections.","wrong":{"A":"Bacterial attachment structures.","B":"One or a few long whips that propel cells (e.g., sperm).","C":"Animal cells have none."},"note":""},{"ch":4,"n":52,"sec":"04.03","bloom":3,"ctx":null,"stem":"Streptomycin is an antibiotic that interferes with the function of the 30S subunit of the prokaryotic ribosome. What is the consequence of treating a bacteria with streptomycin?","opts":["Impaired oxygen synthesis","Impaired protein synthesis","Impaired DNA synthesis","Impaired ATP synthesis"],"ans":["B"],"why":"The 30S subunit binds and decodes mRNA. Disrupt it → <b>no proper translation<\/b> → no new proteins → bacteria die.","wrong":{"A":"Not a ribosome function.","C":"DNA polymerase's job.","D":"ATP synthase/respiration."},"note":""},{"ch":4,"n":53,"sec":"04.06","bloom":3,"ctx":null,"stem":"A dish of cells is treated with centrinone, a centriole inhibitor. These cells would no longer be able to ________.","opts":["make ATP","produce lysosomes","synthesize proteins","conduct photosynthesis","divide"],"ans":["E"],"why":"Centrioles anchor the centrosome, which organizes the <b>spindle microtubules<\/b> that pull chromosomes apart → cells can't divide normally.","wrong":{"A":"Mitochondria.","B":"ER/Golgi.","C":"Ribosomes.","D":"Chloroplasts — animal cells don't photosynthesize."},"note":"Centrioles sit in the centrosome in the cytoplasm, not in the nucleus (the testbank's own explanation gets this wrong)."},{"ch":4,"n":54,"sec":"04.04","bloom":4,"ctx":null,"stem":"When looking at plant and animal cells with an electron microscope, you notice that the plant cells have more Golgi membranes than the animal cells. This is most likely because unlike in animal cells, in plant cells the Golgi apparatus is involved in the production of:","opts":["cell walls.","cytoplasm.","chloroplasts.","mitochondria."],"ans":["A"],"why":"Plant Golgi builds and exports <b>cell-wall polysaccharides<\/b> (hemicelluloses, pectins), a huge job animal cells don't have.","wrong":{"B":"Cytoplasm isn't \"produced\" by the Golgi.","C":"Chloroplasts divide by fission.","D":"Mitochondria divide by fission."},"note":"Cellulose itself is made at the plasma membrane; the Golgi makes the other wall polysaccharides."},{"ch":4,"n":55,"sec":"04.04","bloom":3,"ctx":null,"stem":"Glycogen Storage Disease Type II (GSD II), also known as Pompe disease, is a metabolic disorder that leads to the accumulation of glycogen in muscles and neurons throughout the body. It is caused by a defect in an enzyme that is normally housed with other enzymes that are involved in breaking down large macromolecules. What organelle is most likely affected by this disease?","opts":["Mitochondrion","Golgi body","Lysosome","Rough ER","Nucleus"],"ans":["C"],"why":"Enzymes that digest macromolecules live in the <b>lysosome<\/b>. Pompe = deficiency of acid α-glucosidase → glycogen piles up inside lysosomes (a lysosomal storage disease, treated with enzyme replacement).","wrong":{"A":"Oxidative metabolism.","B":"Processes the enzyme but isn't where it works.","D":"Makes the enzyme but isn't where it works.","E":"Holds the gene, not the enzyme."},"note":""},{"ch":4,"n":56,"sec":"04.05","bloom":3,"ctx":null,"stem":"Scientists believe that stimulating growth of algae and other organisms can reduce carbon dioxide amounts in the atmosphere. Where is carbon dioxide consumed in a plant cell?","opts":["Stroma in chloroplasts","Matrix in mitochondria","Number of amyloplasts","Central vacuole","Cellulose in cell wall"],"ans":["A"],"why":"The Calvin cycle (carbon fixation by rubisco) runs in the chloroplast <b>stroma<\/b>.","wrong":{"B":"The Krebs cycle there <i>releases<\/i> CO₂.","C":"Amyloplasts store starch.","D":"Stores water and solutes.","E":"Fixed carbon ends up in cellulose, but CO₂ is consumed in the stroma."},"note":""},{"ch":4,"n":57,"sec":"04.08","bloom":2,"ctx":null,"stem":"Cardiac muscle has prolonged contraction due to a sodium induced-calcium released process into the cytoplasm of the cell. Cardiac cells can communicate through pore-like channels between cells. List the junction and the organelle involved in cardiac muscle contraction?","opts":["Gap; Rough ER","Gap; Smooth ER","Gap; Golgi apparatus","Adherens; Rough ER","Adherens; Smooth ER","Adherens; Golgi apparatus"],"ans":["B"],"why":"Pore-like channels between cells = <b>gap junctions<\/b>. Ca²⁺ is stored and released by the sarcoplasmic reticulum, a specialized <b>smooth ER<\/b>.","wrong":{"A":"Rough ER makes proteins; it's not the Ca²⁺ store.","C":"The Golgi packages proteins.","D":"Adherens junctions anchor; they have no pores.","E":"Wrong junction.","F":"Wrong junction and organelle."},"note":""},{"ch":4,"n":58,"sec":"04.05","bloom":2,"ctx":null,"stem":"Mitochondrial disorders can be caused by mutations in all the following except:","opts":["mitochondrial DNA","nuclear DNA","cytoplasmic DNA"],"ans":["C"],"why":"Mitochondrial proteins are encoded by both <b>mtDNA<\/b> (a few, maternally inherited) and <b>nuclear DNA<\/b> (most). There's no separate \"cytoplasmic DNA\" genome in eukaryotic cells.","wrong":{"A":"mtDNA mutations cause disorders (e.g., MELAS, Leber's optic neuropathy).","B":"Most mitochondrial proteins are nuclear-encoded, so nuclear mutations cause disorders too."},"note":""},{"ch":4,"n":59,"sec":"04.05","bloom":2,"ctx":null,"stem":"What is the difference between mitochondria and chloroplasts?","opts":["Mitochondria have three membranes and chloroplasts have two membranes.","Mitochondria have linear strands of DNA and chloroplasts have rings of DNA.","Mitochondria are oxidative metabolic bacteria derivatives and chloroplasts are photosynthetic bacteria derivatives.","Mitochondria produce oxygen and chloroplasts produce carbon dioxide."],"ans":["C"],"why":"Mitochondria descend from <b>aerobic (oxidative) bacteria<\/b>; chloroplasts from <b>photosynthetic cyanobacteria<\/b>.","wrong":{"A":"Both have two envelope membranes (chloroplasts add internal thylakoids).","B":"Both have circular DNA.","D":"Reversed — chloroplasts release O₂, mitochondria release CO₂."},"note":""},{"ch":4,"n":60,"sec":"04.05","bloom":3,"ctx":null,"stem":"If a water molecule passes through the outer membrane of a chloroplast, how many more membranes will it have to move through to be in the stroma?","opts":["1","2","3","4"],"ans":["A"],"why":"Outer membrane → intermembrane space → <b>inner membrane<\/b> → stroma. Just 1 more. (Thylakoids sit <i>within<\/i> the stroma.)","wrong":{"B":"Would put it inside a thylakoid.","C":"Overcount.","D":"Overcount."},"note":""},{"ch":4,"n":61,"sec":"04.05","bloom":3,"ctx":null,"stem":"As ATP moves from the matrix of the mitochondrion to the cytoplasm of a cell, how many membranes will it pass?","opts":["1","2","3","4"],"ans":["B"],"why":"Matrix → inner membrane (ATP/ADP translocase) → intermembrane space → outer membrane (porins) → cytoplasm = <b>2<\/b>.","wrong":{"A":"Forgets the outer membrane.","C":"Mitochondria have only two membranes.","D":"Overcount."},"note":""},{"ch":4,"n":62,"sec":"04.03","bloom":3,"ctx":null,"stem":"Prokaryotic cells are smaller than eukaryotic cells. What is a plausible explanation?","opts":["Prokaryotic cell walls limit their cell growth.","Prokaryotes lack the genetic material needed for protein synthesis.","Eukaryotes have compartmentalization, which allows for specialization.","Prokaryotes have more diverse energy sources.","Eukaryotes are immobile allowing them to grow larger."],"ans":["C"],"why":"Internal membranes create specialized <b>compartments<\/b> and transport systems, so a big eukaryotic cell isn't limited to slow diffusion through one open space.","wrong":{"A":"Plant cells have walls and are large.","B":"Prokaryotes make proteins just fine.","D":"Energy diversity doesn't set size.","E":"Many eukaryotic cells move."},"note":""},{"ch":4,"n":63,"sec":"04.01","bloom":3,"ctx":null,"stem":"A cuboidal shaped cell with six sides is 1mm x 1mm x 1mm. What is the volume and the surface area of the cell?","opts":["1mm<sup>3<\/sup> : 6mm<sup>2<\/sup>","3mm<sup>3<\/sup> : 3mm<sup>2<\/sup>","1mm<sup>3<\/sup> : 3mm<sup>2<\/sup>","3mm<sup>3<\/sup> : 1mm<sup>2<\/sup>"],"ans":["A"],"why":"Volume = 1 × 1 × 1 = <b>1 mm³<\/b>. Surface = 6 faces × 1 mm² = <b>6 mm²<\/b>. (SA:V = 6:1.)","wrong":{"B":"Added dimensions instead of multiplying.","C":"Counted only 3 faces.","D":"Added dimensions and swapped values."},"note":""},{"ch":4,"n":64,"sec":"04.04","bloom":3,"ctx":null,"stem":"Matthew noticed that his house plants were wilting badly. Which cell structure had most likely contracted?","opts":["cytoplasm","cell wall","plasma membrane","vacuole"],"ans":["D"],"why":"The <b>central vacuole<\/b> is the main water reservoir. When it loses water, turgor pressure drops and the plant wilts.","wrong":{"A":"Loses some water, but the vacuole is the main reservoir.","B":"Rigid; it doesn't contract.","C":"May pull away from the wall in severe cases, but the vacuole is what shrinks."},"note":""},{"ch":5,"n":1,"sec":"05.01","bloom":1,"ctx":null,"stem":"The lipid layer that forms the foundation of cell membranes is primarily composed of molecules called ________.","opts":["phospholipids","fats","proteins","carbohydrates"],"ans":["A"],"why":"Amphipathic <b>phospholipids<\/b> (polar head + two nonpolar tails) spontaneously form the bilayer.","wrong":{"B":"Triglycerides lack a polar head, so they can't form bilayers.","C":"Embedded in the bilayer, but not its foundation.","D":"Attached to the outer surface as glycoproteins/glycolipids."},"note":""},{"ch":5,"n":2,"sec":"05.02","bloom":1,"ctx":null,"stem":"While water continually orients phospholipids into a lipid bilayer, it does not fix the lipids permanently into position. Thus, the bilayer is considered to be ________.","opts":["static","fluid","fluctuating","charged"],"ans":["B"],"why":"Lipids drift sideways freely within each layer → the bilayer is <b>fluid<\/b> (the \"fluid\" in fluid mosaic).","wrong":{"A":"Opposite.","C":"Not the scientific term.","D":"Head groups are polar, but that's not why it's fluid."},"note":""},{"ch":5,"n":3,"sec":"05.04","bloom":1,"ctx":null,"stem":"What describes the movement of substances down their concentration gradients?","opts":["Bulk transport","Active transport","Saturation","Diffusion"],"ans":["D"],"why":"Net movement from high to low concentration, driven by random motion = <b>diffusion<\/b>.","wrong":{"A":"Moves material in vesicles.","B":"Moves substances <i>up<\/i> gradients using energy.","C":"A property of carriers at high substrate."},"note":""},{"ch":5,"n":4,"sec":"05.04","bloom":1,"ctx":null,"stem":"Osmosis is the diffusion of water across a membrane in response to the concentration of one or more of the ________.","opts":["solutes","membranes","compartments","cells"],"ans":["A"],"why":"Water moves toward the side with more dissolved <b>solutes<\/b> (less free water).","wrong":{"B":"Membranes are the barrier, not the driver.","C":"Not the driver.","D":"Not the driver."},"note":""},{"ch":5,"n":5,"sec":"05.05","bloom":1,"ctx":null,"stem":"Which type of proteins is embedded in the cell membrane in both active transport and facilitated transport?","opts":["carrier","cytoskeletal","structural","targeted"],"ans":["A"],"why":"<b>Carriers<\/b> bind their solute and change shape — passively (e.g., GLUT glucose carriers) or actively (pumps). Channels are only passive.","wrong":{"B":"Support, not transport.","C":"Not a transport class.","D":"Not a transport class."},"note":""},{"ch":5,"n":6,"sec":"05.04","bloom":1,"ctx":null,"stem":"Osmosis occurs as water can cross the lipid bilayer through specialized channels for water movement called ________.","opts":["proteins","transmembrane carbohydrates","membrane pores","aquaporins"],"ans":["D"],"why":"<b>Aquaporins<\/b> are water channels. In the kidney, ADH inserts aquaporin-2 into collecting-duct cells; mutations cause nephrogenic diabetes insipidus.","wrong":{"A":"Too general.","B":"Carbohydrates don't form channels.","C":"Too generic."},"note":""},{"ch":5,"n":7,"sec":"05.01","bloom":1,"ctx":null,"stem":"The plasma membrane is a thin sheet of lipid embedded with","opts":["proteins.","carbohydrates.","polymers.","nucleotides.","sodium and potassium ions."],"ans":["A"],"why":"The \"mosaic\": <b>proteins<\/b> embedded in and floating through the bilayer.","wrong":{"B":"Attached to the outer surface, not embedded.","C":"Too vague.","D":"Not membrane components.","E":"Cross via channels/pumps; they aren't built into the membrane."},"note":""},{"ch":5,"n":8,"sec":"05.01","bloom":1,"ctx":null,"stem":"Membrane proteins are not very soluble in water, because they possess long stretches of non-polar amino acids that are","opts":["too long to interact with the water molecules.","hydrophobic.","are transmembranal.","hydrophilic.","used as transport channels."],"ans":["B"],"why":"Nonpolar = <b>hydrophobic<\/b>; they can't hydrogen-bond with water.","wrong":{"A":"Length isn't the issue; chemistry is.","C":"That's their location, not the reason.","D":"Opposite.","E":"A function, not a chemical property."},"note":""},{"ch":5,"n":9,"sec":"05.04","bloom":1,"ctx":null,"stem":"If a cell has the same concentration of dissolved molecules as its outside environment, the cell's condition is referred to as being","opts":["isotonic.","hypertonic.","hypotonic.","hydrophobic.","hydrophilic."],"ans":["A"],"why":"Equal solute concentration → no net water movement → <b>isotonic<\/b>.","wrong":{"B":"Higher solute.","C":"Lower solute.","D":"Describes water affinity, not relative concentration.","E":"Same as D."},"note":""},{"ch":5,"n":10,"sec":"05.05","bloom":1,"ctx":null,"stem":"A type of transport of a solute across a membrane, up its concentration gradient, using protein carriers driven by the expenditure of chemical energy is known as","opts":["osmosis.","diffusion.","facilitated transport.","active transport.","exocytosis."],"ans":["D"],"why":"Uphill + carrier + energy (ATP) = <b>active transport<\/b>.","wrong":{"A":"Passive water movement.","B":"Downhill.","C":"Downhill through carriers.","E":"Vesicle export."},"note":""},{"ch":5,"n":11,"sec":"05.03","bloom":2,"ctx":null,"stem":"The cell's plasma membrane mediates which of the following transactions with the environment? Choose all that apply.","opts":["Ingesting food molecules and sometimes entire cells","Returning waste and other molecules back to the environment","Responding to a host of chemical cues","Directing synthesis of various food-digesting proteins","Passing messages to other cells"],"ans":["A","B","C","E"],"why":"The membrane handles <b>intake<\/b> (endocytosis/phagocytosis), <b>export<\/b> (exocytosis), <b>receiving signals<\/b> (receptors) and <b>signaling<\/b> other cells.","wrong":{"D":"Directing protein synthesis is the job of DNA in the nucleus and ribosomes."},"note":""},{"ch":5,"n":12,"sec":"05.01","bloom":2,"ctx":null,"stem":"How are the tails and heads of membrane phospholipids oriented in their environment?","opts":["The hydrophobic heads are oriented toward each other and the hydrophilic tails are oriented toward the extracellular fluid and the intracellular fluid.","The hydrophilic tails are oriented toward each other and the hydrophobic heads are oriented toward the extracellular fluid and the intracellular fluid.","The hydrophobic tails are oriented toward each other and the hydrophilic heads are oriented toward the extracellular fluid and the intracellular fluid.","The hydrophilic heads are oriented toward each other and the hydrophobic tails are oriented toward the extracellular fluid and the intracellular fluid."],"ans":["C"],"why":"Water-loving <b>heads face water<\/b> on both sides; water-fearing <b>tails face each other<\/b> in the core.","wrong":{"A":"Heads and tails mislabeled.","B":"Heads and tails mislabeled.","D":"Correct labels, wrong orientation."},"note":""},{"ch":5,"n":13,"sec":"05.02","bloom":2,"ctx":null,"stem":"The fluid nature of the membranes is attributed to a lateral movement of","opts":["protein channels.","phospholipid molecules.","antigen molecules.","pumps such as the proton pump.","the entire lipid bilayer."],"ans":["B"],"why":"Individual <b>phospholipids<\/b> swap places with neighbors millions of times per second within a leaflet. (Flip-flop between leaflets is rare.)","wrong":{"A":"Proteins do move, but more slowly; fluidity comes from lipids.","C":"Not the source of fluidity.","D":"Not the source of fluidity.","E":"The bilayer as a whole doesn't slide."},"note":""},{"ch":5,"n":14,"sec":"05.01","bloom":1,"ctx":null,"stem":"On the outer surface of the plasma membrane there are marker molecules that identify the cell type. Often these molecules are","opts":["ATP.","amino acids.","nucleotides.","carbohydrate chains.","inorganic ions."],"ans":["D"],"why":"Glycoproteins and glycolipids carry <b>sugar chains<\/b> as ID tags. The ABO blood-group antigens are exactly this.","wrong":{"A":"An energy molecule inside the cell.","B":"Building blocks, not markers.","C":"Not surface markers.","E":"Not surface markers."},"note":""},{"ch":5,"n":15,"sec":"05.03","bloom":1,"ctx":null,"stem":"Which of the following protein classes are not found as membrane proteins?","opts":["transport channels","hormones","receptors","enzymes","identity markers"],"ans":["B"],"why":"<b>Hormones<\/b> are secreted signals that travel in the blood; they bind membrane receptors but aren't membrane proteins themselves.","wrong":{"A":"Classic membrane protein class.","C":"Classic membrane protein class.","D":"Many enzymes are membrane-bound (e.g., ATP synthase).","E":"Classic membrane protein class (e.g., MHC)."},"note":""},{"ch":5,"n":16,"sec":"05.03","bloom":1,"ctx":null,"stem":"The part of a membrane protein that extends through the phospholipid bilayer is primarily composed of amino acids that are","opts":["highly polar.","negatively charged.","nonpolar.","positively charged.","water soluble."],"ans":["C"],"why":"The core is hydrocarbon → transmembrane segments are <b>nonpolar<\/b>.","wrong":{"A":"Unstable in the lipid core.","B":"Charges are repelled from the core.","D":"Same as B.","E":"Opposite."},"note":""},{"ch":5,"n":17,"sec":"05.01","bloom":1,"ctx":null,"stem":"Red blood cells are biconcave. Their shape is determined by interior proteins anchored to the membrane termed","opts":["clathrins.","phospholipids.","cytoskeleton.","spectrins.","actin filaments."],"ans":["D"],"why":"A <b>spectrin<\/b> mesh lines the inner face of the RBC membrane. Mutations in spectrin or ankyrin cause hereditary spherocytosis — round, fragile RBCs and hemolytic anemia.","wrong":{"A":"Clathrin coats endocytic vesicles.","B":"The bilayer itself.","C":"Spectrin is part of the cortical cytoskeleton, but the specific protein asked for is spectrin.","E":"Short actin pieces link spectrin, but spectrin is the shape-defining protein."},"note":""},{"ch":5,"n":18,"sec":"05.04","bloom":1,"ctx":null,"stem":"The movement of substances from regions where their concentration is higher to regions where their concentration is lower is called","opts":["active transport.","diffusion.","pinocytosis.","pumping.","exocytosis."],"ans":["B"],"why":"High → low, no energy needed = <b>diffusion<\/b>.","wrong":{"A":"Low → high.","C":"Vesicle uptake.","D":"Low → high.","E":"Vesicle export."},"note":""},{"ch":5,"n":19,"sec":"05.04","bloom":1,"ctx":null,"stem":"If two solutions have unequal concentrations of a solute, the solution with the lower concentration is called","opts":["isotonic.","hypertonic.","hypotonic.","osmosis."],"ans":["C"],"why":"Lower solute = <b>hypotonic<\/b> (\"hypo\" = under).","wrong":{"A":"Equal.","B":"Higher.","D":"A process, not a description."},"note":""},{"ch":5,"n":20,"sec":"05.04","bloom":1,"ctx":null,"stem":"In bacteria, fungi, and plants the high internal pressure generated by osmosis is counteracted by the mechanical strength of their","opts":["plasma membranes.","organelles.","cytoskeletons.","cell walls."],"ans":["D"],"why":"Water rushes in → turgor pressure → the rigid <b>cell wall<\/b> pushes back and prevents bursting.","wrong":{"A":"Membranes alone burst (like RBCs in pure water).","B":"Not structural support for the whole cell.","C":"Not strong enough to resist turgor."},"note":""},{"ch":5,"n":21,"sec":"05.05","bloom":1,"ctx":null,"stem":"The actual transport of protons by the proton pump is mediated by a transmembrane protein which undergoes a change in its","opts":["conformation.","amino acid sequence.","net charge.","solubility.","immunity."],"ans":["A"],"why":"Pumps cycle between shapes (open-inside ↔ open-outside), driven by ATP — a <b>conformational change<\/b>.","wrong":{"B":"Sequence never changes.","C":"Phosphorylation adds charge locally, but transport works through shape change.","D":"Not changed.","E":"Not relevant."},"note":""},{"ch":5,"n":22,"sec":"05.06","bloom":1,"ctx":null,"stem":"The process often referred to as \"cellular eating\" is","opts":["osmosis.","pinocytosis.","phagocytosis.","diffusion.","active transport."],"ans":["C"],"why":"<b>Phagocytosis<\/b>: engulfing large particles or whole cells (macrophages, neutrophils).","wrong":{"A":"Water movement.","B":"\"Cellular drinking.\"","D":"Passive movement.","E":"Pumps."},"note":""},{"ch":5,"n":23,"sec":"05.04","bloom":1,"ctx":null,"stem":"Carrier-mediated transport of a substance down its concentration gradient is called","opts":["facilitated diffusion.","active transport.","exocytosis.","endocytosis.","phagocytosis."],"ans":["A"],"why":"Downhill + carrier protein = <b>facilitated diffusion<\/b>.","wrong":{"B":"Uphill.","C":"Vesicles.","D":"Vesicles.","E":"Vesicles."},"note":""},{"ch":5,"n":24,"sec":"05.04","bloom":1,"ctx":null,"stem":"Osmosis can only occur if water travels through the","opts":["cell wall.","semipermeable membrane.","vacuole.","ER.","cytoskeleton."],"ans":["B"],"why":"Osmosis needs a <b>selectively permeable membrane<\/b>: water passes, solutes don't.","wrong":{"A":"Fully permeable to water and small solutes — not selective.","C":"Not the defining barrier.","D":"Not the defining barrier.","E":"Not a barrier."},"note":""},{"ch":5,"n":25,"sec":"05.04","bloom":2,"ctx":null,"stem":"The type of movement of molecules that is specific and passive, and which becomes saturated if all of the protein carriers are in use is","opts":["exocytosis.","facilitated diffusion.","active transport.","endocytosis.","osmosis."],"ans":["B"],"why":"Specific + passive + saturable = <b>facilitated diffusion<\/b>.","wrong":{"A":"Vesicles.","C":"Also specific and saturable, but not passive.","D":"Vesicles.","E":"Water movement."},"note":""},{"ch":5,"n":26,"sec":"05.05","bloom":1,"ctx":null,"stem":"The type of movement that is specific and requires carrier molecules and energy is","opts":["exocytosis.","facilitated diffusion.","active transport.","endocytosis.","osmosis."],"ans":["C"],"why":"Carrier + energy = <b>active transport<\/b>.","wrong":{"A":"Vesicles.","B":"Passive.","D":"Vesicles.","E":"Passive water movement."},"note":""},{"ch":5,"n":27,"sec":"05.05","bloom":1,"ctx":null,"stem":"In a single sodium-potassium pump cycle, ATP is used with the result that","opts":["3 sodium ions leave and 2 potassium ions enter.","2 sodium ion enters and 1 potassium ion leaves.","2 sodium ion leaves and 1 potassium ion enters.","3 sodium ions enter and 2 potassium ions leave.","sodium and potassium ions enter and water leaves."],"ans":["A"],"why":"<b>3 Na⁺ out, 2 K⁺ in<\/b> per ATP — a net +1 charge out, helping make the inside negative. Clinically, digoxin inhibits this pump in heart cells to strengthen contraction.","wrong":{"B":"Wrong numbers and directions.","C":"Wrong numbers.","D":"Directions reversed.","E":"Water isn't pumped."},"note":""},{"ch":5,"n":28,"sec":"05.05","bloom":1,"ctx":null,"stem":"The accumulation of amino acids and sugars in animal cells can occur through","opts":["ATP pumps.","sodium-potassium pumps.","glucose pumps.","coupled transport.","proton pumps."],"ans":["D"],"why":"The Na⁺ gradient (built by the Na⁺/K⁺ pump) drives symporters that drag glucose or amino acids in against their gradients = <b>coupled transport<\/b>. Oral rehydration solution exploits the Na⁺–glucose symporter.","wrong":{"A":"Pumps build gradients but don't directly accumulate sugars.","B":"Builds the Na⁺ gradient, but doesn't carry sugars itself.","C":"Animal cells use coupled transport, not glucose pumps.","E":"Proton gradients drive coupled transport mainly in plants, fungi and bacteria; animal cells use the Na⁺ gradient instead."},"note":""},{"ch":5,"n":29,"sec":"05.02","bloom":1,"ctx":null,"stem":"Cholesterol functions in the plasma membrane to","opts":["transport ions.","serve as an energy molecule.","maintain fluidity.","mediate steroid action.","maintain hypertension."],"ans":["C"],"why":"Cholesterol is a fluidity <b>buffer<\/b>: it restrains lipid motion when warm and prevents tight packing when cold.","wrong":{"A":"Proteins transport ions.","B":"Not used as fuel.","D":"A steroid precursor, but in the membrane its job is fluidity.","E":"Not a membrane function."},"note":""},{"ch":5,"n":30,"sec":"05.02","bloom":1,"ctx":null,"stem":"A phospholipid molecule has a polar and a nonpolar end. Because of this, water molecules form","opts":["polar bonds with the nonpolar end of the phospholipid molecule.","polar bonds with the polar end of the phospholipid molecule.","hydrogen bonds with the nonpolar end of the phospholipid molecule.","hydrogen bonds with the polar end of the phospholipid molecule.","covalent bonds with the nonpolar end of the phospholipid molecule."],"ans":["D"],"why":"Water <b>hydrogen-bonds with the polar head<\/b>, which is why heads face water.","wrong":{"A":"Nothing bonds to the nonpolar tail.","B":"\"Polar bonds\" isn't the name of this interaction.","C":"The nonpolar end can't hydrogen-bond.","E":"No covalent bonds form."},"note":""},{"ch":5,"n":31,"sec":"05.01","bloom":1,"ctx":null,"stem":"The fluid mosaic model proposed by Singer and Nicolson in 1972 explained that","opts":["the cell membrane was composed of lipids and proteins.","the cell membrane was composed of a phospholipid bilayer between two layers of globular proteins.","the cell membrane was composed of a phospholipid bilayer with globular proteins actually inserted into the bilayer.","the cell membrane was composed of a phospholipid bilayer but the polar ends of the phospholipid molecules were reversed."],"ans":["C"],"why":"Proteins are <b>inserted into<\/b> a fluid bilayer, like tiles in a moving mosaic.","wrong":{"A":"True but too vague — it was known before 1972.","B":"That's the older \"sandwich\" (Davson–Danielli) model that freeze-fracture disproved.","D":"Heads face water."},"note":""},{"ch":5,"n":32,"sec":"05.05","bloom":3,"ctx":null,"stem":"Membrane proteins serve many functions. One of the functions is transportation of substances across the membrane. If a cell biologist placed cells into an environment in which a chemical has been added that blocks the function of only carrier proteins, the process that will be affected is","opts":["active transport.","osmosis.","simple diffusion.","phagocytosis.","pinocytosis."],"ans":["A"],"why":"Pumps that drive <b>active transport<\/b> are carriers. (Facilitated diffusion would also be affected, but it isn't listed.)","wrong":{"B":"Mostly through aquaporins (channels) and the bilayer.","C":"No proteins needed.","D":"Vesicle-based.","E":"Vesicle-based."},"note":"The testbank explanation says carriers always use ATP — not true (GLUT carriers are passive). Active transport is still the only carrier-dependent option listed."},{"ch":5,"n":33,"sec":"05.04","bloom":2,"ctx":null,"stem":"In the process of diffusion, molecules move from areas where","opts":["their concentration is higher to areas where their concentration is lower until an equilibrium is reached.","their concentration is lower to areas where their concentration is higher until an equilibrium is reached.","their concentration is lower to areas where their concentration is higher through specific protein channels or carriers.","their concentration is higher to areas where their concentration is lower using energy from ATP."],"ans":["A"],"why":"<b>High → low<\/b>, until evenly distributed (dynamic equilibrium).","wrong":{"B":"Uphill isn't diffusion.","C":"Uphill isn't diffusion.","D":"Diffusion needs no ATP."},"note":""},{"ch":5,"n":34,"sec":"05.04","bloom":2,"ctx":null,"stem":"Facilitated diffusion is an important method for cells in obtaining necessary molecules and removing other ones. Requirements for facilitated diffusion include","opts":["The carrier molecule must be specific to the molecule that is transported. The direction of movement is always with the concentration gradient, never against the gradient.","The carrier molecule is nonspecific to the molecule that is transported. The direction of movement is always with the concentration gradient, never against the gradient.","The carrier molecule is nonspecific to the molecule that is transported. The direction of movement is always against the concentration gradient, never with the gradient.","The carrier molecule must be specific to the molecule that is transported and an ATP molecule must be attached to the specific carrier. The direction of movement is always against the concentration gradient, never with the gradient."],"ans":["A"],"why":"Carriers are <b>specific<\/b> (shape fits one solute) and facilitated diffusion is <b>downhill only<\/b>.","wrong":{"B":"Carriers are specific.","C":"Wrong on both counts.","D":"Describes active transport."},"note":""},{"ch":5,"n":35,"sec":"05.04","bloom":3,"ctx":null,"stem":"A research laboratory is attempting to collect the content of human red blood cells. The type of solution researchers should use to cause blood cells to lyse (burst) would be","opts":["hyperosmotic.","isosmotic.","hypoosmotic.","osmotic."],"ans":["C"],"why":"Lower solute outside → water rushes in → RBCs swell and burst. Hypotonic lysis is a standard way to release cell contents (e.g., before protein analysis by Western blot).","wrong":{"A":"Cells would shrink (crenate).","B":"No net change — that's why IV saline is 0.9% NaCl.","D":"Not a category."},"note":""},{"ch":5,"n":36,"sec":"05.04","bloom":4,"ctx":null,"stem":"One day during the summer you and some friends make ice cream using an electric ice cream maker. To get the ice cream to form, a mixture of salt and ice is packed around the ice cream maker. A few days later you notice a yellow circle of dead grass where the ice cream maker had been placed. You hypothesize that some of the salt and ice mixture spilled onto the grass and ________.","opts":["froze the grass","was isosmotic to the grass cells causing the yellow circle of dead grass","was hyperosmotic to the grass cells causing the yellow circle of dead grass","was hypoosmotic to the grass cells causing the yellow circle of dead grass"],"ans":["C"],"why":"Salty water outside has more solute than the grass cells → water leaves the cells (plasmolysis) → cells die.","wrong":{"A":"A brief chill on summer ground wouldn't leave a dead patch days later; the salt left behind is what pulls water out of the grass cells.","B":"No net water movement → no damage.","D":"Water would enter cells; walls prevent bursting."},"note":""},{"ch":5,"n":37,"sec":"05.02","bloom":1,"ctx":null,"stem":"What is the main component of an animal cell membrane?","opts":["phospholipids","polynucleotides","aquaporins","glycolipids","cholesterol"],"ans":["A"],"why":"<b>Phospholipids<\/b> form the bilayer.","wrong":{"B":"Nucleic acids.","C":"Proteins present in some membranes.","D":"A minor outer-leaflet component.","E":"Significant in animal membranes, but phospholipids dominate."},"note":""},{"ch":5,"n":38,"sec":"05.04","bloom":4,"ctx":null,"stem":"A scientist performs an experiment in which they create an artificial cell with a selectively permeable membrane through which only water can pass. They inject a 5M solution of glucose into the cell and then place the cell into a beaker of water. After an hour, what effect do you expect to observe?","opts":["Water moves out of the cell","Glucose moves out of the cell","No net change in cell weight","Water moves into the cell","Glucose moves into the cell"],"ans":["D"],"why":"Inside 5 M solute vs. 0 M outside → the cell is hypertonic → <b>water moves in<\/b>. Glucose can't cross.","wrong":{"A":"Wrong direction.","B":"Membrane is impermeable to glucose.","C":"There's a strong gradient.","E":"No glucose outside, and the membrane blocks it anyway."},"note":""},{"ch":5,"n":39,"sec":"05.04","bloom":4,"ctx":null,"stem":"A scientist performs an experiment in which they create an artificial cell with a selectively permeable membrane through which only water can pass. They inject a 5M solution of glucose into the cell and then place the cell into a beaker containing 10M glucose. What effect do you expect to observe?","opts":["Water moves out of the cell","Glucose moves out of the cell","No net change in cell weight","Water moves into the cell","Glucose moves into the cell"],"ans":["A"],"why":"5 M inside < 10 M outside → the cell is hypotonic → <b>water moves out<\/b>.","wrong":{"B":"Glucose can't cross.","C":"There's a gradient.","D":"Wrong direction.","E":"Glucose can't cross."},"note":""},{"ch":5,"n":40,"sec":"05.04","bloom":1,"ctx":null,"stem":"Turgor pressure is observed when a plant cell's environment is ________.","opts":["hypoosmotic","isosmotic","osmosis","hyperosmotic"],"ans":["A"],"why":"Water enters from a <b>hypo-osmotic<\/b> environment, the vacuole swells and presses the membrane against the wall = turgor.","wrong":{"B":"No net uptake → flaccid.","C":"A process, not an environment.","D":"Water leaves → plasmolysis."},"note":""},{"ch":5,"n":41,"sec":"05.05","bloom":1,"ctx":null,"stem":"What initiates the sodium-potassium pump?","opts":["Three sodium ions bind to the cytoplasmic side of the protein.","Three sodium ions are translocated out of the cell.","Phosphorylated pump has low affinity for sodium allowing sodium to leave and potassium to bind.","Two potassium ions are transported into the cell.","ATP binds to the protein which becomes phosphorylated (ADP is released)."],"ans":["A"],"why":"Step 1: <b>3 Na⁺ bind on the inside<\/b> → step 2: ATP phosphorylates the pump → step 3: shape change releases Na⁺ outside → step 4: 2 K⁺ bind → step 5: dephosphorylation releases K⁺ inside.","wrong":{"B":"Step 3.","C":"Steps 3–4.","D":"The final step.","E":"Step 2 — it requires Na⁺ to bind first."},"note":""},{"ch":5,"n":42,"sec":"05.02","bloom":3,"ctx":null,"stem":"Cyclodextrins are a group of compounds capable of removing cholesterol from membranes. The effect most likely to have a large impact on cells as a result of cyclodextrin treatment would be","opts":["increased concentration of transmembrane proteins.","increased permeability of the membrane.","increased membrane fluidity at lower temperatures.","increased membrane fluidity at higher temperatures.","disruption of transmembrane protein structure."],"ans":["D"],"why":"Cholesterol buffers fluidity: at warm (body) temperature its rigid rings <b>restrain<\/b> phospholipid motion. Remove it and the membrane becomes <b>too fluid at higher temperatures<\/b>.","wrong":{"A":"Removing cholesterol doesn't add proteins.","B":"Defensible (cholesterol reduces permeability), but the key targets the fluidity effect.","C":"At low temperature, cholesterol prevents tight packing; removing it makes the membrane <i>less<\/i> fluid.","E":"Proteins stay folded."},"note":"The testbank's own explanation says cholesterol simply increases fluidity — incomplete. Its temperature-dependent buffering is why D is right."},{"ch":5,"n":43,"sec":"05.02","bloom":1,"ctx":null,"stem":"Membrane fluidity is affected by","opts":["temperature, cholesterol, types of fatty acids.","size of molecules, polarity of molecules, temperature.","types of fatty acids, waters affinity for hydrogen bonding.","hydrophilic tails, hydrophobic heads, cholesterol."],"ans":["A"],"why":"<b>Temperature<\/b>, <b>cholesterol<\/b>, and <b>fatty-acid saturation/length<\/b> (kinked unsaturated tails = more fluid).","wrong":{"B":"Size and polarity of solutes affect permeability, not fluidity.","C":"Water's H-bonding doesn't set fluidity.","D":"Heads and tails mislabeled."},"note":""},{"ch":5,"n":44,"sec":"05.04","bloom":3,"ctx":null,"stem":"GABA receptors play an essential role in neurotransmission in the central nervous system. In response to the appropriate signal, these receptors open up and allow Cl<sup>−<\/sup> to flow into the cell. Given this information, GABA receptors can be classified as a","opts":["gated ion channel.","gated carrier protein.","symporter.","Cl<sup>−<\/sup> pump."],"ans":["A"],"why":"Closed until a signal (GABA) binds, then opens a pore for ions to flow down their gradient = <b>ligand-gated ion channel<\/b>. Benzodiazepines work by enhancing this channel's opening.","wrong":{"B":"Carriers bind and flip one solute at a time; \"opens and lets flow\" describes a channel.","C":"Symporters move two solutes together.","D":"Pumps use energy to move ions uphill."},"note":""},{"ch":5,"n":45,"sec":"05.03","bloom":3,"ctx":null,"stem":"Protein X contains four transmembrane domains, a short N-terminus and a long C-terminus. Following protein synthesis, the N-terminus of the protein faces the lumen (the inside) of the ER. After protein X is transported to the cell surface via exocytosis, you would expect the N-terminus of protein
